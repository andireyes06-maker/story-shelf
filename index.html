        {
          id: 15,
          movement: "Movement VI — Public Choice",
          title: "Chapter Fifteen",
          blocks: [
            {t:"p", x:"The courtyard held more people than Kasane had expected, ranged along its edges in a loose, respectful order that still amounted to a genuine audience: a representative from each Clan, standing apart from each other with the particular careful distance of people who didn't fully trust one another to share space without an agenda, a scattering of priesthood officials in Motoi's plain formal robes, and further back, kept respectfully clear of the working area, ordinary attendees who had heard, over the last two days, that something worth watching might happen here."},
            {t:"p", x:"Isato stood near the courtyard's entrance with two of his own people, positioned the way he positioned everything, close enough to act, far enough to let the ceremony actually happen without his presence looming over it. She caught his eye once. He gave her the same short, businesslike nod he'd given her the night before, nothing more, and she found the ordinariness of it steadying rather than dismissive."},
            {t:"p", x:"Tadamori stood near the frame itself, notes set aside now, hands folded the way they'd been folded across the table two days ago. He looked, she thought, genuinely nervous in a way his careful formality couldn't quite smooth over, a man about to test something he'd spent months building and still couldn't be fully certain would hold."},
            {t:"p", x:"Aya stood a little apart from the main gathering, close enough to the Clan representatives to be doing whatever quiet, watchful work her office actually required of her here, though her eyes found Kasane's once, briefly, before the ceremony began, an unreadable expression that might have been simple professional attention or might have been something warmer that she wasn't in a position to show more openly today."},
            {t:"p", x:"“Whenever you're ready,” Tadamori said, quiet, meant for her alone."},
            {t:"p", x:"She stepped into the frame. The morning sun had warmed the courtyard's stones just enough to notice, an ordinary, pleasant detail she filed away out of habit even now, the same way she'd have noted the weather before lighting any burn that actually mattered."},
            {t:"br"},
            {t:"p", x:"The wood felt exactly like wood beneath her palms where she rested them against the old, worn beams, warm from a morning's sun despite the season's cold. Suzu began the rite from just outside the frame's threshold, her voice pitched to carry across the whole courtyard, the same plain, unhurried cadence she used for everything, shaped now into something with real ceremonial weight behind it."},
            {t:"p", x:"“Two things,” Suzu said, “disagreeing, and still speaking. Not resolved. Not silenced. Held.”"},
            {t:"p", x:"Kasane felt the familiar pressure arrive behind both eyes as the words settled over her, the same doubled sensation she'd learned to read as her own body's report of contradiction, and for a moment it felt no different from anything she'd already survived a dozen times over. She let it sit the way she'd learned to let it sit, patient, watchful, waiting for it to resolve into whatever shape it was going to take."},
            {t:"p", x:"It didn't resolve. It sharpened."},
            {t:"p", x:"Suzu kept speaking, her voice steady, unaware yet that anything had changed, the rite's words continuing to build toward whatever close they'd rehearsed together. Kasane felt the pressure behind her eyes climb past anything she'd experienced at the training ground, past even the ridge, a doubling that kept doubling again instead of settling into a stable, manageable wrongness. Her hands, still resting against the beam, began to feel less like they were touching wood and more like they were touching something that had only ever been wearing wood the way a coat wore a person, a wrongness with no clean edge to it, nothing she could point to and name, only a growing certainty that whatever she was actually touching now had very little left to do with carpentry."},
            {t:"p", x:"Something about the frame itself was answering the rite's words, she realized, distantly, the way a struck bell answered a mallet, except the bell in question had apparently been waiting eleven decades or more for exactly this particular note."},
            {t:"br"},
            {t:"p", x:"The sound came first, a low, deep groan from somewhere in the beam above her head, wood and stone complaining together in a register that had nothing to do with any ordinary structural strain. A hairline crack raced along the frame's near post, fast enough to catch the whole courtyard's attention at once, and the flagstones beneath her feet shifted, a fraction, the specific wrongness of ground that had stopped agreeing with itself about which layer it actually belonged to."},
            {t:"p", x:"Someone in the crowd cried out. Tadamori's hand went instinctively toward the frame and then stopped, uncertain, a man realizing in real time that nothing in his careful preparation had told him what to actually do with his hands right now."},
            {t:"p", x:"“Everyone back,” Isato's voice cut across the courtyard, already moving, already directing his people toward the crowd rather than toward Kasane. “Now. Clear the courtyard, clear it now.”"},
            {t:"p", x:"The crowd responded the way a well drilled crowd responds, fast, mostly orderly, a controlled retreat rather than a panic, Isato's people already at the edges funneling people toward the courtyard's far exit with the same unhurried competence they brought to everything. For one brief, almost hopeful moment, it looked like the whole thing might resolve itself through nothing more dramatic than good procedure and a wide enough exit."},
            {t:"p", x:"Suzu didn't move fast enough. She was still close to the threshold, caught between the retreating crowd and the widening crack now spreading across the flagstones directly beneath where she stood, and Kasane watched, with a clarity that felt almost obscenely calm given what she was actually looking at, the stone beneath Suzu's feet begin to separate."},
            {t:"p", x:"There wasn't time to think through what came next in any careful, deliberate way. There was only the specific, immediate fact of Suzu's foot dropping half through a gap that hadn't existed a breath ago, a cry cut short more from surprise than pain, and the certain knowledge, arriving all at once, that the standard evacuation now underway around her would not reach Suzu before the gap finished opening. Isato was already moving toward her, fast, competent, exactly as trained, and exactly, Kasane understood in the same half second, too far away."},
            {t:"p", x:"She had spent months being told, by people who genuinely meant her well, that her instincts needed managing, that her caution cost more than it saved, that the correct answer to an unfamiliar problem was always more information, more testing, more care before committing to anything irreversible. She had learned that lesson honestly, on a ridge that had cost her an arm, and she believed it, mostly, on any day that wasn't this one. None of that arithmetic applied to the half second actually in front of her now. There was no time left to gather more information. There was no version of caution available that didn't end with Suzu hurt, or worse, in front of everyone she cared least about disappointing and everyone she cared most about protecting. There was only Suzu, and the gap, and whatever she herself was actually capable of doing about it."},
            {t:"br"},
            {t:"p", x:"Kasane reached."},
            {t:"p", x:"Not toward the frame this time, toward the specific point of stone giving way beneath Suzu's foot, contact and mass and duration all narrowing down to the smallest, most exact problem she had ever asked her own body to solve: hold this, just this, just long enough. The pressure behind her eyes doubled and then doubled again, one ear going deaf, the whole courtyard swimming briefly into two disagreeing pictures the way the hillside once had on her own mountain, and beneath her hands, which she didn't remember choosing to extend, the stone answered."},
            {t:"p", x:"It didn't heal. It didn't seal. It simply stopped, mid-collapse, held at the exact fractured angle it had already reached, the way she might have held a burn's collapsing wall steady with her own body for exactly as long as someone else needed to get clear and not one second longer. She had no name for what she was actually doing, no tidy category to file it under the way she'd filed the stone at the training ground or the wood in Isato's earlier trials. It was closer, if it was close to anything, to the discipline of managing a burn's draft continuously rather than lighting it once and stepping back: not a single act of holding, but a constant, unbroken correction, moment by moment, against a collapse that wanted, very badly, to finish happening."},
            {t:"p", x:"Her whole body felt like it was arguing with something much larger than itself and somehow, for now, not losing."},
            {t:"p", x:"“Move,” she said, or tried to, her voice coming out thinner than she meant it to. “Now. While I have it.”"},
            {t:"p", x:"Suzu's face, for one long, suspended moment, showed something that wasn't quite understanding, the particular look of a person being asked to trust a sensation she had no framework for interpreting. Then she moved anyway, dragging her caught foot free with a small, sharp cry, trusting the instruction over the evidence of her own eyes, which told her that the ground beneath her should not currently be holding together at all."},
            {t:"p", x:"Isato was already there, one arm hauling her the rest of the way clear before Kasane had finished the word, and the moment Suzu's weight left the fractured stone, Kasane felt the whole effort go suddenly, mercifully easier, the way a load felt lighter the instant someone else took part of its weight."},
            {t:"p", x:"She held it a moment longer anyway, until she was certain the courtyard behind her had actually cleared, and then let go."},
            {t:"br"},
            {t:"p", x:"The crack finished what it had started the moment she released it, stone folding inward with a low, grinding finality, dust rising in a slow column where the frame's near post had been. The old carved beams she'd admired the evening before came down with it, centuries of worn patterns collapsing into an ordinary pile of broken wood in less time than it took to properly register the loss. Nobody was standing anywhere near it anymore. The whole courtyard had gone silent in the specific, total way a crowd went silent when it had just watched something it had no existing framework to file away."},
            {t:"p", x:"Kasane's legs gave out before she'd finished deciding whether to stay upright. She was aware, distantly, of hitting the flagstones on one knee, of blood running warm and sudden from her nose, of a headache arriving behind both eyes with a weight that made the ridge feel, in retrospect, almost gentle by comparison. Her vision doubled once, badly, the whole courtyard splitting into two disagreeing versions of itself before grinding back into a single, aching picture. Her hands, when she looked at them, looked entirely ordinary, which felt like the strangest part of all of it, that something capable of doing what they'd just done could still look like nothing more than a pair of tired, work worn hands."},
            {t:"p", x:"Someone's hands were on her shoulders. She thought, without much certainty, that they might be Isato's."},
            {t:"p", x:"“Report,” his voice said, close, familiar, the same word he always used."},
            {t:"p", x:"“Tired,” she managed. “Not hurt. I don't think.” She found she couldn't be entirely sure of the second part yet."},
            {t:"p", x:"Suzu was there too, kneeling beside her despite her own ankle clearly paining her, her face pale but present, entirely herself even now. “You're bleeding,” she said, quiet, not quite steady."},
            {t:"p", x:"“So are you, probably, somewhere I can't see yet.”"},
            {t:"p", x:"“Probably.” Something that might have been a laugh escaped Suzu, thin and startled, entirely without humor in it and entirely genuine anyway. “We can compare notes once we're both sitting somewhere that isn't currently falling apart.”"},
            {t:"p", x:"Around them, the courtyard's silence was already beginning to break, low voices rising at its edges, Clan representatives turning to each other with expressions Kasane was too spent to read clearly, priesthood officials staring at the ruined post with the particular stillness of people whose entire professional framework had just been handed a fact it had no ready place to put. Somewhere near the courtyard's rear, a single voice rose above the general murmur, too far away to make out the words, and was almost immediately joined by others, the low, unmistakable sound of a crowd beginning to talk itself into believing what it had just watched."},
            {t:"p", x:"Isato crouched beside her, checking her over with the same practiced hands he'd used at the ridge, and said nothing about anything beyond her own immediate condition, which she found, distantly, that she was grateful for. Aya had appeared at some point too, closer than her official position probably called for, her face doing a poor job of hiding something that might have been fear or might have been an entirely different, harder feeling that Kasane didn't yet have the strength to try naming."},
            {t:"p", x:"Whatever all of that murmuring was going to mean, whatever it was going to cost her once the meaning actually arrived, hadn't reached her yet. For now there was only the flagstone under her knee, Suzu's hand finding hers without either of them deciding to reach for the other, and the ordinary, overwhelming relief of a fight that had ended with everyone she could see still breathing."}
          ]
        },
        {
          id: 16,
          movement: "Movement VI — Public Choice",
          title: "Chapter Sixteen",
          blocks: [
            {t:"p", x:"By the time anyone thought to help Kasane fully to her feet, the courtyard had already stopped being the center of anything. Word had clearly outpaced the actual event, spreading up through the Rite Grounds faster than any single runner could have carried it, because within a quarter hour, Hunter teams from at least three Clans had arrived at the shrine complex's outer gate, moving with the specific urgency of people who'd been told a Gate had opened somewhere and hadn't yet been told it hadn't, not exactly."},
            {t:"p", x:"Isato met them at the gate himself, already directing traffic before they'd finished arriving. “No breach,” she heard him say, more than once, to team after team. “Localized structural failure at a consecrated site. Contained. I need eyes on the surrounding foundations, not the courtyard itself, in case whatever caused this has a wider footprint we haven't found yet.”"},
            {t:"p", x:"Some of the arriving Hunters glanced toward Kasane as they passed, quick, assessing looks that catalogued her the way Isato himself once had, a variable to be understood rather than a person to greet. She'd expected that to bother her more than it did. After the last several months, being read as a fact worth cataloguing felt, if anything, like the most familiar experience of the entire day."},
            {t:"p", x:"Nobody argued with him. He said it with the same flat, procedural certainty he brought to everything, and Kasane watched Hunters who'd never met him before falling into his direction anyway, the particular authority of a man who clearly knew exactly what he was doing even when the situation itself refused to fit any doctrine cleanly."},
            {t:"p", x:"Teams fanned out along the shrine complex's foundations within minutes, checking wall by wall for anything resembling the wrongness that had opened beneath Suzu's feet, calling clear findings back to each other in short, practiced phrases she was coming to recognize as their own working language. A Shirogane Warden arrived partway through, conferred briefly with Isato in a tone too clipped to overhear, and left again just as quickly, apparently satisfied enough with whatever answer he'd been given not to linger. Nobody, as far as Kasane could tell, found anything else wrong anywhere in the wider complex. Whatever had happened seemed to belong entirely to the one courtyard, and to the one frame within it, a fact that struck her as somehow more unsettling than if the danger had turned out to be everywhere."},
            {t:"br"},
            {t:"p", x:"Suzu sat a short distance away, her ankle bound now by someone more qualified than either of them, staring at the ruined post with an expression Kasane hadn't seen on her before, something closer to fear than the pain alone accounted for."},
            {t:"p", x:"“They're going to ask why the frame reacted to my rite specifically,” Suzu said, before Kasane had even fully settled beside her. “Not why the frame reacted. Why my words were the ones it reacted to. There's a difference, and I already know which question most of Motoi is actually going to ask.”"},
            {t:"p", x:"“You didn't do anything wrong.”"},
            {t:"p", x:"“I know that. Knowing it and surviving the asking are different things.” Suzu's hands were steady, folded in her lap, though something in her voice wasn't. “I built something honest, with real care, and it nearly killed the person I built it for. I don't think anyone in that courtyard today is going to remember the honesty as clearly as they remember the collapse.”"},
            {t:"p", x:"“I'll tell them exactly what happened. All of it. That you did nothing but try to help me properly, for the first time anyone official has.”"},
            {t:"p", x:"“You will. I believe that.” Suzu managed something that wasn't quite a smile. “I'm not sure it will matter as much as either of us would like it to. Institutions remember failures longer than they remember the good faith behind them. I learned that a long time before I ever met you.”"},
            {t:"p", x:"“What actually happens to you, if they decide it was your failure.”"},
            {t:"p", x:"“Nothing dramatic, probably. A quiet transfer to duties considered less consequential. A note in a record somewhere that follows me for the rest of my career without ever being stated outright.” Suzu said it plainly, the same honesty she'd brought to every conversation they'd had. “I've watched it happen to other priests, over smaller mistakes than this one is going to look like from the outside. I always told myself I'd have handled it more gracefully than they did. I'm discovering today that grace is considerably easier to imagine than to actually produce.”"},
            {t:"p", x:"“Then let me help you produce it. Whatever account you need me to give, I'll give it exactly as you need it given.”"},
            {t:"p", x:"“That's kind. It's also not quite how any of this works, and I think we both already know that.” Suzu reached over and squeezed her hand once, briefly, before letting go. “Thank you for meaning it anyway. I don't think anyone's offered me that particular kindness in longer than I can remember, whether or not it turns out to be useful.”"},
            {t:"br"},
            {t:"p", x:"The crowd, kept at a respectful distance now by a loose cordon of Hunters, had already begun sorting itself into competing versions of what it had just witnessed, close enough that Kasane could catch fragments without meaning to. One cluster spoke in hushed, frightened tones about an attack, though on whom or by what nobody seemed quite able to say. Another, further along, spoke instead of a miracle, an anomaly turned savior in the space of half a minute, already reaching for language with more reverence in it than Kasane felt entitled to. A third group, quieter than the other two, simply argued among themselves about whether Shirogane's own site had failed them, an old, mismanaged relic finally showing its age at the worst possible moment."},
            {t:"p", x:"A fourth voice, closer than the rest, wondered aloud whether this meant the Boundary Rite itself was somehow cursed this year, an idea that seemed to spread faster among the crowd's edges than any of the more careful theories further in, the way a frightening story always traveled faster than an accurate one. Kasane thought of Genzou's own observation about rumor and sense moving at different speeds through this valley, and found the thought oddly steadying, a piece of ordinary wisdom that turned out to apply just as well to a castle-city as it did to a market town."},
            {t:"p", x:"None of them, she noticed, were talking about Suzu at all, except as a detail inside someone else's larger story. She filed that away without knowing yet what to do with it."},
            {t:"p", x:"Aya moved through all of it with the specific, unhurried competence Kasane had first seen in a collection post months ago, speaking quietly to officials here, redirecting a curious onlooker there, managing the actual shape of what got said and to whom with a fluency that made the whole chaotic afternoon look, for brief stretches, almost governable."},
            {t:"p", x:"“This is the part I'm actually good at,” Aya said, finding a moment to crouch beside Kasane between one conversation and the next. “Not fixing what happened. Making sure what gets said about it starts out at least roughly true. It's a smaller job than it sounds, and a more important one than most people credit.”"},
            {t:"p", x:"“What will Tsukishiro say about it.”"},
            {t:"p", x:"“Not yet. Today I'm working, not deciding.” Aya's face gave away nothing further, though something in the set of her shoulders suggested the question would come, and soon, from people considerably less patient than she was being right now. “I will tell you this much. Whatever gets decided, it will not be decided today, and it will not be decided by any single office acting alone. You've made yourself impossible to file quietly. That cuts more than one way, and I genuinely don't know yet which way it cuts hardest for you.”"},
            {t:"p", x:"“Is that supposed to be comforting.”"},
            {t:"p", x:"“No. It's supposed to be accurate. I've found the two rarely arrive together where you're concerned, and I'd rather keep giving you the accurate one.” Something almost gentle crossed Aya's face before she stood to return to her work. “For what it's worth, from where I'm standing, today went about as well as an uncontained disaster is capable of going. Nobody died. That's not nothing, whatever else gets said about it in the coming days.”"},
            {t:"br"},
            {t:"p", x:"She caught sight of Moritaka once, near the courtyard's outer edge, standing perfectly still amid the general motion around him, watching the ruined post with an expression she couldn't read at this distance, cold or calculating or simply absorbing new information, she genuinely couldn't tell which. He didn't approach. He didn't need to. Whatever he was thinking, she understood, was already being filed somewhere she had no access to yet."},
            {t:"p", x:"Renji she saw only briefly, further back among the retreating Akaishi contingent, his usual composure entirely gone for once, replaced by something that looked, from this distance, almost like genuine shock rather than any kind of calculation. He didn't look toward her. She wasn't certain, in that moment, that he was looking at anything in particular at all."},
            {t:"p", x:"Karasu's delegation had drawn closer than she expected, no longer content to stay at the crowd's edge, several of them speaking in low, urgent voices among themselves. She thought she saw Shion near the front of them, her expression harder to read than either Moritaka's or Renji's, something that might have been hope trying very hard not to look like hope in front of witnesses. Kasane thought of the stone Shion had brought her, still sitting unexplained in some Karasu archive, and wondered, distantly and without any way to answer it yet, whether today had just made that unanswered question feel more urgent to them or simply more painful."},
            {t:"p", x:"None of the three delegations approached her. She hadn't expected any of them to, not yet, not with this much dust still literally settling in the air above the courtyard."},
            {t:"br"},
            {t:"p", x:"By the time the light started failing, Kasane's headache had settled into a dull, constant pressure she suspected would still be there tomorrow, and her hands, when she flexed them, felt slightly less entirely her own than they had that morning, a fact she noted and set aside for later rather than examining closely tonight."},
            {t:"p", x:"Aya walked her partway back down toward the lower terrace lodging, quiet now that the day's most urgent work had finally slowed. Neither of them spoke much on the way down, the silence comfortable in a way it hadn't been between them for weeks, two people who'd each spent the entire day doing the only kind of work they actually knew how to do under the circumstances."},
            {t:"p", x:"Kasane stopped once, near the same bend in the path where she'd climbed up so hopefully the evening before, and looked back at the shrine complex above them, lantern light already being set up around the ruined courtyard for whatever official work would continue after dark. Small figures moved between the lights, still working, still checking, still doing the patient, unglamorous labor that would presumably continue long after anyone stopped watching."},
            {t:"p", x:"It looked smaller from here than it had felt standing inside it, the way most disasters did once you'd put a little distance between yourself and them. It didn't look survivable in the way a home did, or forgettable in the way an ordinary bad day eventually became. It looked, simply, like the exact place where something had stopped being containable, permanently, in front of enough witnesses that no single office, however competent, would ever be able to put it fully back into a private file again."},
            {t:"p", x:"Below her, the lower terrace's noise had already resumed its usual evening rhythm, the noodle stall doing its ordinary brisk business, laughter drifting up from somewhere she couldn't see, an entire cheerful economy that had no idea, or perhaps simply no reason to care yet, that the whole shape of the week above it had just changed. She found she didn't resent the ordinariness of it. If anything, watching it continue steadied her more than any of the day's official responses had managed to."},
            {t:"p", x:"She had wanted, since the very first morning all of this began, to become a documented fact with rules attached, something ordinary institutions could manage without her having to manage herself. She understood, standing on that path in the falling dark, that she had gotten exactly that, finally and completely, in a form no one, least of all her, had actually asked for. It had not arrived through cooperation, or caution, or careful mastery, the three strategies she'd spent this whole year testing to failure one at a time. It had arrived because she'd chosen, without stopping to calculate the cost, to keep Suzu from being crushed in front of everyone who mattered. That choice, and not any document Aya or Moritaka or Tadamori could ever have drawn up on her behalf, was the actual thing every Clan and the whole priesthood were now going to have to answer to, all at once, whether any of them had wanted the question or not."}
          ]
        },
        {
          id: 17,
          movement: "Movement VII — Consequence",
          title: "Chapter Seventeen",
          blocks: [
            {t:"p", x:"She woke to a headache that hadn't moved overnight, the same dull, constant pressure behind both eyes she'd gone to sleep with, and lay still for a while doing the same careful inventory she'd learned to do after every cost the Stitch had ever charged her. Fingers, all present, all answering when asked. Legs, stiff but willing. The dried blood at her nose, flaking now, cleaned away easily enough with the corner of a damp cloth."},
            {t:"p", x:"It was only once she was sitting up, trying to picture the exact color the mist had turned that first morning on the mountain, a detail she'd once been able to summon instantly, that she found the memory arriving slower than it should have, its edges softer, less certain, the way a smell faded faster than a sound. She tried it twice more, testing it the careful, incremental way she'd have tested any unfamiliar reading, and got the same faint, blurred result both times, no worse than the first attempt but no better either."},
            {t:"p", x:"She sat with that for a long moment, turning it over the way she'd have turned over any unexpected reading. Tired, she told herself. Nothing more sinister than tired. Bodies remembered things worse after a bad night, and hers had earned several bad nights in a row lately. It was a reasonable explanation. It was the kind of explanation she'd have accepted instantly from anyone else describing the same small, forgettable symptom, and she chose, deliberately, to extend herself the same reasonable doubt."},
            {t:"p", x:"She decided not to test the memory again just yet, and got up to face the rest of the day instead, moving slowly, the lodging room's narrow window already bright with a morning that had started without asking whether she was ready for it. The lower terrace's noise had resumed exactly where it had left off the night before, carts and vendors and someone singing badly a few doors down, entirely unbothered by anything that had happened up at the shrine complex. She found she was grateful for it in a way she hadn't expected, an ordinary morning insisting on being ordinary regardless of what she'd survived to see it."},
            {t:"br"},
            {t:"p", x:"Isato came by mid-morning, brief and businesslike as always, checking her over with the same practiced hands he'd used at the ridge and again in the courtyard, apparently satisfied enough by what he found not to say much about it. He'd brought one of his own crew along this time, the woman with the once-bandaged forearm, now healed, who set down a small package of dried meat and bread on the table without comment, the same practical, unspoken kindness Kasane had come to associate with everyone who actually worked under him."},
            {t:"p", x:"“Eat something before you try standing for too long,” the woman said, already turning to go. “Whatever you spent yesterday, it wasn't only Ura-side. Ordinary hunger doesn't care what caused it.”"},
            {t:"p", x:"It was, Kasane thought, exactly the kind of advice nobody else today had thought to give her, and probably the most useful."},
            {t:"p", x:"“You'll ache for a week, probably longer,” he said. “Nothing here that won't mend on its own schedule. I've seen worse recoveries from smaller uses.”"},
            {t:"p", x:"“Is that meant to be reassuring.”"},
            {t:"p", x:"“It's meant to be accurate. I'll leave the reassuring to people better suited to it.” Something in his voice, though, carried more warmth than the words alone accounted for. “For what it's worth, what you did yesterday was clean. Precise. Exactly the kind of judgment under pressure I've spent months telling you that you had, whether either of us believed it fully at the time.”"},
            {t:"p", x:"“Is that your version of an apology.”"},
            {t:"p", x:"“It might be.” He allowed himself something close to a smile, brief and real. “I've never been especially good at the other kind.”"},
            {t:"p", x:"“What happens to the trials now.”"},
            {t:"p", x:"“They continue, once you're fit for them. Differently, probably.” He considered his own answer before finishing it. “Kuromori's not going to argue anymore about whether the time spent on you is worth it. That argument ended yesterday, whether or not anyone's said so to me directly yet. What replaces it, I honestly don't know. Probably more attention than either of us wants, dressed up as more resources than we've had before.”"},
            {t:"p", x:"“Is that good or bad.”"},
            {t:"p", x:"“Both, the way most things involving you tend to be.” He said it without irony, an observation rather than a complaint, and left not long after, the same economical departure he always made."},
            {t:"br"},
            {t:"p", x:"Aya arrived not long after Isato left, her lacquered case in hand out of habit rather than necessity, since there was little left today that needed formally recording. She sat across from Kasane with the particular stillness of someone who had also not slept enough."},
            {t:"p", x:"“Word's already three days ahead of where it should be,” Aya said, without preamble. “A courier who left the city yesterday afternoon reported it reaching a market town two valleys over by this morning, which isn't possible by any honest measure of travel time. People are simply repeating it faster than any single voice could actually carry it, each version a little different from the last.”"},
            {t:"p", x:"“What are the versions saying.”"},
            {t:"p", x:"“Depends who you ask. One has you saving the whole Rite Grounds from collapse. Another has you causing the collapse in the first place and only stopping it once you'd frightened yourself. A third, I'm told, has already turned Suzu into either a saint or a fraud depending on which valley's telling it.” Aya said this with the flat, professional distaste of someone who dealt in accurate information for a living and found the whole business faintly offensive on principle. “None of it is quite true. All of it is going to matter regardless of that fact, which is the part I actually have to manage.”"},
            {t:"p", x:"“Is there anything true I could say that would help.”"},
            {t:"p", x:"“Not today. Today the story is moving too fast for accuracy to catch it. In a week, once it's slowed down enough to actually argue with, the truth will matter again.” Aya's expression softened, fractionally. “I'll tell you when that day comes. For now, rest. You're not going to out-argue a rumor with a headache this size.”"},
            {t:"p", x:"“Does Tsukishiro have a version they're telling.”"},
            {t:"p", x:"“Not officially. Not yet.” Aya's answer came slower than her usual pace, and Kasane understood, without being told, that this particular question sat closer to the boundary of what Aya was actually permitted to say to her right now than most of their conversations did. “There will be one. There always is, eventually, once enough people above me have finished deciding what version of events is most useful to have on record. I'd rather not guess at its shape before it exists. Guessing wrong in either direction would help nobody, least of all you.”"},
            {t:"p", x:"“When there is one, I'll make sure you hear it from me before you hear it from anyone else. That's the one promise I can actually keep today.”"},
            {t:"p", x:"“That's more than I expected.”"},
            {t:"p", x:"“It's less than you deserve, given everything. It's simply what's currently available.” Aya stood to go, the lacquered case gathered back under one arm out of pure habit. “Rest. Truly. The next several days are going to ask a great deal of you, and none of it will wait for you to be ready.”"},
            {t:"br"},
            {t:"p", x:"She found Suzu resting in a room two doors down, her bound ankle propped on a folded blanket, a cup of tea gone cold beside her that she didn't seem to have touched."},
            {t:"p", x:"“They're sending someone from Motoi proper to review the whole procedure,” Suzu said, before Kasane had even finished sitting down. “Not to punish me, they say. To understand what happened, they say. I've heard both of those phrases before, from people who meant something closer to the opposite by the time the review actually concluded.”"},
            {t:"p", x:"“Do you want me to say something to them.”"},
            {t:"p", x:"“Not yet. Maybe not at all. This is mine to carry through, one way or another, and I'd rather not borrow your voice before I've tried using my own.” Suzu managed a small, tired smile. “Ask me again in a week. I may have a very different answer once I know what I'm actually facing.”"},
            {t:"p", x:"“For what it's worth,” Kasane said eventually, “whatever this costs you, it wasn't a mistake. Not the rite. Not the honesty you built it out of.”"},
            {t:"p", x:"“I know that, some hours better than others.” Suzu looked down at her bound ankle, turning it a careful half inch to test how much it had improved since morning. “I built the truest thing anyone has offered you all year, and it nearly killed you both. I'm allowed to hold both of those facts at once without one of them cancelling the other out. I think you, of anyone, understand that particular arithmetic better than most people would.”"},
            {t:"p", x:"“I do.”"},
            {t:"p", x:"“Then you understand why I'm not going to pretend today feels like a fair trade, even though I'd make the same choice again tomorrow.”"},
            {t:"p", x:"They sat together a while in the kind of silence that didn't need filling, two people whose bodies were both, in their own separate ways, still counting up what yesterday had actually cost."},
            {t:"br"},
            {t:"p", x:"The message from Genzou arrived that evening, carried by a merchant's courier who'd clearly been paid extra to find her specifically rather than wait for official channels. His handwriting was as plain and economical as his speech, no wasted words, no attempt at comfort dressed up as anything other than what it actually was."},
            {t:"p", x:"*Heard three versions before breakfast, believed none of them fully. Tell me yourself when you can hold a brush steady enough to write more than this line back. Contract closed, for what it's worth, favorably, no thanks needed to anyone but the two of us. Come home when they let you. The mountain's still there. So is the burn, mostly. So am I.*"},
            {t:"p", x:"She read it twice, and found her eyes stinging in a way that had nothing to do with the headache, and set it carefully on the small table beside her bed rather than answering it that night. Some things deserved a steadier hand than she currently had to give them."},
            {t:"p", x:"*The mountain's still there. So is the burn, mostly. So am I.* Three plain sentences, entirely without ornament, and somehow the most complete accounting of the whole day that anyone had managed to give her yet. Everyone else's version came weighted with implication, with what it meant institutionally, politically, theologically. Genzou's came weighted with nothing at all except the specific, uncomplicated fact of things that were still standing."},
            {t:"p", x:"She thought about writing back that night after all, just enough to say she was safe, and got as far as finding paper before her hand reminded her, with a fresh ache through the knuckles, that tonight wasn't the night for even that small an effort. Tomorrow, she decided. He'd waited this long already. One more day of not knowing for certain wouldn't undo what his letter had already told her: that whatever had happened here, home was still exactly where she'd left it, waiting for her to be well enough to come back to it."},
            {t:"br"},
            {t:"p", x:"She spent the last of the evening doing the one thing that still answered reliably to her own two hands: mending a small tear in her travel pack, slow, careful stitching by lamplight, needle and thread asking nothing of her except patience and a working set of fingers, exactly the kind of ordinary, undemanding work the whole impossible year had somehow never managed to take away from her."},
            {t:"p", x:"Her hands didn't hesitate over the work, didn't blur or falter the way that single memory of the mist's color had. She watched them move, competent and entirely her own, and found some real comfort in the specific, boring reliability of a needle going in and out of canvas exactly where she told it to. Whatever else the last two days had cost her, this much, at least, still worked the way it always had."},
            {t:"p", x:"She finished it long after she needed to, not because the repair required that much time, but because the doing of it, plain and small and entirely within her own control, was worth more tonight than almost anything else the day had offered her."}
          ]
        },
        {
          id: 18,
          movement: "Movement VII — Consequence",
          title: "Chapter Eighteen",
          blocks: [
            {t:"p", x:"“E rank,” Aya said, setting the confirmed record on the table between them. “Traced. Effective as of yesterday's review. Not a guess this time, not a placeholder while everyone waited to see what you actually were. An evidence based finding, built on demonstrated, controlled capability under real pressure, which is a different thing entirely from the number you were given the day we met.”"},
            {t:"p", x:"Kasane looked at the record for a long moment, the same flat, official language Aya's whole office ran on, and found herself remembering, with a clarity that surprised her, the exact hour in Kurokawa's registry when a clerk had read out her first rank without ceremony, a fact rather than a milestone, and how little it had actually changed about her life afterward. This felt different only in the specific way that mattered: it had been earned by something real, rather than assigned to manage an unresolved question."},
            {t:"p", x:"“Traced,” she repeated. “What does that actually change, practically.”"},
            {t:"p", x:"“Field observation under supervision, formally permitted rather than merely tolerated. Less than you'd hope, more than nothing.” Aya said it plainly, the same honest calibration she always gave. “You're still restricted under Shirogane's earlier terms, unless and until that gets separately revisited. But the record now reflects something closer to true, and a true record matters more, over time, than most people currently trying to use you for something would like you to believe.” She paused. “One more thing. Karasu reached out again. Not a request this time. A message, saying they're watching what happened here with renewed interest, and would welcome the chance to speak again once things have settled.”"},
            {t:"p", x:"“What does that mean.”"},
            {t:"p", x:"“I genuinely don't know yet. Possibly nothing more than hope looking for somewhere new to live.” Aya gathered her things to go, then paused at the door, something more personal crossing her face than she usually let show during official business. “For what it's worth, I'm glad the number finally matches something true. I've spent months carrying a case file that felt like a guess wearing the clothes of a certainty. This one, at least, I can stand behind honestly.”"},
            {t:"p", x:"“Does that matter to you. Personally, not professionally.”"},
            {t:"p", x:"“More than I'd have admitted to you a season ago.” Aya allowed herself something close to a smile before she left. “I wouldn't build anything on Karasu's message. I also wouldn't dismiss it entirely. They've earned neither reaction from you, and both, depending on the day.”"},
            {t:"br"},
            {t:"p", x:"Moritaka and Isato arrived within an hour of each other, and Kasane understood, the moment she saw them together in the same room, that neither visit had been coordinated with the other, and that both men had decided, independently, that today was the day to say their piece regardless of who else happened to be present."},
            {t:"p", x:"“The reveal changes my position,” Moritaka said, without preamble, “though perhaps not in the direction you'd hope. You've now demonstrated real, controlled capability under genuine pressure. Shirogane reads that as an argument for tighter containment, not looser. An uncontrolled anomaly is a risk of unknown size. A demonstrated, powerful capability is a risk of known size, and known risks require known safeguards.”"},
            {t:"p", x:"“She saved someone's life,” Isato said, flat, before Kasane could answer for herself. “That's not a data point about danger. That's a data point about judgment. I've spent months building an assessment of her actual character under pressure, and everything in the courtyard confirmed it rather than complicating it.”"},
            {t:"p", x:"“I don't dispute her judgment in that specific instance.” Moritaka didn't raise his voice, the same procedural calm he brought to everything. “I dispute that one correct choice, made under crisis, is sufficient evidence to relax oversight built for exactly the kind of scenario where a choice might not be correct next time.”"},
            {t:"p", x:"“Then build oversight around actual competence instead of blanket restriction. Kuromori is prepared to take a considerably larger role in her supervised development, given what we now know she's capable of doing safely, under the right guidance.” Isato's tone stayed level, though something in it had real conviction behind it now that hadn't been there in earlier, more provisional conversations. “That's not sentiment. That's a resource I don't intend to leave on the table because Shirogane would rather manage fear than manage capability.”"},
            {t:"p", x:"“A resource,” Moritaka repeated, something almost dry entering his otherwise perfectly level voice. “You speak of her as though she were a stockpile of grain rather than a person capable of independent judgment.”"},
            {t:"p", x:"“I speak of her the way I speak of anyone I'm assessing for fieldwork, because that's the actual question in front of me. You're welcome to speak of her as a risk profile instead, since that's the actual question in front of you. Neither of us is describing the whole person. We're both doing our jobs.” Isato's answer came without heat, matter of fact in the way he delivered everything. “The difference is that my job produces something useful if I'm right about her. Yours produces nothing but continued restriction whether you're right or wrong, because caution never has to prove itself the way trust does.”"},
            {t:"p", x:"“Caution that turns out to be unnecessary costs comfort. Trust that turns out to be misplaced costs lives, potentially many of them, in a crowded space exactly like the one she was standing in three days ago.” Moritaka's voice stayed exactly as calm as it had been from the start, though something in the precision of the words suggested he'd rehearsed this particular exchange more than once already, likely with people considerably less direct than Isato was being with him now. “I don't say this to diminish what she did. I say it because the same capability that saved one life in a contained courtyard could, under different circumstances, fail to contain something considerably larger. Shirogane's position isn't built on fear of her specifically. It's built on the reasonable expectation that today's controlled success doesn't guarantee tomorrow's.”"},
            {t:"p", x:"“Then supervise the growth instead of freezing it in place. A restricted, undeveloped ability is not safer than a trained one. It's simply differently dangerous, in ways nobody's bothered accounting for because they're less visible than the alternative.” Isato glanced toward Kasane for the first time since the argument had started, brief and pointed. “Ask her which version of this she'd choose, if anyone actually asked her opinion on her own case for once.”"},
            {t:"p", x:"“I'm asking her nothing of the sort today. This is an institutional disagreement, not a referendum on her preferences.” Moritaka's gaze didn't waver, though something in it suggested he'd noted the challenge regardless. “Her preferences will matter eventually. They don't currently outrank two Clans' competing assessments of collective risk.”"},
            {t:"p", x:"They went back and forth like that for some time, two competent men arguing a real, substantive disagreement neither of them was going to concede today, and Kasane found herself, for once, mostly a spectator to her own case rather than its subject, watching two institutions genuinely disagree about what she was worth protecting against versus protecting."},
            {t:"p", x:"“I don't think either of you is entirely wrong,” she said, once they'd both run out of new ground to cover. “I also don't think either of you is going to convince the other today. I'd rather you both kept arguing than settled on whichever answer was simply easier to agree on.”"},
            {t:"p", x:"Something that might have been respect crossed both their faces, briefly, in almost identical shapes, and neither one commented on how alike the expression looked on two men who otherwise agreed on almost nothing."},
            {t:"br"},
            {t:"p", x:"Renji found her alone that evening, and she knew before he'd said a word, from the particular stiffness in how he held himself, that whatever he'd come to say wasn't going to be easy for either of them."},
            {t:"p", x:"“I got the appointment,” he said. “I wanted you to hear it from me before you heard how, from someone less inclined to tell you honestly.”"},
            {t:"p", x:"“How, then.”"},
            {t:"p", x:"“I stood before the review committee and told them the Rite incident was consistent with everything Akaishi's old records suggest about hidden bloodlines manifesting under extreme pressure. That your control, under crisis, at a site with real Ura significance, was exactly the kind of demonstration the theory would predict.” He said it without flinching, which she found, oddly, harder to be angry at than if he'd tried to soften it. “It worked. My rival had nothing that concrete to counter it with. I have the appointment because of what happened to you in that courtyard, and I used it deliberately, knowing exactly what I was spending to get it.”"},
            {t:"p", x:"“You used the worst day of my life as evidence for a theory you know isn't confirmed.”"},
            {t:"p", x:"“Yes.” No defense offered, no qualification. “I could tell you I had no other option. That wouldn't be true. I had the option of losing to my rival and staying honest with you instead, and I chose the appointment. I'm telling you plainly because you deserve to know exactly what kind of man actually took it, not a version I've dressed up to be easier to forgive.”"},
            {t:"p", x:"“That's not an apology.”"},
            {t:"p", x:"“No. I don't think I'm owed one from you for being honest about what I did, and I don't think you're owed a smaller version of the truth just because the real one costs me something to say.”"},
            {t:"p", x:"“Did you consider asking me first. Before you stood in front of that committee.”"},
            {t:"p", x:"“I considered it for about as long as it takes to light a lamp, and decided against it, because I already knew what you'd say, and I didn't want an honest no standing between me and something I'd already decided to do regardless.” He said this steadily, watching her reaction without flinching from it. “That's its own kind of dishonesty, I understand that. Choosing not to ask so I couldn't be told no. I'd rather admit that plainly than pretend the omission was somehow kinder.”"},
            {t:"p", x:"“It wasn't kinder. It was just quieter.”"},
            {t:"p", x:"“Yes.” He held her gaze, none of his usual performance left in it. “I'd like to still matter to you, after this. I understand if I don't get to, not for a while, maybe not ever. I'd rather lose that honestly than keep it by lying to you about how I got here.”"},
            {t:"p", x:"She didn't have an answer for him that night, and told him so, and he accepted that without arguing, and left the same way he'd arrived, carefully, a man who'd spent something real and wasn't yet certain what it had actually bought him."},
            {t:"p", x:"She sat with the whole exchange for a long while after he'd gone, turning it over the way she'd turn over any account that didn't balance cleanly. He hadn't lied to her. That fact sat oddly next to how much the truth still hurt, and she found herself, for the first time all year, genuinely uncertain which mattered more when weighing whether to trust someone again: what they'd actually done, or how honestly they'd told her about it afterward. She didn't reach an answer that night. She wasn't certain there was a clean one waiting to be found."},
            {t:"br"},
            {t:"p", x:"Suzu's message arrived the next morning, brief, in her own hand rather than delivered secondhand. *Review concluded. No formal fault found, no formal vindication either. Reassigned to a smaller shrine in the Marches, framed as routine rotation, which everyone involved understands not to be. I am, on balance, more relieved than I expected to be. I will write properly once I've had time to actually feel what I currently only understand.*"},
            {t:"p", x:"Kasane read it twice and found she believed every careful word of it, the same plain honesty Suzu had brought to every conversation they'd ever had, even this one, delivered at a distance, about an outcome that was neither the disaster nor the vindication either of them had hoped for. She thought of the Consecration Shrine's courtyard, the weathered beams she'd admired the evening before everything went wrong, and understood that Suzu was losing something real too, quietly, in a smaller shrine somewhere in the Marches, for the crime of having tried something honest before anyone else had been willing to."},
            {t:"p", x:"She resolved to write back properly, once she had something more useful to offer than sympathy, and set the note carefully aside with Genzou's, two small, honest accounts in a day otherwise built entirely out of institutional positioning."},
            {t:"br"},
            {t:"p", x:"She wrote back to Genzou that night, at last, her hand steady enough now to manage more than one line."},
            {t:"p", x:"*Alive. Costed more than I expected, less than it could have. E rank now, for whatever that's actually worth. Coming home once they let me, which I don't yet know when that will be. The mountain and the burn will keep. Glad to hear you will too.*"},
            {t:"p", x:"She sealed it before she could second guess the last line, and gave it to the same courier who'd carried his letter to her, and sat for a while afterward in the quiet that followed, six institutional positions now settled around her like weather she'd have to live inside regardless of which one she personally agreed with, and found, underneath all of it, that the letter in her own hand was the one part of the whole day that had actually felt like hers."}
          ]
        },
        {
          id: 19,
          movement: "Movement VII — Consequence",
          title: "Chapter Nineteen",
          blocks: [
            {t:"p", x:"“Interim joint oversight,” Aya said, setting the final document down without ceremony, the same plain delivery she gave everything that actually mattered. “Shirogane retains review authority and can flag concerns at any point. Kuromori assumes formal responsibility for your supervised development, with Isato named as your primary handler of record. Reviewable annually, or sooner if either Clan requests it. Not permanent. Not a resolution. A working arrangement two Clans could actually agree to, which is closer to a miracle than anything else that's happened to you this year, institutionally speaking.”"},
            {t:"p", x:"“What about Akaishi. Karasu. Motoi.”"},
            {t:"p", x:"“Unaddressed. Deliberately.” Aya allowed herself something close to a dry smile. “Nobody could agree on those quickly enough to include them, and everyone involved decided a workable arrangement covering two Clans was worth more than a stalled negotiation trying to cover five. Those questions are still open. They'll stay open for a while yet, probably longer than either of us would like.”"},
            {t:"p", x:"“Is that a defeat.”"},
            {t:"p", x:"“It's a start.” Aya gathered her case, the same lacquered case that had sat on a table in Tetsu's nephew's back room what felt like a lifetime ago. “I've learned this year that a start is usually the most honest thing anyone can actually promise you. Anyone who offers more than that is generally selling something.”"},
            {t:"p", x:"Isato confirmed the arrangement's practical terms not long after, brisk and businesslike as always, though something in his manner carried a satisfaction he didn't bother hiding this time. “You'll train with my team on a proper schedule now. Real resources behind it, for once, instead of favors I have to argue for one afternoon at a time.” He studied her for a moment. “This isn't a reward. I want to be clear about that. It's Kuromori finally admitting what I've been telling them since the ridge. You're worth investing in properly.”"},
            {t:"p", x:"“Thank you.”"},
            {t:"p", x:"“Don't thank me. Just don't waste it.” He said it without heat, the closest thing to warmth he had. He paused at the door, an unusual hesitation for a man who rarely lingered over an exit. “For what it's worth, the ridge taught me something too, not just you. I don't intend to forget it just because the arrangement finally worked out in my favor.”"},
            {t:"p", x:"“What did it teach you.”"},
            {t:"p", x:"“That competence and caution aren't opposites, whatever I spent twenty years assuming. I'll be a better handler for you than I would have been a season ago. That's not nothing, even if it took an arm to get there.” He left before she could answer, the same economical departure he always made, and she found she didn't need to answer it anyway. The admission had already said everything it needed to."},
            {t:"br"},
            {t:"p", x:"The road home felt different than the road out had, though the mountains hadn't changed at all in the weeks she'd been gone. She rode part of the distance in a cart Aya arranged for her, and walked the last stretch alone once the cart tracks gave out below the Black Mountain Belt's steeper paths, wanting, for reasons she didn't examine too closely, to arrive on her own two feet rather than be delivered."},
            {t:"p", x:"Kurokawa's noise faded behind her within the first day, then the last of the wider valley's traffic, until it was just her and the mountain road she'd walked more times than she could count before any of this had started. The uncleared seam she'd noticed on the way out was gone now, properly flagged and cordoned, Kuromori's stretched resources apparently having caught up with at least that much of the backlog. She noticed the improvement and found she didn't feel much of anything about it either way, a small, ordinary fact in a season that had stopped letting ordinary facts mean very much on their own."},
            {t:"p", x:"She thought, walking, about the version of herself who'd climbed this same road the opposite direction all those weeks ago, exhausted and Marked and certain, in the specific, naive way of someone who hadn't yet learned better, that the right people asking the right questions would eventually hand her a clean account of what had happened and let her go back to being who she'd been before. She didn't resent that earlier version of herself for the certainty. She simply couldn't quite locate her anymore, the way you couldn't quite locate the exact moment a burn stopped being wood and started being something else, only the fact that somewhere along the road, without a single dramatic turning point she could point to, the change had already finished happening."},
            {t:"p", x:"She passed the fork toward the rival buyer's yard on the second day, the same trail she'd taken once with a fragment of stone and a plan she'd been so certain was kind. She didn't turn down it, and found she didn't need to anymore, whatever remained between her and that particular arrangement having already settled itself, one way or another, weeks ago. She passed, too, the wider bend where Kurokawa's registry had once seemed like the largest, most official place she could imagine standing. It looked smaller now, not because it had shrunk, but because she'd since stood somewhere considerably larger and found it just as capable of getting things wrong."},
            {t:"p", x:"By the third day her legs had stopped complaining about the distance the way they had at the start, falling back into the old, familiar rhythm of a body built for exactly this kind of walking, mountain roads and steady pacing and the specific patience of someone who'd covered this ground a hundred times before any of this began."},
            {t:"br"},
            {t:"p", x:"Genzou was waiting at the fork where the trail split toward his usual collection point, which told her, before she'd said a word, that Aya's office had sent word ahead of her arrival and that he'd chosen to spend an afternoon simply standing there rather than wait to be told she'd already come and gone."},
            {t:"p", x:"“You look terrible,” he said, by way of greeting, which from him she understood immediately as its own kind of relief."},
            {t:"p", x:"“I feel better than I look.”"},
            {t:"p", x:"“That's usually true of you.” He fell into step beside her without asking, the same easy, practical companionship he'd offered since long before any of this started. “The burn's mostly salvageable, for what it's worth. I had it checked properly once the season's chaos settled. Northeast corner's a loss. The rest will produce, come next season, if you're of a mind to burn again.”"},
            {t:"p", x:"“I am.”"},
            {t:"p", x:"“Good. I'd have hated to lose you as a supplier on top of everything else this year cost both of us.” He said it lightly, though something underneath the lightness carried real feeling, the same pattern she'd learned to read in him months ago and trusted completely now."},
            {t:"p", x:"“How's the rival buyer taking the news that I'm apparently rank Traced now.”"},
            {t:"p", x:"“Delighted, last I heard. Man's been telling anyone who'll listen that he once did business with you directly, which he seems to think improves his standing with everyone except me.” Genzou allowed himself a small, dry laugh. “I've decided not to hold it against either of you. Business is business, and you got a fair season's price out of a bad situation. I can respect that even when it costs me a little pride to say so.”"},
            {t:"p", x:"“The forge house contract renewed, by the way. Better terms than last season, if you can believe that. Apparently a supplier connected to whatever happened at the Rite makes for interesting conversation at the negotiating table.”"},
            {t:"p", x:"“Is that a joke.”"},
            {t:"p", x:"“Mostly.” He glanced at her sideways, something quietly pleased in it, the closest he came to open sentiment. “I meant what I wrote, too. Glad to hear you were coming home. I've had a hard enough year without also losing the one supplier I actually trust to tell me the truth about her own situation.”"},
            {t:"p", x:"“You didn't need to wait at the fork for that.”"},
            {t:"p", x:"“No. I wanted to anyway.” He said it plainly, the way he said everything that actually mattered to him, no ornament dressing it up, no attempt to make the moment bigger than it needed to be. “Six years of buying your charcoal, and this is the first season I actually understood what it would cost me to lose you as more than a supplier. I'd rather say that plainly once than let it sit unsaid and pretend it wasn't true.”"},
            {t:"p", x:"“That's more of an admission than I expected.”"},
            {t:"p", x:"“I've had weeks to think it over.” He shrugged, an easy, unforced gesture. “Doesn't need to be more than what it is. You've got enough people this year deciding what you mean to them without asking you first. I'm not looking to be one more of those.”"},
            {t:"p", x:"“I'd have told you either way. You're the one part of this whole year that never once asked me to be anything other than exactly what I already was.”"},
            {t:"p", x:"“That's the job,” he said, though something in his voice made clear he didn't think of it as only that anymore, and didn't need her to say so for the moment to have landed the way it was meant to."},
            {t:"p", x:"They walked the rest of the way in a silence that asked nothing further of either of them, past the last bend before her own house came into view, smoke rising thin and ordinary from a hearth someone, presumably him, had already lit in anticipation of her arrival."},
            {t:"br"},
            {t:"p", x:"Her own doorway looked exactly as she'd left it that morning so many weeks ago, her boots still sitting where she'd left them, the mended pack she'd stitched by lamplight in Shirogane now slung over one shoulder, carrying home whatever was actually left of the woman who'd walked out of this house a charcoal burner and nothing else."},
            {t:"p", x:"She stood in the doorway for a long moment before going in, Genzou waiting patiently a few steps behind her, and let herself take the full inventory one more time, the way she'd learned to take inventory of everything that actually mattered this year. The jar of pickled greens still sat half finished on its shelf, exactly where she'd left it the morning she'd first noticed it waiting for a version of her that no longer existed. Her boots sat by the door in the same spot they'd occupied since the day of the Marking, mud from a hillside she'd since learned to read like a language rather than fear like an omen."},
            {t:"p", x:"She was ranked now, provisionally, reviewably, under an arrangement two Clans had barely managed to agree on. She had a body that didn't work quite the way it used to, in ways she still hadn't finished discovering the full shape of. She had a handler who respected her, an institution that feared her, a Clan that wanted to claim her, another that hoped she could save them, and a priesthood that still didn't know what to call what had happened to her eyes. She had lost the plain, containable life she'd had before a smoking vent caught her attention on an ordinary morning, and she understood now, standing in her own doorway with the mountain at her back and a man who'd chosen to stay waiting patiently behind her, that she was never getting that life back in any form she'd recognize."},
            {t:"p", x:"What she had instead was this: a home still standing, a burn still capable of producing, a friend steady enough to wait at a fork in the road for an afternoon rather than risk missing her, and her own two hands, tired and marked and still entirely hers, capable of more than she'd believed possible the morning this all began. She thought of Isato's admission at the gate, of Aya's honest, unglamorous promise that a start was the most anyone could offer, of Suzu's quiet grief in a smaller shrine somewhere in the Marches, of Renji still waiting for an answer she hadn't given him, of a stone in a Karasu archive that still meant nothing and mattered anyway, of Noe's plain, unfinished question sitting exactly where they'd left it, waiting for a day with fewer other things demanding an answer first. None of it had resolved. All of it was hers to keep carrying, the way she'd once carried a season's charcoal down a mountain she knew better than her own reflection, one load at a time, because the alternative was setting it down somewhere it would only need picking up again later, heavier for having been left."},
            {t:"p", x:"She stepped inside at last, Genzou following a moment later without needing to be asked, and let the door close behind them both on a version of her life that had finally, completely, stopped being anything she could manage from a safe distance."},
            {t:"p", x:"She was not saved. She was not chosen. She had not defeated anything, resolved anything, or earned the kind of ending the old stories liked to hand their subjects once the hard part was over. She was simply, finally, still here, changed in ways she was still learning the shape of, with a fire that needed tending and a man willing to help her tend it and a whole unfinished list of people and questions she had every intention of carrying forward rather than setting down."},
            {t:"p", x:"For tonight, in this one ordinary house, that was going to have to be enough. She suspected, standing there with the door finally closed behind them both, that it was going to have to be enough for a very long time yet."}
          ]
        }
      ]
    }

      : 'Start reading →';

    var html = '<div class="home">';
    html += '<div class="home-intro">';
    html += '<span class="eyebrow">Private · just us</span>';
    html += '<h1>The shelf</h1>';
    html += '<p>Stories in progress, kept somewhere you can actually get back to from your phone.</p>';
    html += '</div>';
    html += '<div class="shelf">';
    html += '<button class="story-card ura-theme" data-kind="story" data-slug="' + story.slug + '">';
    html += '<span class="card-label">Story</span>';
    html += '<span class="card-title">' + story.label + '</span>';
    html += '<span class="card-blurb">' + story.blurb + '</span>';
    html += '<span class="card-meta">' + story.metaLine + ' · ' + story.chapters.length + ' chapters</span>';
    html += '<span class="card-cta">' + cta + '</span>';
    html += '</button>';
    html += '<button class="story-card ura-theme" data-kind="codex">';
    html += '<span class="card-label">Reference</span>';
    html += '<span class="card-title">The Ura — Codex</span>';
    html += '<span class="card-blurb">World Bible, magic system, craft rules, and the story’s own planning documents — the backbone behind the prose.</span>';
    html += '<span class="card-meta">' + CODEX_DOCS.length + ' documents</span>';
    html += '<span class="card-cta">Browse →</span>';
    html += '</button>';
    html += '</div>';
    html += '<div class="shelf-empty-note">More stories land here as they’re written.</div>';
    html += '</div>';
    app.innerHTML = html;

    app.querySelectorAll('.story-card').forEach(function (card) {
      card.addEventListener('click', function () {
        if (card.getAttribute('data-kind') === 'codex') { openCodex(); }
        else { openStory(card.getAttribute('data-slug')); }
      });
    });
  }

  function renderCodex() {
    var groups = [];
    var seen = {};
    CODEX_DOCS.forEach(function (d) { if (!seen[d.group]) { seen[d.group] = true; groups.push(d.group); } });

    var html = '<main class="reader ura-theme codex-wide"><div class="reader-page"><article>';
    html += '<div class="chapter-head"><span class="eyebrow">The Ura · Reference</span><h1>Codex</h1></div>';
    html += '<div class="codex-layout">';
    html += '<nav class="codex-sidebar">';
    groups.forEach(function (g) {
      html += '<div class="toc-group-label">' + g + '</div>';
      CODEX_DOCS.filter(function (d) { return d.group === g; }).forEach(function (d) {
        html += '<button class="codex-doc-link" data-slug="' + d.slug + '" aria-current="' + (d.slug === state.codexDoc ? 'true' : 'false') + '">' + d.title + '</button>';
      });
    });
    html += '</nav>';
    html += '<div class="codex-content" id="codexContent"><p class="codex-loading">Loading…</p></div>';
    html += '</div>';
    html += '<div class="end-note">Reference material — synced from the project’s own planning documents. Rendered client-side; large documents may take a moment on a slow connection.</div>';
    html += '</article></div></main>';
    app.innerHTML = html;

    app.querySelectorAll('.codex-doc-link').forEach(function (btn) {
      btn.addEventListener('click', function () { selectCodexDoc(btn.getAttribute('data-slug')); });
    });

    loadCodexDoc(state.codexDoc, document.getElementById('codexContent'));
    renderOverlayList();
    window.scrollTo(0, 0);
  }

  function loadCodexDoc(slug, targetEl) {
    var doc = CODEX_DOCS.filter(function (d) { return d.slug === slug; })[0];
    if (!doc || !targetEl) return;
    if (codexCache[slug]) {
      targetEl.innerHTML = codexCache[slug];
      return;
    }
    fetch(doc.file)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (md) {
        var html = (window.marked && window.marked.parse) ? window.marked.parse(md) : '<p class="codex-loading">Markdown renderer failed to load.</p>';
        codexCache[slug] = html;
        if (state.view === 'codex' && state.codexDoc === slug) targetEl.innerHTML = html;
      })
      .catch(function (err) {
        if (state.view === 'codex' && state.codexDoc === slug) {
          targetEl.innerHTML = '<p class="codex-loading">Could not load this document (' + err.message + ').</p>';
        }
      });
  }

  function renderReader() {
    var story = STORIES[state.story];
    var ch = story.chapters[state.chapter];
    var wide = isReaderWide();
    widthToggleEl.setAttribute('aria-pressed', wide ? 'true' : 'false');
    var html = '<main class="reader ura-theme' + (wide ? ' reader-wide' : '') + '"><div class="reader-page"><article>';
    html += '<div class="chapter-head"><span class="eyebrow">' + ch.movement + '</span><h1>' + ch.title + '</h1></div>';
    html += '<div class="prose">';
    ch.blocks.forEach(function (b) {
      if (b.t === 'p') {
        html += '<p>' + em(b.x) + '</p>';
      } else if (b.t === 'br') {
        html += '<div class="scene-break">◆ ◆ ◆</div>';
      } else if (b.t === 'sys') {
        html += '<div class="system-block">' + b.x.map(function (l) { return '<div>' + l + '</div>'; }).join('') + '</div>';
      }
    });
    html += '</div>';
    html += '<nav class="chapter-nav">';
    html += '<button class="prev" ' + (state.chapter === 0 ? 'disabled' : '') + '>← Previous</button>';
    html += '<button class="next" ' + (state.chapter === story.chapters.length - 1 ? 'disabled' : '') + '>Next →</button>';
    html += '</nav>';
    html += '<div class="end-note">Working draft — ' + ch.title.toLowerCase() + ', ' + ch.movement.toLowerCase() + '.</div>';
    html += '</article></div></main>';
    app.innerHTML = html;

    var prevBtn = app.querySelector('.prev');
    var nextBtn = app.querySelector('.next');
    if (prevBtn) prevBtn.addEventListener('click', function () { goToChapter(state.chapter - 1); });
    if (nextBtn) nextBtn.addEventListener('click', function () { goToChapter(state.chapter + 1); });

    renderOverlayList();
    saveChapterFor(state.story, state.chapter);
    window.scrollTo(0, 0);
  }

  function renderOverlayList() {
    tocList.innerHTML = '';
    if (state.view === 'reader') {
      var story = STORIES[state.story];
      if (!story) return;
      story.chapters.forEach(function (ch, i) {
        var btn = document.createElement('button');
        btn.className = 'toc-item';
        btn.setAttribute('aria-current', i === state.chapter ? 'true' : 'false');
        btn.innerHTML = '<span class="toc-movement">' + ch.movement + '</span><span class="toc-chap">' + ch.title + '</span>';
        btn.addEventListener('click', function () { goToChapter(i); closeOverlay(); });
        tocList.appendChild(btn);
      });
    } else if (state.view === 'codex') {
      var lastGroup = null;
      CODEX_DOCS.forEach(function (d) {
        if (d.group !== lastGroup) {
          var label = document.createElement('div');
          label.className = 'toc-group-label';
          label.textContent = d.group;
          tocList.appendChild(label);
          lastGroup = d.group;
        }
        var btn = document.createElement('button');
        btn.className = 'toc-item';
        btn.setAttribute('aria-current', d.slug === state.codexDoc ? 'true' : 'false');
        btn.innerHTML = '<span class="toc-chap">' + d.title + '</span>';
        btn.addEventListener('click', function () { selectCodexDoc(d.slug); closeOverlay(); });
        tocList.appendChild(btn);
      });
    }
  }

  function goToChapter(i) {
    var story = STORIES[state.story];
    if (!story || i < 0 || i >= story.chapters.length) return;
    state.chapter = i;
    renderReader();
  }

  function openOverlay() { if (state.view === 'reader' || state.view === 'codex') overlay.hidden = false; }
  function closeOverlay() { overlay.hidden = true; }

  document.getElementById('homeLink').addEventListener('click', function (e) { e.preventDefault(); goHome(); });
  document.getElementById('contentsBtn').addEventListener('click', openOverlay);
  document.getElementById('closeOverlay').addEventListener('click', closeOverlay);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden) closeOverlay(); });

  document.getElementById('sizeUp').addEventListener('click', function () { adjustSize(0.06); });
  document.getElementById('sizeDown').addEventListener('click', function () { adjustSize(-0.06); });
  function adjustSize(delta) {
    var cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--reading-size')) || 1.09;
    var next = Math.min(1.4, Math.max(0.85, cur + delta));
    document.documentElement.style.setProperty('--reading-size', next.toFixed(2) + 'rem');
    try { localStorage.setItem('shelf-size', next.toFixed(2)); } catch (e) {}
  }

  loadState();
  goHome();
})();
</script>

</body>
</html>
