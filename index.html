            {t:"p", x:"She let Isato help her up when it was time to go, and didn't argue about it, and understood, walking slowly back toward the road with one arm useless at her side, that this was probably the correct way to end a day that had cost her this much: quietly, without a lesson dressed up as a comfort, carrying forward only the plain, unglamorous fact of what it had actually taught her."},
            {t:"p", x:"The path down felt longer than the walk up had, though she knew it wasn't. Every ordinary jolt of the descent found her arm again, a small, insistent reminder that nothing about today was going to let itself be forgotten quickly. She didn't mind that as much as she thought she should have. A cost she could feel plainly, in one specific place, on one specific limb, was almost a relief after weeks of costs she could only ever half see: a file entry here, a discrepancy there, a restriction with no visible edge to it at all. This one, at least, had the decency to hurt exactly where it had happened."}
          ]
        },
        {
          id: 11,
          movement: "Movement V — Pressure",
          title: "Chapter Eleven",
          blocks: [
            {t:"p", x:"The arm had healed to the point where she could use it for small, careful things, provided she didn't ask it to grip anything with real force or hold a position too long. She spent the first part of most mornings testing exactly where that line sat, flexing her fingers around a cup, a spoon, the handle of a door, cataloguing the day's actual capability the way she used to catalogue a burn's readiness before deciding whether it could safely be opened. Some mornings the line had moved a little further out than the day before. Some mornings it hadn't moved at all, and she'd learned, slowly, not to read too much into either kind of morning on its own."},
            {t:"p", x:"The rest of her days had settled into a strange, unfamiliar shape since Kurokawa's last visit: fewer summons, fewer sudden arrivals, more long stretches of ordinary time she hadn't had since before the Marking, filled mostly with small tasks and the specific, patient waiting of someone who knew a great deal was still happening, just none of it currently in front of her."},
            {t:"p", x:"It was in the middle of one of these small, private tests that Genzou arrived, unannounced, carrying a satchel that clinked faintly with the sound of a ledger and something else she couldn't place."},
            {t:"br"},
            {t:"p", x:"“You reported yourself,” he said, by way of greeting, settling onto the offered cushion without being asked twice. “For coming to see me after the retrieval site. I heard about it from a supplier who heard it from someone at the registry, which tells you exactly how private anything is anymore in this valley.”"},
            {t:"p", x:"“I thought it was safer than not reporting it.”"},
            {t:"p", x:"“Probably was.” He set the satchel down, not opening it yet. “I'm not here about that today. I'm here because the season's gone strange in a way that has nothing to do with either of us, and you're still, officially, my supplier, whatever else is also true about your situation.”"},
            {t:"p", x:"She asked what he meant, and he told her plainly, in the same flat, practical register he used for everything: three of the eastern mountain roads had closed inside a month, not from weather, from Gate activity nobody official was calling by that name yet, just enough disruption that carts had to detour two extra days to reach the Sword Provinces forge-houses. Charcoal prices had climbed accordingly, not dramatically, just steadily, the way prices climbed when everyone quietly adjusted their expectations at once without anyone announcing a crisis."},
            {t:"p", x:"“Kuromori's response teams are stretched thinner than I've seen them in years,” he said. “That's not gossip, that's every merchant I know comparing notes on why deliveries are running late. Something's using up capacity that used to be free for things like road clearance.”"},
            {t:"p", x:"“Do you think it's connected. To what happened on the mountain.”"},
            {t:"p", x:"“I don't think about it in those terms. I think about it in terms of which routes are open and what a cart costs to run on the ones that are.” He said this without dismissiveness, simply stating the actual shape of his attention. “Whether it's all one thing happening in different places, that's a question for people with more time than me to spend wondering about it. I've got a season to get through either way.”"},
            {t:"p", x:"“Is that good or bad for you.”"},
            {t:"p", x:"“Both, the way most things are.” He allowed himself something close to a dry smile. “Good, because my rate's gone up along with everyone else's, and I'm not the one absorbing the loss this time. Bad, because a nervous market makes buyers cautious, and my forge-house contract renews on confidence as much as on charcoal.” He opened the satchel at last and set a small, carefully wrapped parcel on the table between them. Dried fish, she realized, from the smell. “Also brought you this. Practical reasons. You still need to eat, whatever else is happening to you.”"},
            {t:"p", x:"She didn't argue with the gift, and found, once he'd gone, that she believed every practical reason he'd given and appreciated the quieter one underneath it that neither of them had needed to name out loud. It was, she thought, exactly like him: a season's worth of genuine worry, delivered wrapped in a reason a ledger could accept."},
            {t:"br"},
            {t:"p", x:"Noe found her the following morning, at the edge of the market path rather than at her own door, the way someone visits who isn't quite sure yet whether a visit is welcome. Kasane recognized her before she placed the name, a face from the same charcoal country, one of the several highland suppliers who ran their credit through Genzou's network alongside her own."},
            {t:"p", x:"“I heard what happened to you,” Noe said, without dressing it up. “Not the version people are telling each other at the collection post. I've been Marked myself, three years now, low rank, nothing dramatic. I know what the actual mechanics of being processed feel like, underneath whatever story the valley's decided to tell about it. I thought you might want to talk to someone who's lived it rather than someone assessing it.”"},
            {t:"p", x:"“You never mentioned it. All the times our routes crossed.”"},
            {t:"p", x:"“Wasn't relevant before. It's relevant now.” Noe said this plainly, no self-pity in it, a fact stated the way Kasane herself might state one. “Traced rank, four years running, and likely to stay there. Nobody's cruel about it. Nobody's especially interested either, which after a while starts to feel like its own kind of answer.”"},
            {t:"p", x:"They talked longer than Kasane expected to, about ordinary things mostly: which offices actually returned messages, which rank reviews were worth preparing for and which were theater, how to tell the difference between an office that had forgotten you and one that had simply run out of budget. Kasane found herself, for the first time in weeks, talking to someone who didn't need anything explained to her twice, and didn't need anything explained at all in several places where everyone else had needed a great deal explained."},
            {t:"p", x:"“I'd like to do this again,” Kasane said, when Noe finally rose to go. “If you're willing.”"},
            {t:"p", x:"“I'm willing.” Something eased in Noe's face, unguarded for just a moment, before the same plain composure settled back over it. “It's rare, finding someone who actually understands the shape of it without needing the whole story first. I wasn't going to let that go unspoken just because I'm not sure yet what to call it.”"},
            {t:"p", x:"Kasane thought about that admission for longer than the moment strictly required, after Noe had gone, and found she wasn't sure what to call it either, only that she wanted the chance to find out."},
            {t:"br"},
            {t:"p", x:"Renji came two days later, and unlike Genzou, he didn't simply arrive. He sent word first, a folded note asking whether a visit would be welcome, phrased carefully enough that she understood, even before reading past the first line, that he already knew exactly how much trouble a visit from him could currently cause her."},
            {t:"p", x:"She sat with the note for a long while before answering it."},
            {t:"p", x:"The restriction's language had never specified whether an Akaishi scion's social visit counted as the kind of contact that needed reporting in advance or only after the fact, and she found herself doing the same careful arithmetic she'd once done over whether to ask Genzou for help outright: what looked more suspicious, refusing to see him at all, seeing him and reporting it plainly, or seeing him and hoping the discretion clause covered it. In the end she wrote to Aya's office first, a short, factual note stating that Renji had requested a visit and she intended to allow it, briefly, in daylight, with no other arrangement attached. She sent it before answering him, not after, on the theory that doing the reporting properly, in the correct order, mattered more right now than doing it quietly."},
            {t:"p", x:"He arrived the next afternoon looking less like the man who'd cornered her in a Kurokawa corridor and more like someone who'd had a genuinely difficult week. The performance was still there, but thinner, worn at the edges the way a coat gets worn when it's been the only one available for too long."},
            {t:"p", x:"“You reported this,” he said, not quite a question, glancing once at the door as though expecting to find someone from Aya's office already waiting behind it."},
            {t:"p", x:"“I did.”"},
            {t:"p", x:"“Good.” He said it with visible relief, which surprised her more than anything else about the visit so far. “I'd rather you did than not. It matters more than you probably think, right now, that nothing about me touching your case looks irregular.”"},
            {t:"p", x:"“Why does it matter more now specifically.”"},
            {t:"p", x:"He was quiet for a moment, the first real hesitation she'd seen from him. “The appointment I mentioned. The one I'm competing for against family.” He said it plainly, none of his usual rhetorical polish attached to it. “It comes up for decision at the Rite. My relative's made a point, recently, of suggesting that my interest in you is exactly the kind of erratic judgment that shouldn't be trusted with more responsibility. I can't afford anything right now that makes that argument easier to make.”"},
            {t:"p", x:"“Then maybe you shouldn't be visiting me at all.”"},
            {t:"p", x:"“Maybe not.” He met her eyes, and for once there was nothing performed in it. “I'm here anyway. Make of that whatever you'd like.”"},
            {t:"p", x:"“Can I ask you something plainly,” she said, before he could stand to go. “Is any part of your interest in me actually about me, or is all of it about what I might do for your appointment.”"},
            {t:"p", x:"He considered the question with more care than she'd expected, rather than deflecting it with charm the way she half expected him to. “Both, at different times, in proportions I'm honestly not always certain of myself.” He said it slowly, as if testing whether the admission cost him something before deciding to spend it anyway. “I'd like to tell you it's entirely the first. I don't think that would survive you asking me again in a month, so I'd rather not lie to you today and get caught at it later.”"},
            {t:"p", x:"“That's the most honest thing you've ever said to me.”"},
            {t:"p", x:"“Don't get used to it. I have a reputation to maintain, even now.” The old performance flickered back into his voice for just a moment, and then settled again into something plainer. “For what it's worth, the proportion's been shifting lately. Not because it's convenient for it to shift. Just because it has.”"},
            {t:"p", x:"He didn't stay long after that, and didn't press his usual case about Akaishi's old records or what he claimed to know about her. He left the way he'd arrived, carefully, a man conserving something he could no longer afford to spend freely, and Kasane found herself, once he'd gone, oddly more inclined to trust him than she had been after any of his more polished performances."},
            {t:"br"},
            {t:"p", x:"Suzu's visit came without warning, the way it had the first time, though the persimmons this visit were replaced by a folded schedule she set on the table with real weight behind the gesture."},
            {t:"p", x:"“The Rite has a date now,” she said, without preamble. “Not a season anymore. A date. Which means my question about your Consecration has a date attached to it too, and I no longer have the luxury of being honestly uncertain for as long as I'd like to be.”"},
            {t:"p", x:"“Do you have an answer.”"},
            {t:"p", x:"“No.” Suzu said it plainly, the same honesty she'd offered the first time. “I have three possible approaches, none of which I fully trust, and a superior who wants a decision before the Rite regardless of whether I actually have one worth giving him.” She folded her hands, the same unhurried gesture Kasane remembered, though something underneath it had tightened since their last conversation. “I came to ask you something practical instead. Whatever happens with the blessing itself, would you prefer to stand apart from the general registration group during the ceremony, or within it. That much, at least, is a question you're actually equipped to answer, and I'd like to give my superior something concrete before he decides for both of us.”"},
            {t:"p", x:"Kasane considered it longer than the question probably required, turning it over the way she'd turn over any decision with real, if narrow, consequences. “Apart,” she said finally. “If it's mine to choose. I've spent enough of this year being looked at as part of a crowd's worth of paperwork. I'd rather stand somewhere I can actually be found, if anyone's looking for me specifically.”"},
            {t:"p", x:"“Can I ask what the three approaches actually are,” Kasane said. “Even if you don't trust any of them yet.”"},
            {t:"p", x:"Suzu considered this, then answered plainly, as she seemed to answer most things once she'd decided a question deserved a real response. “One treats you as an ordinary registration with an unusual physical marker, blessed exactly like everyone else and simply noted as such in the record. One treats the anomaly itself as the thing being blessed, which is closer to true but risks the priesthood being seen to sanctify something nobody understands. One skips the Consecration for you entirely, which solves the theological problem by refusing to engage with it, and which I dislike more than either of the other two for reasons I haven't fully worked out how to defend yet.” She folded her hands again. “None of them are good. I'm choosing between three different kinds of incomplete.”"},
            {t:"p", x:"“That's more honest than most answers I get to that question.” Suzu nodded, made a small mark on her folded schedule, and didn't ask anything further. “I'll fight for it. I can't promise I'll win it.”"},
            {t:"p", x:"“That's more than most people have promised me lately.”"},
            {t:"p", x:"Suzu left not long after, the schedule folded away again, no closer to an answer for either of them, though Kasane noticed, once she was alone, that the question of where to stand had settled something small and useful in her chest regardless of everything else still hanging open around it."},
            {t:"br"},
            {t:"p", x:"She spent the last of the light that evening doing the one thing her arm could reliably manage: sorting a small basket of dried herbs by hand, slow, careful, undemanding work that asked nothing of her beyond patience and a working set of fingers. Genzou's fish sat wrapped on the shelf. Renji's visit sat reported, somewhere in an office she'd never seen, its actual weight still unknown. Suzu's schedule sat folded in a bag on its way back to a shrine that didn't yet know what it was going to do with her. And somewhere on the road back to her own house, Noe was carrying a conversation neither of them had quite finished, in a direction Kasane hadn't let herself examine too closely yet."},
            {t:"p", x:"None of it was resolved. All of it was moving, faster now than it had been a month ago, in directions she could feel more than see. Roads closing somewhere she'd never walked. An appointment she had no say in, tied to a man whose interest in her she still couldn't fully separate into its component parts. A blessing that might or might not exist by the time anyone needed it to. A new acquaintance who understood a part of her life nobody else currently did, and a question about what that understanding might grow into that she wasn't ready to answer yet either."},
            {t:"p", x:"She kept sorting the herbs anyway, one small pile at a time, because it was the one thing in the whole day that answered to her hand exactly the way it was supposed to. Her fingers ached faintly by the time she finished, the good, ordinary ache of use rather than injury, and she found she was almost grateful for it, a small, private proof that at least one part of her still worked the way it was built to, regardless of what the rest of the season decided to do around her."}
          ]
        },
        {
          id: 12,
          movement: "Movement V — Pressure",
          title: "Chapter Twelve",
          blocks: [
            {t:"p", x:"The walk down felt shorter than it had for the ridge, her arm long healed now, the season's cold settling into the kind of steady, unremarkable chill that made every ordinary errand feel a little more deliberate than it used to. Isato was already at the training ground when Kasane arrived, standing apart from his usual crew with the specific stillness of a man who'd spent the morning on something other than training. The perimeter markers sat exactly where they always sat. No sacks of stone, no coiled rope, none of the usual equipment scattered around waiting for a session. Whatever today actually was, it clearly wasn't going to look like the last two times she'd stood on this ground."},
            {t:"p", x:"He didn't explain what the morning's business had been, and she didn't ask, though she noticed the way he checked the road twice before she'd even finished greeting him, a small, uncharacteristic tell from a man who otherwise never seemed to watch for anything he hadn't already accounted for."},
            {t:"p", x:"“This is a favor,” he said, without preamble, “and I want you to understand it's costing me one before you decide how much effort to put into it.”"},
            {t:"p", x:"“Costing you how.”"},
            {t:"p", x:"“Kuromori doesn't spend supervised time on other Clans' problems without a reason that benefits Kuromori. I gave them one. Whether it holds up depends partly on what happens today.” He said this plainly, no self-pity in it, the same flat delivery he gave everything. “I'm telling you because you should know the actual weight of what you're being asked to do, not because I want you to feel responsible for my own decisions.”"},
            {t:"p", x:"“What reason did you give them.”"},
            {t:"p", x:"“That whatever you find or don't find today tells us something real about your actual limits, which is worth knowing regardless of who else benefits from the asking.” He shrugged, a small, economical gesture. “It's true, as far as it goes. It's also not the whole reason, and I'd rather not pretend otherwise to you specifically.”"},
            {t:"p", x:"She didn't ask what the rest of the reason was. Something in the set of his shoulders told her the answer would cost him more to say out loud than she had any right to make him spend today."},
            {t:"br"},
            {t:"p", x:"Shion arrived on foot, alone, carrying a small wrapped bundle against her chest with both hands the way a person carries something they've been told not to drop and have taken the instruction seriously. She was younger than Kasane expected, though something in her bearing read older, the particular weariness of a person who'd been doing more than her share of a job for longer than made sense. Her clothes were plain, well kept but clearly mended more than once, the practical wardrobe of someone whose Clan didn't have coin to spare on appearances and had stopped pretending otherwise some years back."},
            {t:"p", x:"She stopped a respectful distance away and waited to be acknowledged rather than approaching directly, a small courtesy that told Kasane something about how carefully this woman had learned to move through rooms where she wasn't entirely certain of her welcome."},
            {t:"p", x:"“Kasane,” she said, and then, simply, “Shion. Karasu.” No rank offered, no title, the same economy Kasane had come to recognize from people whose standing didn't need decoration to be real."},
            {t:"p", x:"“I understand you have something for me to look at.”"},
            {t:"p", x:"“I have something I'm hoping you can look at.” Shion's correction was gentle but precise, the kind of distinction Kasane suspected mattered to her a great deal. “Not the same thing. I want to be clear before we start that I'm not owed an answer here. I was told what you can and can't do, and I believed the person who told me. I'm not going to pretend I forgot that the moment I arrived.”"},
            {t:"p", x:"“Who told you.”"},
            {t:"p", x:"“Aya. She was thorough about it. More thorough than most people are when they're the ones asking for a favor.” Shion allowed herself something close to a smile, brief and tired. “I appreciated the honesty more than I expected to.”"},
            {t:"p", x:"She unwrapped the bundle carefully, revealing a fragment of stone perhaps the size of a closed fist, grey and unremarkable, its surface pitted in a way that could have come from weather or from something else entirely."},
            {t:"p", x:"“From just outside the boundary of the Silence,” Shion said. “Not from inside it. Nobody's tested whether inside is even survivable to approach, and I wasn't willing to find out today. This was close enough to the edge that some of our older records treat it as meaningfully different from ordinary stone. Nobody's ever been able to say exactly why they thought that, only that they did.”"},
            {t:"p", x:"“How long has your Clan had it.”"},
            {t:"p", x:"“Longer than I've been alive. It sat in an archive most of that time, cataloged and mostly forgotten, until someone remembered it existed while looking for anything at all that might be worth sending to someone who could actually perceive whatever the rest of us can't.” Shion held it out, both hands, the same careful presentation a merchant might give a piece of goods they genuinely believed in. “I don't know if it's meaningful. I know it's the most concrete thing my Clan has managed to produce in eleven years of asking the same unanswered question. That has to count for something, even if it isn't the something we actually need.”"},
            {t:"br"},
            {t:"p", x:"Kasane held her hand over the stone for a long moment before touching it, the way she'd learned to hold her hand over anything unfamiliar since the ridge, letting whatever instinct she had time to register before committing to contact. Isato watched without comment, close enough to intervene, far enough to let her actually do the work herself."},
            {t:"p", x:"The stone felt like stone when she finally touched it. Cool, faintly rough, entirely ordinary in every way her hand could report. She held it a moment longer, waiting for the pressure behind her eyes that would tell her something was actually happening, and felt, instead of the sharp double sensation of the Rent or the wrongness of the training ground's seams, something quieter and harder to name. A texture underneath the texture. Not pain, not the flinch of contradiction she'd learned to expect from a genuine Ura-adjacent surface, just a faint, persistent sense that the stone was somehow not finished being only one thing, the way a burn wasn't finished being wood the moment the fire first caught."},
            {t:"p", x:"She sat with it for as long as she dared, testing it the careful, incremental way she'd learned to test anything since the ridge cost her an arm: a little contact, a pause to assess, a little more, never committing further than she could account for. She turned it over once with her free hand, checking whether the wrongness lived on one face of it or all of them, and found it distributed evenly, no single spot worse or better than another, the way a whole burn could be subtly off rather than any one log inside it."},
            {t:"p", x:"Isato crouched nearby, watching her hands rather than her face, the same clinical attention he gave any piece of equipment being tested for the first time. He didn't offer commentary. She understood, without either of them needing to say it, that he'd learned exactly how much space to give her since the ridge, and that this silence was itself a kind of apology, still being paid out one supervised session at a time."},
            {t:"p", x:"It never resolved into anything clearer. It simply stayed exactly what it was, an object that felt very slightly larger, on some register she had no proper word for, than its physical size accounted for."},
            {t:"p", x:"“Something,” she said finally, setting it down with real care. “I don't know what. It's not like the Rent, and it's not like the training ground's seams either. It's its own thing, whatever that thing is, and I don't have enough to compare it against to tell you if that's meaningful or just strange.”"},
            {t:"p", x:"“Can you tell me anything more, if you tried again.”"},
            {t:"p", x:"“I could try again and get the same answer, or a slightly different one that means nothing except that I'm tired and not being consistent.” Kasane met her eyes directly, because the honesty mattered more here than it usually did. “I'm not going to guess at what it means just to give you something to carry home. A guess dressed up as an answer would be worse than telling you I don't have one. It might send your Clan looking in a direction that turns out to be wrong, and by the time anyone realized that, you'd have lost more time than you have left to lose.”"},
            {t:"br"},
            {t:"p", x:"Shion was quiet for a long moment, wrapping the stone back into its cloth with the same careful attention she'd unwrapped it with, as if the object itself deserved the courtesy regardless of what it had or hadn't told anyone."},
            {t:"p", x:"“I knew that was likely,” she said eventually. “I told myself that on the walk here, more than once, so it wouldn't land as hard when it happened.” She looked up, something plain and unguarded in her face for just a moment. “It's landing anyway. I don't think there's a way to prepare for hope not paying off that actually works, whatever anyone tells themselves beforehand.”"},
            {t:"p", x:"“I'm sorry it isn't more.”"},
            {t:"p", x:"“Don't be. You did exactly what you said you'd do, which is more than I can say for most of what my own Clan has tried over the years.” Shion tucked the bundle back against her chest, the same careful hold she'd arrived with. “Do you know what it's like, watching a Clan argue with itself for years about whether to ask for help, and then finally getting permission to ask, and having the answer be nothing new? I've been picturing this conversation for months. In none of the versions I imagined did it go quite like this, and somehow this is still the one that actually happened.”"},
            {t:"p", x:"“What did you imagine instead.”"},
            {t:"p", x:"“Something worse, mostly. A confirmation of the bad theory rather than no theory at all.” She allowed herself a small, tired laugh, without much humor in it. “I suppose I should be grateful you didn't hand me a worse answer just to have one. Most days I think I am grateful for that. Today isn't quite one of those days yet.”"},
            {t:"p", x:"“I watched people I trained beside leave Karasu for Clans that could actually use them. I stayed, telling myself someone needed to keep asking the question even if nobody could answer it yet. Today doesn't change that calculation. It just makes it cost a little more to keep believing it's the right one.”"},
            {t:"p", x:"“Will you tell your leadership what I told you? All of it, not just the part that sounds hopeful.”"},
            {t:"p", x:"“All of it. That's the only version of this job worth doing.” She said it simply, no bitterness in it. “A comforting lie would just mean someone else has to find out the truth later, at a worse time, from someone less careful about how they deliver it.”"},
            {t:"br"},
            {t:"p", x:"Before she left, Isato spoke quietly at Kasane's shoulder, low enough that only she could hear it. “Someone from my own chain already asked why I authorized today. I told them the truth. That it cost us an afternoon and bought us a data point about her actual limits that's worth having regardless of who benefits from it. That answer will hold, probably. It cost me something to give it with a straight face.”"},
            {t:"p", x:"“I'm sorry.”"},
            {t:"p", x:"“Don't be. I decided to spend it before I knew what today would produce. That's the actual shape of a decision, not something that only counts if it works out.” He watched Shion gathering herself for the walk home, something unreadable crossing his face for a moment before he set it aside. “For what it's worth, I'd have authorized it again knowing exactly how it ended. A clean, well handled no is worth more to people making decisions about you than another maybe would have been. My chain will understand that eventually, even if they're annoyed about it today.”"},
            {t:"p", x:"“Is that actually true, or is it what you tell yourself so the cost feels smaller.”"},
            {t:"p", x:"“Both, probably.” He allowed himself something close to a smile, the first she'd seen from him all day. “Most true things I tell myself started out as the second kind before they became the first. Doesn't make them less true now.”"},
            {t:"p", x:"Shion had already turned to go, the stone rewrapped and held against her chest exactly as it had arrived, no more answered than it had been that morning. She thanked them both once, plainly, without lingering over it, the same economy she'd brought to everything else that day. Then she started down the path alone, back toward a Clan that had run out of easier things to hope for long before anyone had thought to ask a highland charcoal-burner to look at anything for them at all, her shoulders set the way a person sets their shoulders for a walk they've made before and know exactly how heavy it's going to be, growing smaller against the tree line until the path bent and took her out of sight entirely."}
          ]
        },
        {
          id: 13,
          movement: "Movement V — Pressure",
          title: "Chapter Thirteen",
          blocks: [
            {t:"p", x:"They left before first light, Aya's cart already loaded when Kasane arrived at the meeting point, the same lacquered case sitting where it always sat, now joined by two travel chests she didn't recognize and a folded map Aya consulted once before putting it away for good, as though she'd already memorized whatever it had to tell her and only needed the confirmation."},
            {t:"p", x:"“Four days,” Aya said, by way of greeting. “Longer than it should be, this time of year. We'll see why soon enough.”"},
            {t:"p", x:"The first day passed unremarkably, the ordinary tedium of road travel Kasane had known her whole life, carts and rutted track and the particular ache of sitting still for hours after months of learning to distrust stillness. She watched her home valley narrow behind them and finally disappear past the second ridge, and found the leaving easier this time than the trip to Kurokawa had been, not because it hurt less but because she'd already done the hard part of that particular grief once and didn't need to relearn it from nothing."},
            {t:"p", x:"They saw why the road was slow on the second day."},
            {t:"br"},
            {t:"p", x:"The road that should have carried a Kuromori patrol every few hours, by Kasane's own accounting of past trips through this stretch of territory, carried one every half day instead, and even those looked thinner than she remembered, three riders where she recalled five, moving with the particular economy of people covering more ground than their numbers were built for. A stretch of road near a known unstable seam sat marked but uncleared, orange flags snapping in the wind where a work crew should have already come and gone. A checkpoint that used to take names now simply waved carts through, too undermanned to bother with the formality."},
            {t:"p", x:"“Kuromori's stretched,” Aya said, following her gaze without needing to be asked what she was looking at. “Has been for a season. It's not a secret, exactly. It's just not the kind of thing anyone advertises either.”"},
            {t:"p", x:"“Because of the Gate activity.”"},
            {t:"p", x:"“Partly. Partly because every Clan is pulling its best people toward the Rite right now, and Kuromori's best people are the ones usually doing the actual road clearance the rest of the year.” Aya said this with the same flat competence she brought to everything, though something in it carried more weight than the words alone accounted for. “Everyone's stretched thin in their own particular way this month. You're simply the only one whose particular way involves being personally present at the exact event making everyone else's thinner.”"},
            {t:"p", x:"Kasane thought of Genzou's own account of the season, the roads closing, the prices climbing, and understood, watching the uncleared seam slide past the cart's rail, that she was finally seeing the same pattern from a different, more official angle than a charcoal merchant's ledger could ever have shown her."},
            {t:"br"},
            {t:"p", x:"Shirogane Castle-City announced itself long before they actually reached it, a shape against the mountains that took her a full quarter hour of steady travel to understand wasn't cloud or shadow but stone, terrace rising above terrace up the slope until the topmost walls disappeared into genuine cloud rather than merely resembling it. Kurokawa had impressed her with its size. This made Kurokawa feel, in retrospect, like a large market town that had simply never needed to decide what it was for."},
            {t:"p", x:"“That's the castle proper, at the top,” Aya said, following her gaze again, patient with the silence this time rather than filling it immediately. “Below it, the administrative terraces. Below that, where we'll actually be staying, the part of the city that exists to feed and house everyone who isn't important enough to sleep higher up.”"},
            {t:"p", x:"“How many people live here.”"},
            {t:"p", x:"“Normally, more than your entire home valley several times over. This week, considerably more than that.” Aya said it plainly, a fact rather than a boast. “Every Clan brings a delegation. Every delegation brings staff, guards, merchants hoping to sell to them, and people simply curious enough to make the trip once in their lives. The city's population roughly triples for the length of the Rite, and the whole lower terrace exists specifically to absorb that surge without the upper city ever needing to notice it happened.”"},
            {t:"p", x:"Kasane found herself doing the arithmetic without meaning to, the same reflex that had priced every burn and every cart of charcoal she'd ever sold: how much food that many extra mouths required, how much labor it took to move it, how many hands were currently being paid, badly probably, to make a triple-sized city function for one week and then quietly shrink back down again. It was, she thought, the only part of the sight that actually made sense to her on first look. Everything above the lower terraces looked like something built to be admired. The lower terraces looked like something built to work, and work was a language she'd never stopped speaking."},
            {t:"p", x:"The cart wound its way up through the lower terrace's crowded main road, past innkeepers shouting rates that had clearly doubled for the week, past a fishmonger doing brisk business with a line of Akaishi staff who looked like they'd never once haggled for their own food before, past a small shrine at a crossroads where someone had left an offering of dried persimmons that made Kasane think, unexpectedly, of Suzu. Further up, past the point their own cart wasn't permitted to travel, she could see the administrative terraces rising in tiers of grey stone, orderly and quiet in a way the lower terrace wasn't even trying to be, and above all of it, wrapped in genuine cloud now rather than the illusion of it, the castle itself, old enough that its lowest walls looked more like part of the mountain than something built on top of it."},
            {t:"p", x:"“You'll see the Rite Grounds tomorrow,” Aya said, following her gaze one more time. “Built into the outer wall, up near the castle proper. Big enough for the whole Muster to stand in at once, apparently. I've only seen it myself twice.”"},
            {t:"p", x:"“You make it sound like you don't come here often.”"},
            {t:"p", x:"“I don't, particularly. Tsukishiro keeps a small permanent office here, mostly for records exchange. Most of what I do doesn't require me to actually stand in this city.” Aya said it plainly, no particular feeling attached to the fact. “I find I prefer it that way, if I'm honest. There's something about a place built entirely around being looked at that makes it hard to get any real work done.”"},
            {t:"br"},
            {t:"p", x:"They found Moritaka waiting near the gate to the administrative terraces, which told Kasane, before he'd said a single word, that whatever this stop was going to be, it hadn't been left to chance."},
            {t:"p", x:"“You made good time,” he said, to Aya rather than Kasane, the same procedural courtesy he extended to everyone. “I'd like a moment, before the Muster proceedings begin in earnest.”"},
            {t:"p", x:"“Of course.”"},
            {t:"p", x:"He turned to Kasane directly, hands folded the way they'd been folded at every meeting she'd had with him so far. “Your case has been pending for longer than Shirogane finds comfortable, and longer than most observers here will find explicable, once every Clan is standing in the same city comparing notes on what's still unresolved and why. I want to be direct with you. There will be pressure, starting today, to settle your status conclusively before this Rite closes. Some of that pressure will come from me. Some of it will come from people I don't control and can't predict.”"},
            {t:"p", x:"“What does settling it conclusively actually mean.”"},
            {t:"p", x:"“I genuinely don't know yet, in specifics. That's not evasion. It's the truth of where things currently stand.” He said this plainly, without the discomfort most people showed when admitting uncertainty. “What I can tell you is that a week from now, your situation will look different than it does today, in some direction. Very little about this event tends to leave anything exactly where it started.”"},
            {t:"p", x:"“Is there anything I can actually do to influence which direction it goes,” Kasane asked, before he could turn away."},
            {t:"p", x:"He considered the question with more care than she expected. “Less than you'd like. More than nothing.” He said it the way he said everything, as a fact rather than either comfort or warning. “Continue behaving exactly as you have. Cooperative, precise, honest even when honesty costs you something, as it did with Karasu's request. That record is real and it matters, whatever else happens around it. It simply isn't the only thing that will matter this week, and I'd rather you understood that now than discover it partway through the Rite.”"},
            {t:"p", x:"He left without further explanation, the same way he always left, and Kasane stood for a moment turning that non-answer over, trying to decide whether its honesty made it more or less unsettling than a clean lie would have been."},
            {t:"br"},
            {t:"p", x:"She saw Renji from a distance later that afternoon, across a wide processional courtyard thick with unloading carts and unfamiliar banners, standing among a cluster of Akaishi retainers in clothing too formal for travel, clearly already dressed for something. He looked, even from this far away, like a man holding a posture rather than simply standing in one, and when his eyes found hers across the courtyard, he didn't approach, didn't wave, gave nothing away beyond the barest, briefest incline of his head, an acknowledgment small enough that anyone watching him rather than her would have missed it entirely."},
            {t:"p", x:"She understood without needing it explained. Whatever ground he'd have to fight for at this Rite, being seen approaching her before the appointment was decided wasn't a risk his own stakes could currently absorb. One of the retainers beside him said something she couldn't hear, and Renji laughed at it, easily, convincingly, the whole performance sliding back into place as though it had never slipped at all. Only the fact that she'd already seen it slip, once, in her own home a season ago, let her recognize how much effort the performance was currently costing him to maintain."},
            {t:"p", x:"She returned the same small nod and let him go, and found she didn't resent the distance the way she might have a month ago. It cost him something to hold it. She could see that much even from across a crowded courtyard."},
            {t:"br"},
            {t:"p", x:"Karasu's delegation, when she spotted it near the edge of the same courtyard, needed no distance to read at all. It was simply small, half the size of any other Clan's presence, its banner faded in a way that looked more like poverty than tradition, its people standing close together with the specific posture of a group accustomed to being looked past rather than looked at. She thought she saw Shion among them, once, a familiar economical set to the shoulders, gone again before she could be certain, swallowed back into the crowd the same way Karasu's whole presence seemed built to be swallowed by everything larger around it."},
            {t:"p", x:"Nobody from Karasu approached her. She hadn't expected anyone to. Whatever hope had walked down a mountain path a season ago to ask her an honest question had already been spent, and there was nothing left in that particular account for either of them to draw on today."},
            {t:"br"},
            {t:"p", x:"By evening they'd reached the lower terrace lodging Aya had arranged, a narrow, shared room above a noodle stall that did brisk business well past dark, the noise of the week's swollen crowd drifting up through the floorboards in a steady, cheerful hum that had nothing to do with anything currently weighing on Kasane specifically. She stood for a while at its narrow window, looking up at the city rising above her in ascending, lit terraces, banners from five Clans and however many lesser houses stirring faintly in a wind that smelled of woodsmoke, cooking oil, and the particular mineral cold of high mountain air at altitude."},
            {t:"p", x:"Everything that had been separately, individually pressing on her these past weeks, Genzou's season, Renji's courtship, Suzu's unanswered question, Karasu's disappointment, Shirogane's patience running out, was now standing in the same city, on the same handful of days, with no more room left for any of it to happen quietly, one thing at a time, the way it had at least sometimes managed to before."},
            {t:"p", x:"She had wanted, since the very beginning, for this situation to acquire rules she could work around from a safe distance. Standing at that window, watching lantern light climb terrace after terrace up toward a castle she'd never once imagined she would live to see, she understood, plainly and without much drama left to spend on the realization, that there was no distance left anywhere in this city for her to work from. Whatever happened next was going to happen to her directly, in front of everyone who mattered, with nothing left standing between her and the whole weight of it."}
          ]
        },
        {
          id: 14,
          movement: "Movement VI — Public Choice",
          title: "Chapter Fourteen",
          blocks: [
            {t:"p", x:"The Muster began at dawn on the Rite Grounds, and Kasane felt its scale before she understood any of its meaning, a wall of noise rolling down through the terraces the way weather rolled down a mountain, banners and drums and the specific, rhythmic tramp of several hundred people moving in formation at once. She stood with the general crowd on the lower tiers, close enough to feel it in her chest, and watched five Clans' worth of Hunters assemble by rank and territory in a display that took most of the morning simply to finish arranging itself."},
            {t:"p", x:"She had never seen this many Marked people in one place. Rank markers she recognized from months of vocabulary she hadn't had before this year moved past in ordered blocks, Stirred and Traced kept toward the rear, Wardens forming the visible bulk of each Clan's presence, a scattering of Gate-Lords positioned at the front of their own contingents with the particular stillness of people used to being looked at. Somewhere among the Shirogane formation, she knew without needing to check, a space had been left where a Boundary Knight of Shinken rank would once have stood, and nobody around her seemed to look directly at that gap, the same practiced non-looking she'd already noticed Karasu's thin ranks receiving the day before."},
            {t:"p", x:"An older woman beside her in the civilian crowd, sharing the tier out of simple proximity rather than any acquaintance, muttered something about the whole display costing more coin than her entire valley saw in a year, not bitterly, just as an observation exchanged between strangers watching the same expensive spectacle. Kasane found she agreed with the arithmetic of it more than she disagreed, and said nothing, and kept watching."},
            {t:"p", x:"Nobody in that crowd knew her by sight. That lasted exactly as long as it took a herald somewhere near the front to read the day's registration confirmations aloud, her name among a list of a dozen others, and for the specific quality of attention around her to shift, subtly but unmistakably, the way a room changed once people realized which stranger in it they'd actually been told to watch for. A few heads turned. A few didn't bother hiding that they were looking. Most, she noticed, simply filed the name away and returned their attention to the Muster itself, which she found, oddly, more unsettling than open staring would have been. She had become a fact worth noting rather than a spectacle worth watching, and there was something about that quieter kind of attention that felt harder to prepare for."},
            {t:"p", x:"She had known this was coming. Knowing it and standing inside it turned out to be different amounts of preparation entirely. The Muster itself ran long past midday, formation after formation stepping forward to be counted, Kuromori's contingent noticeably larger than the others even understrength, Karasu's noticeably thin in a way nobody around her commented on aloud though she saw more than one glance flick toward the gap and then politely away."},
            {t:"br"},
            {t:"p", x:"They met the Consecration committee that afternoon in a small administrative room off the shrine complex, plainer than she expected given everything riding on it. A man introduced himself as Tadamori, a cleric sent from Motoi itself rather than a local priest, his manner formal in a way that read as care rather than coldness, someone clearly aware of how much scrutiny his own decisions here would eventually receive."},
            {t:"p", x:"“We've built something new,” he said, without preamble, spreading a set of notes across the table. “Not because the ordinary Consecration is wrong for most people. Because it was never built to account for someone in your specific situation, and pretending otherwise would be worse than admitting the gap and working to close it properly.”"},
            {t:"p", x:"Suzu sat beside him, and something in her had genuinely lightened since the last time Kasane had seen her, the particular relief of a person who'd finally found solid footing after a long time standing on uncertain ground. “We took the honest approach you gave me at your own door,” she said. “Not treating the dual eyes as a wound to be healed, nor as a sign to be simply interpreted without your own account of it. We built the language around the argument itself. Two things disagreeing, still speaking, not yet settled.”"},
            {t:"p", x:"“How long have you been working on this,” Kasane asked."},
            {t:"p", x:"“Since word reached Motoi that your case had reached a formal impasse. Restricted, unresolved, with no institutional path forward that anyone seemed satisfied with.” Tadamori set the notes in order as he spoke, precise, unhurried. “Doctrine moves slowly by design. This moved faster than almost anything I've personally overseen, and it still took most of the intervening months to reach something I was willing to actually stand behind.”"},
            {t:"p", x:"“What does that actually look like, in the ceremony.”"},
            {t:"p", x:"“A modified consecration, performed at a site chosen for its own long history of holding exactly that kind of unsettled disagreement steady,” Tadamori said. “The old gate-frame at our Shrine complex, over the courtyard where Gate-response teams pass through before deployment. It's held that function for longer than living memory, without incident, which made it the most defensible site available to us for something this unprecedented.”"},
            {t:"p", x:"“You'll stand within it,” Suzu said. “Not passing through it the way a Hunter would before a deployment. Standing inside the frame itself while the rite is spoken over you, so that whatever it is the frame represents gets to weigh in, so to speak, on a case none of the older forms were ever written to include.” She said this plainly, without mysticism dressing it up, a working craftsperson describing a modified tool rather than a priest describing a miracle. “I won't pretend to you that I'm certain this will resolve anything. I will tell you that it's the most honest attempt anyone has made yet, and that matters to me more than certainty would.”"},
            {t:"p", x:"“What happens if it doesn't resolve anything,” Kasane asked. “If I stand in the frame and nothing about my situation actually changes.”"},
            {t:"p", x:"“Then you're no worse off than you are today, and we've at least ruled out one honest attempt rather than leaving it forever untried.” Tadamori answered without hesitation, which told her the question had already been asked and settled among the committee before she'd ever had the chance to raise it herself. “I won't promise you an answer tomorrow. I'll promise you that whatever happens, it will be recorded honestly, as an attempt made in good faith rather than as either a triumph or a failure dressed up as something cleaner.”"},
            {t:"p", x:"“And if something happens that isn't nothing, but also isn't the answer you're hoping for.”"},
            {t:"p", x:"Suzu answered that one. “Then we'll have learned something real, even if it isn't the thing we wanted to learn.” She said it simply, the same plain honesty she'd offered from the very first visit. “I've stopped expecting clean outcomes from anything involving you, Kasane. I don't say that unkindly. I say it because I've come to trust the honest, complicated version of things more than I ever trusted the clean one.”"},
            {t:"p", x:"Kasane found herself, for the first time since the collection post, sitting across from institutional authority and feeling something closer to hope than wariness. “Thank you,” she said, and meant it more fully than she'd meant the same words to almost anyone else this year. “For actually trying to build something, instead of just deciding which existing box to force me into.”"},
            {t:"p", x:"“Don't thank us yet,” Tadamori said, not unkindly. “Thank us after it works. Today, we're still just people who did our best with what we had.”"},
            {t:"br"},
            {t:"p", x:"They walked up to the shrine complex itself before the light failed, a request Kasane had made herself, wanting to see the actual site before standing inside it tomorrow rather than meeting it cold. The Consecration Shrine sat on its own spur of the mountain, separate from the castle's political weight, quieter than anywhere else she'd been all week, the noise of the Muster and the crowded lower terraces fading to almost nothing by the time they reached the courtyard."},
            {t:"p", x:"The gate-frame stood at the courtyard's center, old dark wood weathered pale at its edges, taller than she'd pictured it, carved along its beams with patterns worn nearly smooth by centuries of hands and weather. A pair of young acolytes were sweeping the courtyard's flagstones as they arrived, unhurried, clearly accustomed to visitors and equally accustomed to the site's ordinariness outside of actual ceremony. One nodded a polite greeting and kept sweeping, entirely unbothered by who was walking through."},
            {t:"p", x:"The frame itself looked, more than anything, like an old, well-kept tool, the kind of object a community maintained out of genuine respect rather than ceremony for its own sake. She walked its perimeter once, the way she'd have walked the edge of any unfamiliar burn site, out of habit rather than suspicion, running her eyes along the base where old stone met older wood, checking for the kind of wear that would tell her something about how the structure actually bore weight. She found nothing in it that read as wrong in the way the mist on her own mountain had read as wrong. It simply felt old, and used, and quietly important, the way a well-worn axe handle felt important to the hand that had shaped itself around it over years."},
            {t:"p", x:"“It's beautiful,” she said, and was faintly surprised to hear herself say it, a word she didn't reach for often."},
            {t:"p", x:"“It's meant to be,” Suzu said, standing beside her, looking up at the same weathered beams. “Beauty was never separate from function here, whatever else people argue about the old theology. A thing built to hold something this important steady should look like it deserves the trust being placed in it.”"},
            {t:"p", x:"They stood together a while longer as the light went gold and then grey, the acolytes finishing their sweeping and withdrawing without ceremony, leaving the courtyard to settle into the particular hush of a place built for one specific purpose and currently between uses. Kasane found, walking back down toward the noise of the lower terraces afterward, that she was already rehearsing, quietly, what it might feel like to finally have an answer by tomorrow's end."},
            {t:"br"},
            {t:"p", x:"She caught sight of Isato once more on the way back, positioning Kuromori's contingent along one edge of the Rite Grounds for the following day's continuing Muster proceedings, directing two subordinates with the same economical gestures he used for everything. He noticed her across the distance and gave her a short, businesslike nod, nothing more, a man with his own considerable list of tomorrow's responsibilities already occupying his full attention."},
            {t:"p", x:"She didn't approach. There was nothing that needed saying between them tonight that hadn't already been said on a ridge weeks ago, and she found she didn't mind the silence, one more small, undemanding thing in a day that had otherwise asked a great deal of her."},
            {t:"p", x:"Further along the Rite Grounds, still being cleared of the day's crowds, she caught sight of a Shirogane contingent standing in far tighter, more formal order than most of the others, banners crisper, boots better matched, the visible discipline of a Clan that had decided its diminished numbers would simply mean better polish on whoever remained."},
            {t:"br"},
            {t:"p", x:"She lay awake longer than she expected that night, in the narrow lodging above the noodle stall, listening to the last of the evening's noise fade out of the lower terrace below her window. For the first time since a smoking vent had first caught her attention on an ordinary morning months ago, she let herself believe, fully and without the usual careful hedge she kept against disappointment, that tomorrow might actually give her something real. Not a rank. Not a restriction. An answer, built honestly, by people who had genuinely tried."},
            {t:"p", x:"She thought, drifting toward sleep, of the whole strange procession that had brought her here: a smoking vent on an ordinary morning, a collection post full of strangers, a cup that had betrayed her in front of Aya, an arm broken learning a lesson about her own limits, a stone that told her nothing and mattered anyway, a city larger than anything she'd known existed. All of it, every separate cost, had been leading toward a room full of people who had actually tried, properly, to build her something true rather than merely convenient."},
            {t:"p", x:"She fell asleep before she'd finished deciding what she'd do with an answer, once she finally had one, and slept better that night than she had in longer than she could easily remember."}
          ]
