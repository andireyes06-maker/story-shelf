<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Shelf</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Libre+Franklin:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  /* ---- chrome (site shell) tokens — neutral, shared by every story ---- */
  :root {
    --ground: #F5F5F2;
    --surface: #EAEAE5;
    --surface-border: #D9D9D2;
    --ink: #1E1E1B;
    --ink-soft: #68675E;
    --ink-faint: #6E6D64;
    --accent: #2E5F4E;
    --accent-soft: #2E5F4E1A;
    --line: #D9D9D2;
    --shadow: 0 1px 2px rgba(20, 20, 16, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #17181A;
      --surface: #1F2123;
      --surface-border: #2C2E30;
      --ink: #E7E6E1;
      --ink-soft: #9C9B93;
      --ink-faint: #86847A;
      --accent: #5FAE93;
      --accent-soft: #5FAE9322;
      --line: #2C2E30;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --ground: #17181A;
    --surface: #1F2123;
    --surface-border: #2C2E30;
    --ink: #E7E6E1;
    --ink-soft: #9C9B93;
    --ink-faint: #86847A;
    --accent: #5FAE93;
    --accent-soft: #5FAE9322;
    --line: #2C2E30;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  }

  /* ---- The Ura's own theme — scoped, only active inside .ura-theme ---- */
  .ura-theme {
    --ground: #ECEEE9;
    --surface: #E1E4DC;
    --surface-border: #CBCFC2;
    --ink: #211F1B;
    --ink-soft: #5A574F;
    --ink-faint: #6E6B60;
    --accent: #9A4321;
    --accent-soft: #9A432122;
    --line: #CBCFC2;
    --shadow: 0 1px 2px rgba(30, 28, 22, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .ura-theme {
      --ground: #16171A;
      --surface: #1F2220;
      --surface-border: #33362F;
      --ink: #E9E5D9;
      --ink-soft: #ABA79A;
      --ink-faint: #928E7F;
      --accent: #DE8248;
      --accent-soft: #DE824822;
      --line: #33362F;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] .ura-theme {
    --ground: #16171A;
    --surface: #1F2220;
    --surface-border: #33362F;
    --ink: #E9E5D9;
    --ink-soft: #ABA79A;
    --ink-faint: #928E7F;
    --accent: #DE8248;
    --accent-soft: #DE824822;
    --line: #33362F;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink);
    margin: 0;
    padding-inline: 20px;
    font-family: 'Crimson Pro', Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  button {
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    background: none;
    border: 1px solid var(--surface-border);
    color: var(--ink-soft);
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { color: var(--ink); border-color: var(--ink-faint); }
  button:focus-visible, a:focus-visible, .story-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--accent);
  }

  /* ---------- header (always chrome, never themed) ---------- */
  header {
    max-width: 680px;
    margin: 0 auto;
    padding-block: 20px 12px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--line);
  }
  header .title-block { display: flex; flex-direction: column; gap: 2px; }
  header .site-title {
    font-family: 'Libre Franklin', system-ui, sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
    text-decoration: none;
    color: var(--ink);
    cursor: pointer;
  }
  header .story-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  header .controls { display: flex; gap: 6px; align-items: center; }
  header .controls button {
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    padding: 6px 9px;
  }
  #contentsBtn { padding: 6px 11px; }
  #widthToggle { padding: 6px 10px; }
  #widthToggle[aria-pressed="true"] {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ---------- home / shelf ---------- */
  .home {
    max-width: 680px;
    margin: 0 auto;
    padding-block: 40px 60px;
  }
  .home-intro { margin-bottom: 34px; }
  .home-intro .eyebrow { display: block; margin-bottom: 10px; }
  .home-intro h1 {
    font-family: 'Libre Franklin', system-ui, sans-serif;
    font-weight: 700;
    font-size: 2rem;
    margin: 0 0 8px;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }
  .home-intro p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1.02rem;
    max-width: 46ch;
  }

  .shelf {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  @media (min-width: 560px) {
    .shelf { grid-template-columns: 1fr 1fr; }
  }

  .story-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    text-align: left;
    width: 100%;
    background: var(--ground);
    border: 1px solid var(--surface-border);
    border-radius: 6px;
    padding: 20px 20px 18px;
    box-shadow: var(--shadow);
    font-family: 'Crimson Pro', serif;
    transition: transform 0.12s ease;
  }
  .story-card:hover { transform: translateY(-1px); }
  .story-card .card-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .story-card .card-title {
    font-family: 'Shippori Mincho', Georgia, serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--ink);
  }
  .story-card .card-blurb {
    color: var(--ink-soft);
    font-size: 0.98rem;
    line-height: 1.55;
  }
  .story-card .card-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.66rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .story-card .card-cta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin-top: 4px;
  }

  .shelf-empty-note {
    margin-top: 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.03em;
    color: var(--ink-faint);
  }

  /* ---------- contents overlay ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 8, 0.45);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
    padding-top: 12vh;
    z-index: 20;
  }
  #overlay[hidden] { display: none; }
  #overlay .panel {
    background: var(--ground);
    border: 1px solid var(--surface-border);
    border-radius: 6px;
    box-shadow: var(--shadow);
    max-width: 420px;
    max-height: 76vh;
    max-height: calc(100dvh - 12vh - 32px);
    width: 100%;
    padding: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #overlay .panel h2 {
    font-family: 'Shippori Mincho', serif;
    font-size: 1rem;
    margin: 0 0 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #overlay .panel h2 button { padding: 3px 8px; font-size: 0.9rem; }
  #tocList {
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-right: 8px;
    scrollbar-gutter: stable;
  }
  .toc-item {
    width: 100%;
    text-align: left;
    display: block;
    padding: 10px 4px;
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    background: none;
    font-family: 'Crimson Pro', serif;
  }
  .toc-item:last-child { border-bottom: none; }
  .toc-item .toc-movement {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.63rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 3px;
  }
  .toc-item .toc-chap { font-size: 1.02rem; color: var(--ink); }
  .toc-item[aria-current="true"] .toc-chap { color: var(--accent); }
  .toc-group-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 16px 0 4px;
  }
  .toc-group-label:first-child { margin-top: 0; }

  /* ---------- reader (themed via .ura-theme on <main>) ---------- */
  main.reader {
    max-width: 680px;
    margin: 0 auto;
    padding-block: 26px 60px;
  }
  main.reader.codex-wide {
    max-width: 1180px;
  }
  main.reader.reader-wide {
    max-width: 900px;
  }
  main.reader.reader-wide .reader-page {
    padding: 34px clamp(24px, 4vw, 60px) 46px;
  }
  .reader-page {
    background: var(--ground);
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 30px clamp(18px, 5vw, 44px) 40px;
  }
  main.reader.codex-wide .reader-page {
    padding: 34px clamp(24px, 4vw, 60px) 50px;
  }

  .chapter-head, .chapter-nav, .end-note { max-width: 720px; margin-inline: auto; }
  .chapter-head { margin-bottom: 30px; }
  .chapter-head .eyebrow { display: block; margin-bottom: 8px; }
  .chapter-head h1 {
    font-family: 'Shippori Mincho', Georgia, serif;
    font-weight: 700;
    font-size: 2.1rem;
    margin: 0;
    text-wrap: balance;
  }

  .prose {
    font-size: var(--reading-size, 1.09rem);
    line-height: 1.8;
    color: var(--ink);
    max-width: 720px;
    margin-inline: auto;
  }
  .prose p {
    margin: 0 0 1.15em;
    text-wrap: pretty;
  }
  .prose p:first-of-type::first-letter {
    font-family: 'Shippori Mincho', serif;
    font-size: 2.6em;
    font-weight: 700;
    float: left;
    line-height: 0.85;
    padding-right: 0.07em;
    padding-top: 0.06em;
    color: var(--accent);
  }
  .prose em { font-style: italic; }

  .scene-break {
    text-align: center;
    color: var(--accent);
    letter-spacing: 0.6em;
    font-size: 0.6rem;
    margin: 2em 0;
    opacity: 0.75;
  }

  .system-block {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 4px;
    padding: 14px 16px;
    margin: 1.4em 0 1.7em;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 0.82rem;
    line-height: 1.7;
    color: var(--ink-soft);
  }
  .system-block div { white-space: pre-wrap; }

  .chapter-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 44px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .chapter-nav button {
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    padding: 9px 13px;
    flex: 1;
    max-width: 48%;
  }
  .chapter-nav button:disabled { opacity: 0.35; cursor: default; }
  .chapter-nav button:disabled:hover { border-color: var(--surface-border); color: var(--ink-soft); }
  .chapter-nav .next { text-align: right; }

  .end-note {
    margin-top: 30px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.66rem;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    line-height: 1.7;
  }

  /* ---------- codex (reference documents) ---------- */
  .codex-layout {
    display: flex;
    gap: 32px;
    align-items: flex-start;
  }
  .codex-sidebar { display: none; flex: 0 0 200px; position: sticky; top: 20px; }
  @media (min-width: 760px) {
    .codex-sidebar { display: block; }
  }
  main.reader.codex-wide .codex-sidebar { flex-basis: 240px; }
  main.reader.codex-wide .codex-layout { gap: 56px; }
  main.reader.codex-wide .codex-content { max-width: 760px; }
  .codex-doc-link {
    display: block;
    width: 100%;
    text-align: left;
    padding: 5px 0;
    border: none;
    border-radius: 0;
    background: none;
    font-family: 'Crimson Pro', serif;
    font-size: 0.92rem;
    color: var(--ink-soft);
  }
  .codex-doc-link:hover { color: var(--ink); border-color: transparent; }
  .codex-doc-link[aria-current="true"] { color: var(--accent); font-weight: 600; }

  .codex-content { flex: 1; min-width: 0; font-size: var(--reading-size, 1.05rem); line-height: 1.75; }
  .codex-content h1, .codex-content h2, .codex-content h3, .codex-content h4 {
    font-family: 'Shippori Mincho', Georgia, serif;
    text-wrap: balance;
    margin: 1.5em 0 0.5em;
    line-height: 1.3;
  }
  .codex-content h1 { font-size: 1.55rem; }
  .codex-content h2 { font-size: 1.3rem; }
  .codex-content h3 { font-size: 1.08rem; }
  .codex-content h4 { font-size: 0.98rem; color: var(--ink-soft); }
  .codex-content > *:first-child { margin-top: 0; }
  .codex-content p { margin: 0 0 1em; }
  .codex-content ul, .codex-content ol { margin: 0 0 1em; padding-left: 1.3em; }
  .codex-content li { margin-bottom: 0.4em; }
  .codex-content hr { border: none; border-top: 1px solid var(--line); margin: 2em 0; }
  .codex-content strong { color: var(--ink); }
  .codex-content a { color: var(--accent); }
  .codex-content code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85em;
    background: var(--surface);
    padding: 0.15em 0.35em;
    border-radius: 3px;
  }
  .codex-content pre {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 4px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 0 0 1.3em;
  }
  .codex-content pre code { background: none; padding: 0; font-size: 0.76rem; line-height: 1.55; white-space: pre; }
  .codex-content blockquote {
    border-left: 3px solid var(--accent);
    margin: 0 0 1.2em;
    padding: 2px 0 2px 16px;
    color: var(--ink-soft);
  }
  .codex-loading { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--ink-faint); }

  @media (max-width: 480px) {
    header .story-sub { display: none; }
    .chapter-head h1 { font-size: 1.7rem; }
    .prose { font-size: var(--reading-size, 1.03rem); }
    .reader-page { padding: 22px 16px 30px; border-radius: 6px; }
    .home-intro h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <a class="site-title" id="homeLink" href="#">Story Shelf</a>
    <span class="story-sub" id="storySub"></span>
  </div>
  <div class="controls" id="readerControls" hidden>
    <button id="sizeDown" aria-label="Smaller text">A&minus;</button>
    <button id="sizeUp" aria-label="Larger text">A+</button>
    <button id="widthToggle" aria-pressed="false">Wide</button>
    <button id="contentsBtn">Contents</button>
  </div>
</header>

<div id="app"></div>

<div id="overlay" hidden>
  <div class="panel">
    <h2>Contents <button id="closeOverlay" aria-label="Close">&times;</button></h2>
    <div id="tocList"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
(function () {
  var CODEX_DOCS = [
    { group: "Start Here", slug: "project-index", title: "Project Index", file: "codex/project-index.md" },
    { group: "World", slug: "world-bible", title: "World Bible", file: "codex/world-bible.md" },

    { group: "Story Planning", slug: "arc-01-plan", title: "Arc 1 Plan", file: "codex/arc-01-plan.md" },
    { group: "Story Planning", slug: "arc-01-cast", title: "Arc 1 Cast", file: "codex/arc-01-cast.md" },
    { group: "Story Planning", slug: "chapter-outline", title: "Chapter Outline", file: "codex/chapter-outline.md" },
    { group: "Process", slug: "prompting-rules", title: "Prompting Rules", file: "codex/prompting-rules.md" }
  ];
  var codexCache = {};
  var STORIES = {
    ura: {
      slug: "ura",
      label: "The Ura",
      blurb: "A charcoal-burner above Yamashiro is Marked wrong, in front of no one who can explain it.",
      metaLine: "Arc One · Yamashiro",
      chapters: [
        {
          id: 1,
          movement: "Movement I — The Wrong Eyes",
          title: "Chapter One",
          blocks: [
            {t:"p", x:"Above the treeline the sky held the color of a bruise gone old, clouds moving faster than any wind Kasane could feel on the ground. Lower, the mountain kept its own weather. Mist pooled in the folds of the Black Mountain Belt after dark the way it always did, thick enough tonight that her kiln threw more glow onto it than light through it. Somewhere below all that, hours down a logging path her legs knew better than her eyes did, the valley town would already have its lamps out and its doors shut. She wasn't thinking about the town. She was thinking about the vent."},
            {t:"p", x:"The northeast one had been breathing wrong for the better part of an hour: a thinner hiss than its partners, a paler curl of smoke where it should have run blue-grey and steady. She crouched by the earth mound with her palm an inch off the clay, reading heat the way another person might read a face, and decided the wood inside had shifted, packed itself tighter against that corner than she'd left it. Not a crisis. A correction. She worked a green stick into the vent mouth, narrowed it by a thumb's width, and waited to see if the smoke agreed with her."},
            {t:"p", x:"It did, eventually. That was most of what this work was: small corrections, then waiting to be told whether you'd guessed right. She'd been doing it long enough that the waiting itself had stopped feeling like waiting; it was just the shape her nights took, three weeks at a stretch, one hand always half-listening to a fire she couldn't see into. She touched the boundary stone at the corner of her clearing on her way back from the vent, the same touch every time she passed it in the dark, not devotion, nothing she'd have called prayer if anyone had asked her, just a habit worn into her fingers the same as testing wind with a wetted thumb. The stone was cold. It was always cold. That wasn't a thing she thought about until later."},
            {t:"p", x:"She was still circling back toward the kiln, mentally rehearsing tomorrow's second correction, when the forest went quiet in a way that had nothing to do with the hour."},
            {t:"p", x:"It wasn't the ordinary quiet of deep night, when the insects had already worn themselves out and the owls hadn't started. This was quiet the way a held breath is quiet. She noticed it the way she'd notice a vent closing on its own: not as fear first, but as a fact that didn't match the facts around it. No wind through the pines. No settling creak from her own woodpile. Even the kiln's steady exhale seemed to thin out, as if the fire itself were listening."},
            {t:"p", x:"She straightened, hatchet coming into her hand out of habit rather than intention. She'd carried it every night on this mountain for six years, and her hand reached for it the same way it reached for the vent stick, without asking her opinion first."},
            {t:"p", x:"Downslope from the kiln, past the cordwood stacks, something in the treeline wasn't sitting right. Not a shape. An absence of one: a patch of hillside where the shadows of three close-grown cedars had stopped agreeing with the moonlight throwing them. They doubled instead of falling clean, one shadow a half-step behind where it should have been, like a second tree standing exactly inside the first and not quite matching its lean."},
            {t:"p", x:"She'd never seen a Rent up close. She'd heard them described by men who worked closer to the response roads, secondhand and already flattened into story by the time it reached her: a tearing sound, a wrongness in the air that made your teeth ache, sometimes light, sometimes nothing at all until something came through it. What she was looking at now didn't roar and didn't flash. It sat in the trees with the patience of something that had already arrived and was in no hurry to announce it."},
            {t:"p", x:"She knew what it was in under a breath. That part cost her nothing. A Rent was a Rent, whatever it looked like at three in the morning above a mountain nobody with rank had reason to visit. What cost her something was the next thought: *it should be doing something by now.*"},
            {t:"p", x:"Rents fed, or they closed, or people came and fought whatever fed through them. This one did none of it. It hung there, doubled and silent, the way a coal that should have caught still sits black and unconvincing in a bed of ash. Her instinct wasn't to leave it alone and hope. Her instinct was to get close enough to understand what it was actually doing, because the alternative was standing in the dark not knowing, and not knowing was the one thing sixteen years of burns had taught her not to tolerate. She counted the ground between herself and the treeline the way she'd count a fireline's spread: four strides to the first stack of cordwood, six more past it to open slope, a straight retreat uphill if the thing did anything at all resembling feeding."},
            {t:"p", x:"Closer, she found one fact she could actually use. The mist stopped clean at the doubled shadow's edge: a line straight enough to lay a plank against, wet ground on her side of it and bone-dry needles on the other, like the night had been cut along a rule instead of a weather pattern. Weather didn't have edges. That was worse than the shadows."},
            {t:"p", x:"She got exactly four steps past that line before the ground she'd decided to cross stopped being the whole story."},
            {t:"p", x:"It didn't pull like wind or water. There was no sensation of being taken toward it, only the abrupt, wrongfooted realization that the doubled shadow was no longer downslope of her but everywhere at once, the mist no longer behaving like mist. She had chosen to close the distance. Nothing about what answered her back asked for the same courtesy. Her hatchet came up. It didn't matter."},
            {t:"p", x:"The pain arrived behind both eyes at once, which some very small, very calm part of her filed away as strange even as the rest of her went down on one knee in the wet leaf litter. She'd have expected one eye, if she'd expected anything, the way every story about Marking she'd half-listened to over the years described it. Instead the pressure came in evenly, both sides, like surfacing too fast from water too deep, her ears popping in sequence with it, first one and then the other. Her mouth had gone dry the way it only did before very bad weather, the kind she could smell three hours out and no amount of preparation ever fully answered. For a half-second her vision came apart into two overlapping pictures of the same hillside that refused to resolve into one: the cedars where they should be, and the cedars a hand's width to the left of where they should be, both true at once, until they weren't, and there was only one hillside again, and it looked wrong in a way she had no word for yet."},
            {t:"p", x:"The quiet broke. Insects. Wind through the pines, ordinary and unbothered, as if it had never stopped. When she found the doubled shadow again it was gone. No closing crash, no light, nothing but three cedars agreeing with the moonlight the way cedars were supposed to."},
            {t:"p", x:"Bracketed text arrived behind her eyes rather than in front of them, which was its own kind of wrong, not a sound, not quite a sight, closer to remembering a sentence someone had just said in a room she wasn't in."},
            {t:"sys", x:["[MARKING CONFIRMED.]", "[SUBJECT LOGGED.]", "[CLASSIFICATION: PENDING.]"]},
            {t:"p", x:"She read it twice before she trusted that it wasn't going to say anything else, then spent a long moment doing nothing at all except breathing and being furious at her own hands for shaking around the hatchet's handle. Fear, when it came, always arrived through her hands first, and this time it didn't leave quickly. She had to set the hatchet down flat on a stone and pick it back up twice before her grip stopped betraying her."},
            {t:"p", x:"She made herself stand. Made herself walk back up to the kiln, because whatever else was true, the burn was still burning, and a burn didn't stop needing tending just because something had happened to the person tending it."},
            {t:"p", x:"The northeast vent had gone quiet, properly quiet, the kind that meant the fire inside had either settled exactly right or was starving, and she had no way to tell which without watching it longer than she currently had. She crouched by the earth mound again, same posture as an hour ago, palm an inch off clay, and found she couldn't read it. Not because the heat had changed. Because her eyes wouldn't settle on the smoke: every curl of it came doubled for half a breath, resolved, doubled again, like her sight had picked up the same argument the cedars had just lost."},
            {t:"p", x:"She pressed the heel of one shaking hand against her eye and felt wet on her fingers when she took it away, dark in the kiln-light, more than a nosebleed's worth. Whatever had reached for her had left something in her that a burn ledger had no column for, and the ledger was exactly what came to mind: three weeks of yields and weather notes and buyer names sitting in her pack, ordinary and useless against whatever line she'd need to write for tonight."},
            {t:"p", x:"The decision, when she made it, didn't feel like a decision so much as an admission of one already made. She walked the mound once, slowly, cataloguing what she could still save and what she couldn't. The southwest stacks would hold another day untended, maybe two, if the weather stayed dry. The northeast corner wouldn't. Left alone past dawn it would either finish wrong, brittle, useless charcoal, unsellable, or catch outright and take the whole load down with it, three weeks of work and the better part of a season's income gone to ash in an afternoon. She closed every vent she had strength left to close, which wouldn't save the burn so much as slow its dying, and understood, plainly, without needing to dress the thought up as anything larger than it was, that she was choosing to lose it. Whatever had happened to her eyes needed people who knew things she didn't, and those people were four hours downhill, not four hours up."},
            {t:"p", x:"She banked what she could and started down."},
            {t:"p", x:"The descent took longer than it should have. Not because the path was unfamiliar. She could have walked it blind, and for stretches of it, she realized with a distant, clinical unease, she nearly was, her vision swimming double every time she tried to focus past arm's length. She kept to what her feet remembered and let her eyes stop arguing with her."},
            {t:"p", x:"Past the second switchback the path ran close along a stretch of old boundary stones, waist-high and moss-fattened, spaced further apart than any wall would need to be: markers more than barriers, the kind every highland child was told not to move and every highland adult had long since stopped asking why. She kept to the downhill side of them out of the same unexamined habit that had her touching the one at her own clearing, and only noticed she'd done it once she was past, which unsettled her more than the doing had. A fox crossed the path ahead of her, unhurried, headed the same direction she was, and didn't glance at her once before the brush took it. Animals fleeing downhill meant something was behind them. She didn't have a rule for an animal simply agreeing with her about which way to go, and didn't waste the walk inventing one."},
            {t:"p", x:"She spent most of the rest of the walk on the only thing that kept her hands from shaking again: turning the Rent over, looking for the one correction that explained the whole failure instead of ten separate ones. A Rent that didn't feed. A Marking that took both eyes instead of one. Whatever this was, it hadn't behaved like the thing everyone described secondhand at the collection post. Either the stories were wrong, or she wasn't the ordinary case the stories were describing. She turned that thought over for the better part of an hour and didn't like either answer enough to settle on it. Somewhere in that hour her stomach turned over too, once, sharply, and she stopped long enough to be sick at the path's edge, methodically, the way she did everything else that night."},
            {t:"p", x:"By the time the valley opened out below her, grey was already climbing the eastern ridgeline, thinning the dark enough to see smoke rising from chimneys that shouldn't have been lit yet. A dog was barking somewhere near the collection post, the sustained, unhappy bark of an animal that had been at it for a while and wasn't going to stop on its own. Another answered it further off, then a third, until the barking wasn't coming from one direction anymore but several, overlapping, none of them settling. She noted this the way she noted weather, information, not yet meaning, and kept walking."},
            {t:"p", x:"The bracketed text came back as she reached the first fence line, unprompted, sharper this time, arriving in the same wrong place behind her eyes as before:"},
            {t:"sys", x:["[ABILITY EXPRESSION DETECTED.]", "[CATEGORY: UNRESOLVED.]", "[RECALCULATING.]", "[BOUNDARY INTERACTION: ILLEGAL STATE.]"]},
            {t:"p", x:"She stopped walking. Read it three times. *Illegal* sat wrong in her chest and stayed there. She couldn't tell if it meant she'd broken a law or broken a fact, didn't have the schooling to know whether those were even different things, and there was nothing useful to do with the not-knowing except keep walking. So she did."},
            {t:"p", x:"The collection post's lamp was lit despite the hour, and the man who kept it, known to her only as Old Tetsu's nephew, the one who'd taken the post over two winters back, was already standing in the doorway when she came up the track, which told her the dog hadn't been barking at nothing. He had a lantern raised and an expression already arranging itself for whatever bad news a charcoal-burner descending before dawn usually meant. A burn gone wrong. An injury. A body."},
            {t:"p", x:"“There's a Rent,” she said, before he could ask, because that was the report that mattered and she wanted it said plainly before anything else complicated it. “Opened on my burn site sometime past midnight. It didn't feed anything through. It just sat there, and then it closed on its own, and then...”"},
            {t:"p", x:"She got that far and stopped, because he wasn't listening anymore. The lantern had come up another few inches, and his face had gone through surprise and out the other side into something closer to the way a man looks at a sound he can't place, searching her face, not her words, her face, with an attention that had nothing to do with Rents at all."},
            {t:"p", x:"“Your eyes,” he said. Not a question."},
            {t:"p", x:"She hadn't seen them. There'd been no water still enough on the descent, no reason to look, and it hadn't occurred to her. A Rent was the thing that had happened, a Rent was what needed reporting, and she had spent the entire walk down composing that report in her head the way she'd compose an account of a bad burn for a buyer, plainly, in order, leading with the facts that mattered. She had spent four hours certain the important thing was what had come out of the mountain."},
            {t:"p", x:"Behind Tetsu's nephew, a second lamp came alight in a window, and a woman's voice called something too indistinct to catch, and somewhere further down the row a door opened that hadn't needed to open yet. A third lamp. A fourth. The dog had stopped barking at last, which she noticed only because its silence, too, had turned into something other people were paying attention to: heads turning at doorways, one man half-dressed and not caring, a child pulled back by the wrist before she could get past her own threshold."},
            {t:"p", x:"Kasane stood at the collection post's step with a report about the mountain still half out of her mouth, and watched an entire row of doors open toward her one by one, nobody in any of them looking past her shoulder at the ridge."}
          ]
        },
        {
          id: 2,
          movement: "Movement II — Classification",
          title: "Chapter Two",
          blocks: [
            {t:"p", x:"Nobody at the collection post knew what to do with her, and it showed in how long it took anyone to do anything."},
            {t:"p", x:"For a while it was just the doorway: Tetsu's nephew still holding the lantern he'd forgotten to lower, a woman from two houses down asking questions nobody answered, a boy sent running somewhere without anyone actually telling him where. Kasane sat where she was told to sit, on the collection post's single bench, and let them look. Her legs had stopped being willing to carry her anywhere else. She was aware, distantly, that this was its own kind of report, that not fighting the staring probably told them something, though she couldn't have said what, and was too tired to work it out."},
            {t:"p", x:"Someone put a cup of water in her hands at some point. She never saw who. She drank it because her mouth was still dry the way it had been on the mountain, and because holding something with a shape and a weight gave her hands a job that wasn't shaking. Tetsu's nephew hovered near the doorway without approaching, the lantern finally set down but still lit, useless now that the sky outside had gone the ordinary grey of an overcast morning. He asked her, once, quietly, whether she wanted to sit somewhere with a door that closed, and she said yes before she'd finished deciding whether the question was kindness or the same wariness as everyone else's, dressed better."},
            {t:"p", x:"It was past midmorning before anyone arrived who seemed to know what came next. Kasane heard her before she saw her: an even, unhurried footstep on the packed dirt outside, no urgency in it at all, which was itself strange given how the rest of the morning had gone. The woman who came through the door was younger than Kasane expected, dressed plainly enough that nothing about her clothing announced anything, carrying a flat lacquered case under one arm the way another woman might carry market goods. She looked at the room once, the crowd at the door, Tetsu's nephew's lantern, Kasane on the bench, and reorganized all of it without raising her voice."},
            {t:"p", x:"“Out,” she said, to the doorway in general. “Whoever isn't the keeper or the burner.”"},
            {t:"p", x:"The doorway emptied slower than the word suggested it should. She waited it out without repeating herself, which told Kasane something about her before anything else did: she didn't need to say things twice, and didn't intend to start now."},
            {t:"p", x:"“Aya,” she said, once the room had thinned to the three of them. “Tsukishiro.” She didn't offer a rank or a title, and Kasane understood, without being told, that this wasn't an oversight. “I handle information. Which is what you currently are, whether either of us likes that or not.”"},
            {t:"p", x:"She set the lacquered case down on the collection post's single table and opened it without ceremony: paper, a brush, an ink stone already prepared, as if she'd wet it on the walk over and known she'd need it before she arrived. Her hands were quick and sure over the case's contents and stained dark at the fingertips in a way that had nothing to do with labor. Kasane noticed that the way she noticed most things about hands, out of habit rather than judgment: here was someone who worked with paper and never with wood, never split anything, never carried anything heavier than a case built for exactly this conversation, and would probably find the observation useless if Kasane said it aloud, so she didn't."},
            {t:"p", x:"“They'll want the room back for actual business by afternoon,” Aya said. “So we'll use what we have.”"},
            {t:"br"},
            {t:"p", x:"What they had was Tetsu's nephew's back room, a narrow space used for grain disputes and boundary complaints, with a low table, two cushions worn thin in the middle, and a single paper screen that let in more light than warmth. Aya knelt on one side of the table with the brush already in hand. Kasane took the other side because it seemed to be where she was meant to sit, and because her knees had stopped objecting to any particular position several hours ago."},
            {t:"p", x:"“Start from before you noticed anything,” Aya said. “Not from the Rent. From before.”"},
            {t:"p", x:"Kasane told her about the vent. It felt like an absurd place to begin, a woman with ink-stained fingers and a case built for exactly this conversation, asking about a smoking flue, but Aya wrote it down without any change in her face, and Kasane understood, somewhere under the exhaustion, that this was the point. She was being asked to hand over the ordinary parts too, not just the impossible ones, and whatever this woman was building, it needed both."},
            {t:"p", x:"She kept going. The quiet that wasn't the right kind of quiet. The doubled shadow. The four steps, and the line in the mist she still didn't have a name for, wet ground giving way to dry so cleanly she'd wanted to check it with her hand and hadn't had the chance."},
            {t:"p", x:"“Did you touch anything,” Aya asked, not looking up. “The mist. The line. The ground on either side of it.”"},
            {t:"p", x:"“No.”"},
            {t:"p", x:"“Anything at all. The hatchet counts.”"},
            {t:"p", x:"Kasane thought about it properly before answering, because the question deserved that much. “It came up. It didn't touch anything before the rest of it happened.” She paused. “After, I don't know. I was on one knee for a while. I might have set a hand down.”"},
            {t:"p", x:"Aya wrote that too, in fewer strokes than the rest, which Kasane read as the difference between a fact and a possibility."},
            {t:"p", x:"“You said pressure. Both sides at once.” Aya's brush moved fast and even through all of it, pausing only twice, once at the mist's edge, once at *both eyes*, pauses so brief Kasane would have missed them if she hadn't spent six years learning to read small changes in things that were mostly holding steady. “Describe it again. Slower.”"},
            {t:"p", x:"Kasane did, and then, because the first description hadn't seemed to be enough and she wanted this finished cleanly, described the ears too, and the dry mouth, and the exact half-second the hillside had come apart into two disagreeing pictures before settling into one wrong one. She heard herself giving more than had been asked for and kept giving it anyway. Thoroughness had always worked for her before: a full account left nothing to guess at, and guessing was where problems came from. If she gave this woman everything there was to give, there'd be nothing left over for anyone to get wrong later, and the sooner it was all down on paper the sooner someone with actual authority could look at it and tell her what came next."},
            {t:"p", x:"Aya let her run out on her own rather than stopping her, which Kasane didn't clock as a technique, only as patience."},
            {t:"p", x:"“The bracketed text,” Aya said, once the room had gone quiet again. “Word for word, if you have it.”"},
            {t:"p", x:"Kasane gave her that too. Watched the brush stop dead on *ILLEGAL STATE* and stay stopped for three full breaths before it moved again."},
            {t:"p", x:"“Do you know what that means,” Kasane said. It wasn't quite a question. It came out flatter than she meant it to, tired past the point of shaping her voice the way she usually did."},
            {t:"p", x:"“No,” Aya said. Nothing else. She didn't offer a guess, and didn't pretend the silence afterward was anything other than what it was."},
            {t:"p", x:"She asked for the sequence a second time not long after, the Rent, then the pressure, then the text, in that order, confirmed, and Kasane understood without being told that this wasn't forgetfulness. It was the same thing a buyer did with a disputed weight: ask twice, compare the two answers, trust the version that didn't change."},
            {t:"br"},
            {t:"p", x:"Someone brought tea at some point, and neither of them acknowledged it as a break so much as a pause the questions happened to fall into. The paper screen had gone brighter since they'd started, the flat grey of morning thinning into something with more warmth in it. Kasane wrapped both hands around the cup and didn't drink from it for a while, just held the heat, the way she'd have held a tool she wasn't ready to use yet."},
            {t:"p", x:"Somewhere in the second hour, Kasane asked about the burn."},
            {t:"p", x:"It came out sideways, riding on the tail of an answer about how long she'd been on the mountain. She mentioned the season's charcoal, mostly to explain why she'd been alone up there in the first place, and then found she couldn't quite let the subject go. Three weeks of wood. The northeast corner either ruined outright or salvageable only if someone reached it before it caught. A season's income, more than half of it, sitting up the mountain deciding its own fate without her."},
            {t:"p", x:"“Is there someone who looks at that,” Kasane said. “The burn. Whether it's a loss anyone accounts for.”"},
            {t:"p", x:"Aya's brush didn't stop this time, which was its own kind of answer. “Not my office,” she said. “I can note it happened. I can't promise it goes anywhere.” A pause, not unkind, just accurate. “Most things a highland burner loses don't have an office that looks at them at all. That's not new because of last night.”"},
            {t:"p", x:"“No,” Kasane agreed. “It isn't.” She'd known that before she asked. She'd asked anyway, the way she'd have checked a vent she already knew was closed, because checking cost nothing and not checking left a question sitting unanswered where she could still feel its shape."},
            {t:"p", x:"Kasane hadn't expected comfort and didn't get any, and found, oddly, that the plain refusal to pretend otherwise sat better than a kinder lie would have."},
            {t:"p", x:"“When does someone confirm what I am,” she asked instead, because that at least should have a real answer. “Rank. Registration. Whatever the word is.”"},
            {t:"p", x:"“It's pending.”"},
            {t:"p", x:"“Pending since this morning, or pending in general?”"},
            {t:"p", x:"Something crossed Aya's face too briefly to name: less surprise than the look of someone noting a question had landed somewhere she hadn't expected it to reach. “That determination sits with more than one office,” she said. “It isn't mine to give you, and I won't tell you it's simpler than it is.”"},
            {t:"p", x:"“Is that unusual. The delay.”"},
            {t:"p", x:"“I'm not going to answer that either.” Aya set the brush down flat across the ink stone, deliberately, the closest thing to a full stop she'd made since sitting down. “Not because I'm hiding something interesting. Because I don't know yet, and a guess from me would sound like more than it is.”"},
            {t:"p", x:"Kasane turned the first answer over anyway, the way she'd have turned over a smoke color she didn't trust. *More than one office* wasn't an answer. It was the shape of one: the outline of something with more than one interested party standing behind it, none of them named."},
            {t:"br"},
            {t:"p", x:"The runner came in without knocking, which told Kasane more than the boy's face did. Whatever he was carrying, it was urgent enough that whoever sent him had decided courtesy could wait. He was young, out of breath in a way that meant he'd run more than the short distance between buildings, and he crossed straight to Aya and put a folded paper in her hand without a word, then stood there, clearly under instruction to wait for a response."},
            {t:"p", x:"Aya read it once, gave nothing away, read it a second time slower. When she set it down her writing hand had gone still on the table, brush resting, not moving to the ink. It was a small stillness, the kind Kasane would have missed entirely a day ago."},
            {t:"p", x:"“Give me a moment,” she said to the boy, not to Kasane, and he went and stood by the door instead of leaving, which meant the answer was expected soon."},
            {t:"p", x:"The questions that came after were the same shape as the ones before, procedural, evenly spaced, Aya's voice exactly as clipped as it had been an hour ago, but something underneath them had shifted register, the way a kiln's draw changes before you can name why. She asked Kasane to describe the mist's edge a third time, in different words than either previous account. She asked, for the first time, whether anyone else had been near the burn site in the last several days, and whether Kasane had told anyone besides Tetsu's nephew what had happened before Aya arrived. She asked how many people in the valley had actually seen Kasane's eyes since she'd come down, not just heard about them, and roughly how far word might already have traveled by now."},
            {t:"p", x:"“Why does that matter,” Kasane said."},
            {t:"p", x:"Aya considered the question long enough that Kasane understood she was deciding how much of an answer to give, not whether to give one."},
            {t:"p", x:"“Because I no longer think I'm the only office that's going to ask you these questions today,” Aya said. “And I'd like to have finished mine first.”"},
            {t:"p", x:"She didn't explain further. The runner was still waiting by the door, patient in the particular way of someone who'd been told exactly how long he was allowed to be patient for. Kasane, turning the sentence over the only way she knew how, looking for the one correction that made sense of it rather than a dozen separate guesses, found she didn't have anything close to enough information to answer it, and no clean way to ask Aya to give her more without admitting how much that not-knowing had already started to cost."}
          ]
        },
        {
          id: 3,
          movement: "Movement II — Classification",
          title: "Chapter Three",
          blocks: [
            {t:"p", x:"“Tell them ten minutes,” Aya said to the boy, not turning around. “Tell them I said ten, not 'soon.'”"},
            {t:"p", x:"He went. The door didn't quite close behind him, swollen in its frame from some past rain, the way every door in Tetsu's nephew's building seemed to be, and a thin line of the outer room's noise leaked in and then thinned to nothing as his footsteps receded."},
            {t:"p", x:"Aya didn't pick the brush back up right away. She sat with her writing hand flat on the table, looking at the folded paper the boy had left rather than at Kasane, and Kasane understood she was being given a moment she hadn't asked for and wasn't sure she wanted: a moment to notice, with nothing to occupy her hands, exactly how long she'd been sitting on a cushion built for grain disputes and boundary complaints, exactly how little she'd eaten since the tea, exactly how far away the mountain and its ordinary problems had gotten in one morning."},
            {t:"p", x:"Her stomach had stopped announcing itself hours ago, the way it did on long burns when there was no food and no time to want any. Not gone, just filed somewhere she didn't have to feel it. She felt it now. Her hands, wrapped loosely around the cold cup she hadn't finished, had gone slightly unreliable in a way that wasn't quite shaking, more a held stillness that cost something to maintain. She recognized the shape of it. It was the same discipline she'd have needed at the tail end of a three-day burn, when the fire wanted watching long after the body had stopped agreeing to provide it."},
            {t:"p", x:"The paper screen had gone from morning-white to something with a faint gold cast to it, the sun somewhere past its highest point now, and she realized she had no idea what time it actually was, only that it had been light out for what felt like a very long stretch of being watched. Her knees had reached the stage past stiffness, into a kind of distant ache that belonged to someone else's legs. She thought, with the specific bitterness of someone too tired to be diplomatic about it even in her own head, that if she'd known this was how the day would go she'd have eaten twice what she had before climbing."},
            {t:"p", x:"Aya picked the brush back up."},
            {t:"p", x:"“Ten minutes,” she said, mostly to herself, and then, to Kasane: “We'll use them. Sequence again. Not the whole account: from the mist's edge to the text. Nothing before, nothing after.”"},
            {t:"p", x:"“You have that already. Twice.”"},
            {t:"p", x:"“I'm aware what I have.” No heat in it. “I want a third version, and I want it faster than the second one. Don't think about what you said before. Just answer.”"},
            {t:"p", x:"It wasn't a request shaped like patience anymore. Kasane had spent two hours learning the difference between Aya's patient questions and Aya's necessary ones, and this was the second kind, arriving faster than any of the others had."},
            {t:"p", x:"She gave it. The mist's edge, the dry line she still hadn't touched. The four steps. The pressure, both sides of her skull at once. The fox, which she hadn't mentioned in either earlier telling and mentioned now only because *faster* had stripped out whatever instinct had been quietly deciding it wasn't relevant."},
            {t:"p", x:"Aya's brush stopped on that word alone. “A fox.”"},
            {t:"p", x:"“It didn't do anything. It looked at me and left.”"},
            {t:"p", x:"“You didn't say that before.”"},
            {t:"p", x:"“You didn't ask this fast before.” It came out sharper than she meant it, the first edge she'd let into her voice all day, and she heard it land and didn't take it back. She was too tired to take it back. Some part of her noted this the way she'd have noted a burn running hotter than planned: worth watching, not yet worth stopping for."},
            {t:"p", x:"Aya wrote the fox down without comment, which Kasane had learned by now meant it mattered and Aya wasn't going to explain how."},
            {t:"p", x:"“How long between the fox and the pressure.”"},
            {t:"p", x:"“I don't know. Seconds.”"},
            {t:"p", x:"“How many seconds.”"},
            {t:"p", x:"“I don't count my own...” Kasane stopped herself, made herself actually try, the way she'd try to reconstruct a burn's timing after the fact from what the smoke had looked like at each stage. “Three. Maybe four.”"},
            {t:"p", x:"“Which came first, the doubled shadow or the fox.”"},
            {t:"p", x:"“The shadow. Before I'd even reached the mist.”"},
            {t:"p", x:"“You said 'before' twice now in two different places in the sequence. Which before.”"},
            {t:"p", x:"The question landed wrong, some hinge in it that Kasane couldn't immediately locate, and for a moment she simply sat with the wrongness of it rather than answering, turning the two *befores* over to see which one Aya meant and finding, unhappily, that she wasn't entirely sure herself anymore which had come first in the account and which had come first in the actual hillside."},
            {t:"p", x:"“The shadow,” she said again, slower. “That before.”"},
            {t:"p", x:"“The bracketed text again. Word for word. Fast.”"},
            {t:"p", x:"“*ILLEGAL STATE.*” She'd said it enough times now that the words had started to lose their shape, the way any phrase did if you repeated it past the point of meaning it. “Before that: a word I couldn't read. Then the rest.”"},
            {t:"p", x:"“Which word.”"},
            {t:"p", x:"“I don't know. It wasn't in a language I...” She stopped. Corrected herself, because the question deserved the correction. “It wasn't language at all. It was there and then it wasn't.”"},
            {t:"p", x:"“Show me where, on the sequence. Before the pressure or after.”"},
            {t:"p", x:"“During.”"},
            {t:"p", x:"Aya's hand moved fast enough now that individual strokes had stopped being distinguishable as strokes, just a continuous dark line finding its way down the page. She didn't look up between questions anymore. She didn't pause at the mist, or at *both eyes*, or at any of the places she'd paused before: the questions had stopped being about noticing anything new and started being about speed, about seeing whether the account held its shape when there was no time left to build one."},
            {t:"p", x:"“Again. Whole thing. You have maybe four minutes.”"},
            {t:"p", x:"Kasane's mouth had gone dry the way it went dry on the mountain when smoke sat too long in a closed space, less thirst than a used-up-air feeling with no better name. She reached for the cup without thinking about it, the motion automatic, the kind of small unconscious correction her hands made a hundred times a day around a kiln without her noticing any of them."},
            {t:"p", x:"She started again. The mist. The dry line. The four steps."},
            {t:"p", x:"Somewhere in the third telling, faster than the second, faster than her own tiredness wanted to allow, she noticed she'd stopped choosing her words and started simply producing them, the account running on its own track now, worn smooth by repetition. Underneath the running account was a colder thought she hadn't let all the way to the surface until this exact moment: that whoever was arriving in ten minutes wasn't arriving to help her go home. That word, *office*, plural, unnamed, had been sitting in her chest since Aya said it, and it chose this moment, mid-sentence, to finish arriving."},
            {t:"p", x:"She kept talking. There wasn't a version of this room where she stopped."},
            {t:"p", x:"Her hand tightened on the cup."},
            {t:"p", x:"The world went sideways behind both eyes, a fraction of a second of double pressure she recognized instantly and completely, because her body had already filed it once, on the mountain, in the mist. One ear went muffled before the other cleared. The cup's ceramic under her fingers went briefly, impossibly *late*: not gone, not cold, not hot, just arriving at her fingertips a half-beat behind where her hand already was, as if the cup and her hand had briefly agreed to disagree about which moment they were both in."},
            {t:"p", x:"*[CONTACT: UNRESOLVED.]*"},
            {t:"p", x:"It was there and gone before she'd finished being afraid of it: her fingers sinking, for something under a second, fractionally further into the cup's side than ceramic should allow, no give, no breaking, just a wrongness of resistance, like pressing a hand into water that had decided, briefly, to argue with the shape of a bowl. Then the cup was simply a cup again, solid under her hand, and her account had stopped mid-word, her mouth still open on a sound she hadn't finished making."},
            {t:"p", x:"She looked at her hand. Her hand looked entirely ordinary. The cup sat exactly where it had been sitting."},
            {t:"p", x:"She looked up, and Aya's brush had stopped."},
            {t:"p", x:"Not set down: stopped, held an inch above the paper, ink threatening to run down the bristles and drip, which Aya did not appear to have noticed or care about. Aya was looking at Kasane's hand on the cup with an attention that had nothing procedural left in it at all. It was the first time all day her face had shown Kasane anything before she'd decided to let it."},
            {t:"p", x:"Neither of them said anything for the length of two full breaths."},
            {t:"p", x:"“Say that again,” Aya said. Quietly. Not the fast-interview voice from a moment ago. Something underneath it, controlled hard enough that only the smallest unsteadiness got through."},
            {t:"p", x:"“Say what.”"},
            {t:"p", x:"“Whatever you were about to say. Before.”"},
            {t:"p", x:"Kasane didn't know what she'd been about to say. She'd lost the thread of her own sentence somewhere inside the half-second her hand had stopped agreeing with the cup, and trying to find it now felt like reaching for a shape that had already dissolved. “I don't know. I was in the middle of the sequence. I don't know where I was.”"},
            {t:"p", x:"“Not that.” Aya set the brush down at last, deliberately, across the ink stone, the ink still wet enough to smear faintly where it touched. She didn't reach for a cloth. “Your hand. Just now.”"},
            {t:"p", x:"“I don't know what that was.”"},
            {t:"p", x:"“I know you don't.” Aya said it plainly, without the edge Kasane had half-braced for. “That wasn't a question.”"},
            {t:"p", x:"She looked, for a moment, at the cup itself: turned it a careful quarter-inch with one finger, the way a person checks whether a crack they saw was really there, and found the ceramic answering like ceramic always did, giving her nothing to point to. Then she looked back at Kasane, and whatever had crossed her face a moment ago had already gone somewhere Kasane couldn't follow, filed and put away with the same speed she'd have filed a fact she didn't yet trust herself to react to."},
            {t:"p", x:"“How do you feel,” Aya asked. It wasn't gentle, but it wasn't the case-building voice either: a genuine question, asked in a voice that had, for the first time since she'd walked into the room that morning, stopped sounding entirely like a case being built."},
            {t:"p", x:"Kasane opened her mouth to say *fine*, because that was the true answer to every version of that question she'd ever been asked in her life, and found she couldn't quite make herself say it. Not because it was a lie, but because for the first time all day she genuinely didn't know if it was true."},
            {t:"p", x:"“My hand feels like my hand,” she said finally, which was the only honest thing she had. “It didn't hurt. It didn't feel like anything, really, except wrong. The way the mist felt wrong. Not pain-wrong.”"},
            {t:"p", x:"“Does it feel wrong now.”"},
            {t:"p", x:"She flexed her fingers against the cup, once, testing the question the way she'd have tested a tool's balance. “No.”"},
            {t:"p", x:"“Tired. More than before this happened, or the same.”"},
            {t:"p", x:"“More,” Kasane admitted, and something in saying it out loud made it truer, made the ache in her legs and the dryness in her throat and the general sense of having been wrung out since before dawn all arrive at once, stacked on top of each other instead of filed separately the way she'd been managing them. “I don't know if that's from the day or just from that.”"},
            {t:"p", x:"“Both, probably,” Aya said, and it was the closest thing to reassurance she'd offered all morning, delivered in exactly the same flat, competent register as everything else she'd said, which was somehow what made it land at all. She didn't reach for the brush. She sat with her hand still resting near the ink stone, not writing, and Kasane understood that whatever Aya was deciding right now, it wasn't going onto the page yet."},
            {t:"p", x:"Outside, faint through the swollen door, she heard footsteps that weren't the boy's, heavier, unhurried, more than one set, and Aya heard them at exactly the same moment, her head turning a fraction toward the sound before she caught herself and turned back, and in that fraction of a fraction Kasane saw something she hadn't seen on her once all morning."},
            {t:"p", x:"She saw Aya, very briefly, look like someone who had run out of time to decide what to do with what she'd just seen."},
            {t:"p", x:"The footsteps didn't hurry and didn't slow, which felt worse than either extreme would have: the pace of people who already knew exactly where they were going and saw no reason to announce themselves further. Aya's eyes went once to the folded paper still sitting where the boy had left it, once to the closed case with its stacked, half-filled pages, and once, last, to Kasane herself, a look that lasted no longer than any of the others but sat differently, weighing something Kasane had no way to read."},
            {t:"p", x:"“Whatever happens when that door opens,” Aya said, low and fast, pitched for Kasane alone, “you don't volunteer what just happened here. Not the hand. Not any of it. Let me decide what goes in the record and when.”"},
            {t:"p", x:"Kasane held onto the instruction the way she'd have held onto any tool offered to her mid-crisis, without asking too closely who it was really for."},
            {t:"p", x:"The footsteps stopped just outside the door."},
            {t:"br"},
            {t:"p", x:"*Revision history: see header. Chapter 3's lighter postmortem pass (per `CH003_PROMPT.md`'s stop condition) has been run — see this session's postmortem notes for the full findings behind Revision 3's trims.*"}
          ]
        },
        {
          id: 4,
          movement: "Movement II — Classification",
          title: "Chapter Four",
          blocks: [
            {t:"p", x:"The door opened on a woman Kasane had never seen before, and the first thing Kasane understood about her was that she didn't need to say her own name for the room to reorganize around her the way it had around Aya that morning, only faster, and with less generosity in it."},
            {t:"p", x:"She was older than Aya by twenty years at least, dressed in the same unshowy way, carrying nothing: no case, no brush, nothing to set down on the table. She didn't need to bring the tools of the conversation with her. Someone else already had."},
            {t:"p", x:"“Aya.” Not a greeting. An accounting."},
            {t:"p", x:"“Kagome.” Aya was on her feet before Kasane had finished registering that standing was even an option available to her. Something had happened to Aya's posture in the half-second between the door opening and that word leaving her mouth: less fear than the stillness of someone recalculating, very fast, exactly how much of the morning's work she was about to have to defend."},
            {t:"p", x:"The woman, Kagome, apparently, though Aya's tone made clear the name wasn't offered for Kasane's benefit, looked at the room once, the way Aya had looked at the collection post that morning: the low table, the stacked pages, the cold tea, Kasane herself, last and briefest. Nothing about the look was unkind. Nothing about it was kind either. It simply priced everything in the room and moved on."},
            {t:"p", x:"“Since when,” Kagome said, still to Aya, “does someone outside this office know to ask questions about a case I haven't been briefed on yet.”"},
            {t:"p", x:"Kasane understood, distantly, that this was the runner's message finally arriving at its actual destination: not a fact delivered to her, but a fact that had detonated somewhere above her an hour ago and was only now producing visible damage at her own eye level."},
            {t:"p", x:"“I sent word the moment the pattern was confirmed,” Aya said. Even. Nothing defensive in it, which Kasane was coming to recognize as itself a kind of defense. “Not before. I wasn't going to escalate a hunch.”"},
            {t:"p", x:"“You had a hunch for two hours before you had a pattern.”"},
            {t:"p", x:"“I had a hunch for two hours because that's how long confirmation actually took.” A pause, brief enough that Kasane might have missed it a day ago. “I'm not going to apologize for taking the time to be right instead of being fast.”"},
            {t:"p", x:"Kagome didn't answer that directly. She turned, instead, to the stacked pages on the low table, and read: not skimmed, read, the same unhurried attention she'd used on the room itself, while Aya stood and Kasane sat and nobody offered Kasane anything to do with her hands this time."},
            {t:"p", x:"“The bracketed text,” Kagome said eventually, without looking up. “Word for word, from her.”"},
            {t:"p", x:"“It's transcribed. Page four.”"},
            {t:"p", x:"“I asked her.”"},
            {t:"p", x:"It was the first sentence anyone had spoken since the door opened that acknowledged Kasane was capable of producing information rather than simply generating it for someone else to write down. Kasane gave the sequence again, the fourth time now, or the fifth, she'd lost the exact count somewhere in the day's second hour, and heard her own voice come out flatter than it had all morning, worn down to something closer to recitation than testimony. Kagome listened with her hands folded, asked nothing else, and when Kasane finished, simply nodded once, the way a buyer nods at a weight that's come out exactly as expected."},
            {t:"p", x:"“Your hand,” Kagome said. “Show me.”"},
            {t:"p", x:"Kasane held it out. Kagome didn't touch it. She looked at it for a long moment, turned her own attention to the teacup still sitting where it had been sitting since the Slip, and then looked back at Kasane's face instead of her hand, which felt, obscurely, like the more invasive of the two examinations."},
            {t:"p", x:"“Does it still feel like yours.”"},
            {t:"p", x:"“Yes.”"},
            {t:"p", x:"“Good.” Kagome said it the way she might have said *noted*. She turned back to Aya. “This doesn't leave this office. Not the transcript, not the hand, not the fact that anyone else already asked. I want to know who reached outside before I decide what we're confirming to anyone.”"},
            {t:"p", x:"“That's not entirely mine to control at this point,” Aya said. Careful. Level. The closest Kasane had heard her come, all day, to disagreeing with someone out loud. “If it's already moving...”"},
            {t:"p", x:"“Then it's moving without our confirmation attached to it, which is the only part of this we still have any say over.” Kagome's voice didn't rise. It didn't need to. “Finish the file. I'll want it by evening.”"},
            {t:"p", x:"She looked at Kasane once more, without any real hostility in it, just entirely without the gravity a stranger's attention usually carried, the way a burn inspector looked at a kiln rather than at the person who'd built it."},
            {t:"p", x:"“You've been thorough,” Kagome said. “That's noted too.”"},
            {t:"p", x:"Kagome's eyes moved once more around the room: the cold tea, the stacked pages, the brush resting where Aya had set it, with the attention of someone confirming an inventory rather than saying goodbye to a place. Then, to Aya, already turning for the door:"},
            {t:"p", x:"“Walk with me.”"},
            {t:"p", x:"They went. The door didn't quite close behind them either, and for a moment Kasane could hear the register of their voices change on the other side of it, lower, faster, the cadence of two people who'd stopped performing for a room and started actually negotiating, before the sound thinned into the ordinary noise of the building and gave her nothing more to work with."},
            {t:"br"},
            {t:"p", x:"Kasane sat alone in the back room for what felt like a long time and was probably closer to ten minutes, long enough for the light through the paper screen to shift another visible degree toward evening, before someone, not Aya, one of Tetsu's nephew's people, apologetic and clearly told very little, came to say she was free to go for the day."},
            {t:"p", x:"*For the day.* Not *for good.* Not *until we know what you are.* Just the day, the way a shift ends without the work being finished."},
            {t:"p", x:"She stood, and her legs informed her, with real authority this time, that they had opinions about how long they'd been asked to hold a sitting position while carrying a body that hadn't eaten properly since the previous evening. The walk to the door felt longer than it should have. Outside, the light had gone gold and low, the particular color the valley took on in the hour before the cold set in properly, and the ordinariness of it hit her harder than anything that had happened in the back room: smoke from cook-fires, someone's goat complaining, the smell of the collection post's usual business reasserting itself now that the crowd from the morning had long since drifted back to whatever they'd been doing before Kasane arrived."},
            {t:"p", x:"Nobody in the street knew. That was the strange, suspended mercy of it. Whatever Kagome had just tried to contain was still, out here, nothing at all. Kasane stood for a moment just breathing the ordinary air, letting her eyes rest on things that didn't require an answer: a stacked woodpile, a cart wheel someone had left leaning against a wall, a line of washing that had clearly been hung out before dawn and forgotten about since. None of it looked back at her. None of it had a file with her name on it."},
            {t:"p", x:"She'd gotten perhaps thirty paces down the road, working out with real effort which direction her own house was actually in, when a voice she knew, a voice that belonged to charcoal orders and delivery schedules and absolutely nothing that had happened today, said her name like it was a line item that had finally come back in stock."},
            {t:"p", x:"“Kasane.”"},
            {t:"p", x:"Genzou was standing by a hitched cart she didn't recognize, and he looked, for the first half-second, exactly as she'd have expected: same weathered coat, same permanently assessing eyes, a man built for reading ledgers and buyers, and then, underneath that, something else, something that hadn't finished deciding whether it was relief or accounting."},
            {t:"p", x:"“You're standing,” he said. “That's more than the version I heard.”"},
            {t:"p", x:"“What version did you hear.”"},
            {t:"p", x:"“Three separate ones, none of which agreed with each other, one of which had you carried down the mountain on a door.” He looked her over, quick, professional, the same look he gave a delivery to check nothing had shifted in transit, and something in his shoulders came down half an inch when the inventory came back acceptable. “Word moves faster than sense in this valley. Always has.”"},
            {t:"p", x:"“How did you hear at all. It's not even been a full day.”"},
            {t:"p", x:"“Faster than that.” He said it flatly, no pride in it, just a fact of his trade. “A courier out of Tetsu's territory carries market bulletins twice a week regardless of what's in them. Yours went out with this morning's batch because nobody thought to stop it: an eye color's not exactly classified information to a boy who just wants his fee for the run.” A beat. “I had three other suppliers ask me about it before I'd even finished my own breakfast.”"},
            {t:"p", x:"“So what did you hear,” Kasane asked, “exactly.”"},
            {t:"p", x:"“That you found something up on the mountain that shouldn't have been there, and it left a mark on you nobody can explain.” He said it plainly, without dressing it up or flinching from it, the way he'd report a bad weight rather than soften it. “That's the version that survived three retellings. I assume it's missing most of what actually happened.”"},
            {t:"p", x:"Kasane stood there for a moment with the whole day pressing up behind her teeth, and understood, with a kind of tired clarity, that none of it belonged to this conversation: the mist, the dry line, the pressure behind both eyes, *ILLEGAL STATE*, the cup going wrong under her fingers, Kagome's flat “does it still feel like yours.” Genzou wasn't owed the institutional account, the one she'd built and rebuilt all day for people with brushes and case files. He was owed the version that actually mattered to him, and nothing more."},
            {t:"p", x:"“Something happened up there,” she said. “It changed my eyes, and it isn't finished happening. I don't fully understand it, and neither does anyone official who's asked me about it today, whatever they'd want you to believe.” She hesitated, then added the only piece of it that felt like it was actually hers to give him rather than the office's: “I'm not hurt. Whatever this is, it hasn't stopped me from being able to work. I just don't know yet if anyone's going to let me.”"},
            {t:"p", x:"Genzou studied her for a moment, the assessing look easing into something plainer. “That's more honesty than I got from the last three people who told me a version of this,” he said. “I'll take it.”"},
            {t:"p", x:"Kasane felt something in her chest do something complicated: not quite the flicker of doubt that had caught her mid-sentence in the interview room, but close enough to be its cousin."},
            {t:"p", x:"“I'm sorry,” she started, “if it's caused trouble for the...”"},
            {t:"p", x:"“It hasn't caused trouble.” Genzou cut her off, gently enough, the way he'd have cut off an apology over weather he owed her no compensation for. “It's caused questions. There's a difference, and I've got a season of them regardless of what happened to your eyes.” He shifted his weight, and the careful merchant's neutrality in his voice thinned, just slightly, into something with more urgency underneath it. “The forge-house contract closes in eleven days. I need to know if you're still burning.”"},
            {t:"p", x:"“I don't know.”"},
            {t:"p", x:"“That's not an answer I can carry to a buyer.”"},
            {t:"p", x:"“It's the only one I have.” She heard her own voice catch on something: not tears, just the accumulated weight of a day that had asked her the same question in a dozen shapes and never once let her say *I don't know* and have it be enough. “The burn's still up there. I don't know what's left of it. I don't know when they'll let me go back and look, or if they will, or what I'm even allowed to be doing while all of this,” she gestured, vaguely, at the collection post, the road, the entire unresolved shape of the day, “gets decided by people who haven't told me their names.”"},
            {t:"p", x:"Genzou was quiet for a moment, turning that over with the same care he'd have given a disputed weight."},
            {t:"p", x:"“Eleven days,” he said again, softer this time, not a demand, just the number sitting between them because it wasn't going anywhere on its own. “Tell me what you can, when you can. I'll hold what I can hold.” A pause. “That's not nothing, even if it isn't an answer either.”"},
            {t:"p", x:"“I know,” Kasane said, and found she meant it, and still had no better one to give him."}
          ]
        },
        {
          id: 5,
          movement: "Movement III — Ownership",
          title: "Chapter Five",
          blocks: [
            {t:"p", x:"By the time anyone told Kasane to sit down, she had already counted six people in the room who weren't Aya, and none of them had told her their names."},
            {t:"p", x:"It had taken most of a week to arrange whatever this was. Genzou's eleven days had become nine somewhere in the waiting, a fact she'd tracked the way she used to track a burn's remaining fuel, watching it burn down with no way to add more wood to the count. Someone from Aya's office had come for her at first light, a cart already waiting, and Kasane had spent the whole ride down out of the Black Mountain Belt doing something she hadn't done in years: leaving it. Her whole life had fit inside that stretch of mountain and the valley beneath it, and watching it recede past the cart's rail, the last charcoal-smoke haze she recognized as belonging to anyone she knew, the road widening, the houses changing their roofs from thatch to tile the further they got from home, had felt less like travel than like being slowly removed from the only account of herself anyone had ever needed."},
            {t:"p", x:"Kurokawa, when they reached it, was larger than any town she'd stood in before: not a castle-city, nobody had told her that much at least, but big enough that its administrative buildings didn't have to double as grain-dispute rooms the way Tetsu's nephew's had. The registry sat behind a modest gate, plain-fronted, built for function rather than display, and she'd told herself on the walk in that a room this large, this official, meant an answer was finally coming. She understood now, thirty seconds into actually being in it, that the size of the room had nothing to do with answers. It had to do with how many separate people needed to be seen agreeing to whatever happened here."},
            {t:"p", x:"Aya found her a place near the wall rather than at the table itself: a small, deliberate mercy, Kasane suspected, though Aya's face gave nothing away about whether it was kindness or simply procedure."},
            {t:"p", x:"“Most of this won't involve you speaking,” Aya said, low. “It's not a hearing. It's a confirmation, with an audience.”"},
            {t:"p", x:"“Confirmation of what.”"},
            {t:"p", x:"“Watch,” Aya said, which wasn't an answer, and turned back to the table before Kasane could ask again."},
            {t:"p", x:"The registry clerk read the rank into the record without ceremony, the way a smith might read out a weight he'd already double-checked twice: *Kasane. Marked. F-rank. Stirred.* Someone stamped something. Someone else initialed it. It took perhaps forty seconds, start to finish, for the word she'd been waiting on since the collection post, since Aya's cup of unfinished tea, to become an official fact rather than a pending one, and Kasane sat with the strange, deflating discovery that having it confirmed changed absolutely nothing about how many people in the room were still looking at her like an open question."},
            {t:"p", x:"“That's the easy part done,” said a voice from further down the table: economical, flat, the voice of someone who considered most sentences a waste if they ran longer than necessary. “Now the actual business.”"},
            {t:"p", x:"He hadn't been introduced, but Kasane placed him within a few words as a man built for a different kind of room than this one: someone more used to standing than sitting, going a little restless at a table designed for paperwork rather than terrain. Fifty or close to it, weathered in a way that had nothing to do with sun."},
            {t:"p", x:"“Isato,” he said, to her directly, which none of the others had bothered doing. “Kuromori. I've got a team and a season's worth of Gate incidents that don't wait for administrative timelines, so I'll be quick. Kuromori doesn't care what you are in the abstract. We care whether you're a working asset or a liability we're going to end up cleaning up after. I'm here to find out which, and I'd rather do it by watching you work than by asking you to describe yourself.”"},
            {t:"p", x:"“That's forward,” Kasane said, before she'd fully decided to say it."},
