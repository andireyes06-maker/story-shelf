            {t:"p", x:"“It's efficient.” No offense in his voice at all. If anything, something that might have been the beginning of approval. “I don't have time for the other kind.”"},
            {t:"p", x:"“What does 'watching me work' actually mean.”"},
            {t:"p", x:"“Supervised trials. Controlled conditions, someone competent standing close enough to end it if it goes wrong.” He said this the same way he'd said everything else, without drama. “I'm not asking today. I'm telling you it's coming, so you can stop being surprised by it when it does.”"},
            {t:"p", x:"“And if I decline.”"},
            {t:"p", x:"“You won't,” Isato said, no bite in it, just certain. “You're the kind that wants to know what she's actually capable of. I've met enough of your kind to recognize it before they've admitted it to themselves.”"},
            {t:"p", x:"Across the table, someone else had been waiting with the particular patience of a man who considered impatience beneath him."},
            {t:"p", x:"“Moritaka,” he said, once Isato had finished. “Shirogane.” Nothing else by way of introduction: no rank, no title, offered the way a fact is offered rather than a courtesy. “Our interest is somewhat different,” he went on, in a voice so level it seemed to arrive pre-approved by whoever might have objected to it. “Kuromori wants to know what you're worth. I'd like to establish what you're contained by.”"},
            {t:"p", x:"“Contained,” Kasane repeated."},
            {t:"p", x:"“An undocumented ability, demonstrated once already under institutional observation, is a standing risk regardless of your intentions.” He said it the way he might have read a weather report: not cruel, simply certain. “I'm not here to determine whether you're dangerous on purpose. I'm here to determine what happens if you're dangerous by accident, and what limits exist on that if no one's decided any yet.”"},
            {t:"p", x:"“And if I don't agree to be contained by anything.”"},
            {t:"p", x:"“Then Shirogane will recommend that someone decide for you.” He said this too without heat, which was somehow worse than if he'd threatened her outright. “I'd prefer it not come to that. It rarely helps anyone's case.”"},
            {t:"p", x:"“Whose case has it not helped before mine.”"},
            {t:"p", x:"It was the first question she'd asked that made him pause, however briefly: not long enough to call a hesitation, just a half-beat where something behind his eyes moved without his face following it. “That's not relevant to this session,” he said, and the sentence came out marginally more clipped than the ones before it, which told her more than the words did."},
            {t:"p", x:"Two seats along the table sat empty. Nobody explained them, not directly, though when the clerk called for any objection to the recorded rank, a young man Kasane hadn't yet placed said, quietly, “Karasu sends no representative this session,” and someone else, even more quietly, noted that Motoi's seat remained “reserved, pending doctrine.” Two Clans, absent by choice, and the room proceeded around the gaps in it as if empty chairs were simply part of the furniture, nobody troubling to explain what an empty chair meant when it was a whole Clan doing the sitting-out."},
            {t:"p", x:"The rest of it moved fast once the real business was done: signatures, a copy of the confirmed record pressed into her hands, Aya at her elbow murmuring the practical parts (where the record would be kept, who to contact if anything about her condition changed) that nobody official had thought worth saying to her directly. Isato was already on his feet before the clerk finished the last signature, the restlessness she'd clocked in him earlier resolving into simple impatience to be somewhere with actual work in it. Moritaka didn't rise at all until the room had mostly cleared, folding his own notes away with the unhurried precision of a man who'd never once in his life needed to be first out a door to keep his standing intact."},
            {t:"p", x:"By the time the room began emptying, Kasane had a rank, a folder, and the specific, settling weight of having been discussed by more people with more differing interests than she'd known existed a week ago."},
            {t:"br"},
            {t:"p", x:"She was still absorbing the shape of that when a voice caught her in the corridor outside: warmer than anything that had happened in the room she'd just left, and for exactly that reason, immediately suspicious."},
            {t:"p", x:"“You handled that better than most people twice your rank would have.”"},
            {t:"p", x:"He was young for the confidence in his voice: Akaishi by the crest at his collar, though he wore it the way some people wore a good coat, aware of the impression rather than the meaning. Good-looking in the deliberate way of someone who'd learned early that it was an asset worth maintaining."},
            {t:"p", x:"“Renji,” he said, before she could ask. “I didn't have a seat in there. Didn't need one: Akaishi's interest in you isn't the kind that gets discussed across a table with Shirogane listening.”"},
            {t:"p", x:"“What kind is it, then.”"},
            {t:"p", x:"“The kind that's better discussed with fewer people in the room.” He smiled, easy, unhurried, the smile of someone confident the conversation was already going his way. “I'll be direct, since you clearly prefer it. There are things about your situation Akaishi finds interesting for reasons that have nothing to do with what Kuromori wants or what Shirogane's afraid of. I'd rather explain them to you properly, somewhere that isn't a hallway, than let you hear a worse version of it from someone else first.”"},
            {t:"p", x:"“That's not an explanation.”"},
            {t:"p", x:"“No,” he agreed, entirely unbothered by being caught at it. “It's an invitation to one.”"},
            {t:"p", x:"“Try harder, then. I've had a long week of people telling me they'll explain things later.”"},
            {t:"p", x:"Something flickered across his face, a small recalibration rather than offense, a man discovering the easy version of a conversation wasn't going to be available to him. He recovered fast enough that she almost missed it. “Fair,” he said. “Shortest version I can give you in a hallway: Akaishi has old records, older than most Clans keep, about who's carried certain things before you. I'm not going to tell you what those records say standing here, because half of what I could tell you would be speculation dressed as fact, and you've clearly had enough of that today already.”"},
            {t:"p", x:"“You could still tell me the half that isn't speculation.”"},
            {t:"p", x:"“I could.” He smiled again, but it came slower this time, more considered. “I'd rather you want to hear it, instead of extracting it from me the way you just did that question. It'll matter to you which version you got it as, later.”"},
            {t:"p", x:"“That sounds like something a man says when the truth doesn't help him as much as the mystery does.”"},
            {t:"p", x:"“It might be,” he said, and for just a moment the performance dropped enough that she saw something plainer underneath it: a man keeping careful score of exactly how much he was willing to spend before he'd gotten something back, less dishonest than calculating. Then it was gone, and the easy charm reassembled itself like it had never slipped. “I'll find you again before the Rite. Ask Aya what she knows about Akaishi's interest in the meantime, if you don't trust me to give it to you straight. I think you'll find I'm offering you something none of the people in that room were.”"},
            {t:"p", x:"He left before she could ask what that was, unhurried, certain enough of the outcome that he didn't need to press further today. She stood there for a moment in the empty corridor with the distinct, uncomfortable sense of having been handed something without being told what it weighed, or what he'd expect back for it."},
            {t:"br"},
            {t:"p", x:"Outside, the Kurokawa evening was settling into the kind of ordinary cold that had nothing to do with any of it: cart traffic, a woman selling roasted chestnuts near the registry gate, the everyday business of a town that had no idea a room inside it had just spent an hour deciding how carefully she needed to be watched."},
            {t:"p", x:"Kasane stood with the folder in her hands and did the arithmetic anyway, the way she couldn't stop herself from doing arithmetic on anything that mattered. A rank, finally, that answered nothing. A Kuromori Warden who wanted to test her like equipment. A Shirogane voice, still unnamed, measuring her for a leash he hadn't decided the length of. An Akaishi scion offering her something he wouldn't name, in exchange for something he hadn't asked for yet but clearly intended to."},
            {t:"p", x:"Four parties now, where a week ago there had only been Aya and an empty chair where her own future should have been sitting. She had wanted this to acquire rules. It had: more rules than she could count, arriving from more directions than she had hands to hold them in."},
            {t:"p", x:"Two empty chairs, too, and she found she couldn't stop turning those over as easily as the rest. A Kuromori Warden's want was at least a want she recognized: usefulness, the same currency she'd traded in her whole working life. Shirogane's want was colder but still legible, a ledger of risk rather than of value. Renji's want, whatever it actually was, had at least announced itself as wanting something. An empty chair announced nothing at all, and she was tired enough, and far enough from home, that not being able to price a thing bothered her more tonight than any of the things she could."},
            {t:"p", x:"She started walking, because there was nothing else productive to do with the folder or the cold or the sudden, exhausting weight of being a documented fact to five separate people who each wanted a different version of her to be true."}
          ]
        },
        {
          id: 6,
          movement: "Movement III — Ownership",
          title: "Chapter Six",
          blocks: [
            {t:"p", x:"The note came by the same kind of runner who'd once stood patiently by a door waiting for Aya to finish a sentence, except this one didn't wait for anything. He put the folded paper in Kasane's hand, said “no reply expected,” and was gone back down the path before she'd finished unfolding it."},
            {t:"p", x:"*For your awareness,* it read, in Aya's economical hand. *The charcoal factor Genzou appears in the supplementary record as a party questioned by an outside office regarding your case, prior to any confirmation. No action required of him. Noted for completeness.* No signature beyond the single initial Aya used for anything not meant to travel far."},
            {t:"p", x:"Kasane read it twice, standing in her own doorway with the mountain behind her for the first time in what felt like a season, and understood immediately what it actually meant underneath the flat administrative language: Genzou's name was in a file now. Not because he'd done anything. Because a courier boy had wanted his fee and hadn't known better, and now a man who'd never asked to be part of any of this had a line of text next to his name in an office three days from home."},
            {t:"p", x:"The house had gone cold the way a house goes cold when nobody's fed its hearth in weeks rather than days: not just unheated but unused, the stillness of a room that had stopped expecting anyone. Her own boots by the door where she'd left them the morning of the Marking, still caked with mud from a hillside she hadn't seen since. She'd been back twice since Kurokawa, both times too briefly and too exhausted to do anything but sleep and leave again, and this was the first time she'd actually stood in her own doorway long enough to notice how much of her old life was still just sitting here, waiting for a version of her that hadn't been in charge of anything for weeks."},
            {t:"p", x:"A jar of last season's pickled greens sat on the shelf where she'd left it, half-finished, the way you'd leave something you fully expected to come back and finish within the week. There was a mended strap on a pack she hadn't touched since. There was a whole ordinary life in this room, patiently unaware that the person it belonged to had spent the last month becoming a documented fact to five separate offices, and some of what she felt standing in the doorway wasn't dread at all: it was closer to grief for a version of an afternoon she used to be able to plan without checking whether anyone else needed to sign off on it first."},
            {t:"p", x:"She sat with the note for longer than it deserved, turning it over the way she'd turn over a report from the road: not for what it said, but for what it meant the road was actually like."},
            {t:"br"},
            {t:"p", x:"She knew Genzou's patterns the way she knew the smell of a burn about to blow. Two winters back, a supplier out past the eastern ridge had lost most of a season to a bad leg and Genzou had quietly redirected the man's usual contracts elsewhere within a month, not cruelly, not even particularly coldly, just efficiently, the way you'd reroute a road around a washout rather than wait for someone to fix it. Kasane had heard about it secondhand at the time and thought nothing of it beyond a mild, distant sympathy for a man she didn't know. She understood it differently now, sitting with Aya's note in her hand. That wasn't a story about a stranger. That was evidence."},
            {t:"p", x:"She made herself weigh the other side of the ledger too, because a reading built on only the evidence that supported it wasn't a reading she'd trust from anyone else. There was the bad season three years back, the one that still made her flinch a little to think about: the summer the rains came early and ruined two burns in a row, and Genzou had extended her credit against a season she hadn't finished earning yet, on nothing but the fact that she'd always paid before. That wasn't the action of a man who cut people loose the moment they became inconvenient. She turned both facts over side by side for a long time: the supplier he'd dropped, the credit he'd extended her. They didn't cancel each other out. They were both true, about the same man, and the honest answer was that she didn't actually know which one described what he'd do now. Only that the first one was the one that mattered if she guessed wrong, and the second one was the one that mattered if she guessed right, and she had no way to test either without asking him directly, which was the one thing she'd already decided not to do."},
            {t:"p", x:"He was fighting a margin war that had nothing to do with her and had been running for two seasons before she'd ever climbed the mountain that started any of this. He had a transport crew whose wages depended on contracts staying clean and boring. He had a forge-house deal closing inside the week that would define his whole season, and a rival buyer circling that exact contract who would need only the smallest excuse, a supplier tangled up in an open Clan matter, a name in a file next to the word *anomaly*, to make Genzou's whole operation look like a liability instead of a bet."},
            {t:"p", x:"She thought about writing to him. She got as far as finding a scrap of paper and sitting with the brush in her hand before she understood what she'd actually be asking, dressed up as a simple request: *use your crew, extend your credit, put your name next to mine one more time, at the exact moment my name has started meaning something expensive.* He would say yes. She was certain of that in the plain, uncomplicated way she was certain water ran downhill: he'd said yes to smaller, less clean things than this for six years running, out of habit if nothing else. And if he said yes now, out of habit, without being told clearly what it might cost him, that would be worse than if she'd never asked at all. She would have let him make a bad bet without giving him the numbers."},
            {t:"p", x:"So she wouldn't ask. That was the kinder shape of the same decision, and she was tired enough, and certain enough, that it didn't occur to her to test whether it was actually kinder or only easier."},
            {t:"br"},
            {t:"p", x:"She went up to the burn site alone the next morning, before she could talk herself into asking anyone for company, and stood for a long time at the edge of it without doing anything a burner would recognize as work."},
            {t:"p", x:"The northeast corner was as ruined as she'd feared, collapsed in on itself and long cold, weeks of unattended fire having done exactly what unattended fire always did. But the rest of it had survived better than she'd let herself hope during the worst of the waiting: enough good char under the ruined section to be worth someone's trouble, if that someone had a crew and a cart and no reason to ask her any questions about why she wasn't using her usual ones. She catalogued it the way she'd have catalogued any burn, weight and grade and how much of it would survive the trip down without crumbling to waste, and tried not to notice that some of the actual counting felt like an excuse to stand a little longer in the one place that still looked exactly like it always had, mist and ordinary stone and her own boot-prints from a morning that already felt like it belonged to someone else."},
            {t:"p", x:"She had numbers by the time she came back down. Numbers were the only part of any of this that had stayed simple."},
            {t:"p", x:"On the walk down, she passed the spot where the trail forked toward Genzou's usual collection point: a habit of feet more than a decision, the path her legs had walked often enough that they'd apparently kept the memory even after she'd stopped consulting them. She stood at the fork a moment longer than the choice deserved, then took the other way, down toward the main road and the yard she'd never once had reason to visit before this week."},
            {t:"br"},
            {t:"p", x:"The other buyer's yard smelled the same as any charcoal yard: char and cold ash and the mineral bite of good hardwood burned properly. That ordinariness was, in its own way, the worst part of the whole visit. It should have felt like betrayal. It mostly just felt like business, which was exactly the tone the man across the scale seemed to want it to have."},
            {t:"p", x:"“You're Genzou's mountain,” he said, easy about it, weighing her with the same brief professional glance he'd have given a delivery. “Didn't expect you'd come to me direct.”"},
            {t:"p", x:"“He doesn't need to know I did.”"},
            {t:"p", x:"“No,” he agreed, easy, unbothered, a man who'd clearly done this kind of conversation before and knew better than to enjoy it visibly. “I don't imagine he does.”"},
            {t:"p", x:"He was younger than she'd pictured him, based on nothing but two seasons of hearing his name said the way you'd say the name of a weather pattern that kept ruining harvests. Unremarkable to look at, which she found, once she'd noticed it, harder to hold a grudge against than she'd expected: she'd built someone more deliberately unpleasant in her head, and the ordinary man in front of her, checking a ledger with the same unhurried competence Genzou himself might have used, didn't fit the shape she'd need him to have for this to feel like the betrayal it technically was."},
            {t:"p", x:"“Heard you had an interesting spring,” he said, not looking up from the ledger, in the tone of a man commenting on weather rather than fishing for anything. “Whole valley's heard it, by now. Faster than most things travel.”"},
            {t:"p", x:"“That's not why I'm here.”"},
            {t:"p", x:"“Didn't say it was.” He glanced up, briefly, unbothered. “Just noting I already know why the rate's going to matter to you more than it would have last season. Costs you something to pretend I don't.”"},
            {t:"p", x:"He offered her a rate two full measures under what Genzou had always given her: not an insulting rate, just the rate a man offers a supplier he knows has nowhere better to go this week, and knows it precisely because word of exactly why had already reached him too, filtered down through the same rumor network that moved bulletins twice weekly whether anyone wanted them to."},
            {t:"p", x:"“That's low,” she said, because it was, and because some habits didn't care what kind of day she was having."},
            {t:"p", x:"“It's fair for the week you're having,” he said, without any apparent enjoyment in saying it, which somehow made it easier to hear than if he'd relished the leverage. “I'll move on the grade split if the char comes in cleaner than you're promising. I won't move on the base rate. You didn't come here for my best price. You came here because I'm the only buyer in three valleys who won't need to ask you a single question before he takes the delivery.”"},
            {t:"p", x:"He wasn't wrong, which was its own kind of insult, small and precise and entirely deserved. She took the rate. She told herself the difference was the price of not costing Genzou anything, and didn't examine too closely whether that price was actually hers to set."},
            {t:"p", x:"They settled it plainly: whatever she could recover from the burn, delivered inside nine days, against his own credit and his own crew for the retrieval, at his rate, under his name on the paperwork rather than hers or Genzou's. A specific shipment. A specific date. Numbers on a page, the way she liked her problems best."},
            {t:"p", x:"“Pleasure doing business,” he said, and meant it, in the flat way men like him meant most things."},
            {t:"br"},
            {t:"p", x:"Walking back up toward the mountain afterward, Kasane found something in her chest had loosened for the first time since the collection post: not joy, nothing that warm, just the familiar relief of a column finally balancing. The forge-house deadline would be met, one way or another, without her name ever touching it directly. Genzou's file entry would stay exactly as thin as Aya's note had described it: *questioned, no action required.* Nothing more would ever need to be added to it because of her."},
            {t:"p", x:"She thought, briefly, about writing to him after all: not to ask anything, just to say she hoped the contract closed well, the way she might have before any of this started. She decided against that too. A message from her, however harmless, was still her name arriving at his door at the exact moment she'd gone to some trouble to keep it from doing exactly that. Better, she told herself, to simply let the season play out and let him hear, eventually, secondhand, that her supply problem had solved itself."},
            {t:"p", x:"She had solved the problem competently, cleanly, and kindly. It had cost her a worse rate and a strange man's careless *pleasure doing business* and nothing else that she could see. She walked the rest of the way home turning the arrangement over once more, the way she always did with a finished job, looking for the crack in it, and didn't find one."},
            {t:"p", x:"The mountain looked ordinary in the last of the light. For the length of the walk home, so did everything else."}
          ]
        },
        {
          id: 7,
          movement: "Movement III — Ownership",
          title: "Chapter Seven",
          blocks: [
            {t:"p", x:"She'd meant to arrive early enough to watch the loading happen without anyone needing to say anything to her at all: the whole appeal of the arrangement, from the start, had been how little of it required her actual presence. She'd timed the walk down from her own place carefully, the way she timed everything now, wanting to be there just long enough to confirm the numbers matched and no longer."},
            {t:"p", x:"She heard the argument before she saw it: two men's voices pitched low and hard over the sound of a cart being loaded, the particular flat cadence of a dispute about money rather than principle, though it would turn out to be both. By the time she came around the last stand of trees to the retrieval point, Genzou was already standing between the rival buyer's crew and the half-loaded cart, arms crossed, looking like a man who had walked a long way specifically to be difficult."},
            {t:"p", x:"Behind him, the rival's crew had stopped working entirely, four men standing around a half-loaded cart with the particular studied idleness of laborers who'd decided this argument was worth more to watch than whatever they were being paid to load. Sacks of good char sat stacked at odd angles, abandoned mid-transfer, and somewhere underneath the argument Kasane could hear a horse shifting its weight, unbothered by any of it, the only creature present with no stake in how the afternoon ended."},
            {t:"p", x:"“You're early,” she said, which was the only thing she could get out before the rest of it arrived in her all at once."},
            {t:"p", x:"“I'm exactly on time,” Genzou said, not looking away from the rival buyer. “Just not for the day anyone told me about.”"},
            {t:"p", x:"The rival buyer, ledger under one arm, entirely unbothered, a man for whom this was clearly not the strangest Tuesday he'd had, glanced between them both with the mild interest of someone watching weather change direction, the same flat professional patience she remembered from his own yard a week ago, as if nothing that happened in front of him could ever quite rise to the level of his actual attention. “He's offering to match my rate and cover the difference on what's already loaded,” he said to Kasane, as if reporting a fact about the price of grain. “I told him that's fine by me. I've got no loyalty to a shipment, only to getting paid for one.”"},
            {t:"p", x:"“You didn't need to do this,” Kasane said to Genzou."},
            {t:"p", x:"“No,” he agreed. “I didn't need to. I wanted to.”"},
            {t:"br"},
            {t:"p", x:"They stepped away from the crews to say the rest of it, which didn't make it private so much as quieter: everyone within thirty feet could still hear every word, and both of them knew it, and neither of them slowed down for that reason."},
            {t:"p", x:"“I went to him instead of you,” Kasane said, “so that your name would stay clean. Do you understand what you've just done to that?”"},
            {t:"p", x:"“I understand it better than you think.” Genzou's voice had none of the careful merchant neutrality she remembered from the roadside a week ago: something plainer underneath it now, worn down to its actual shape. “You went around me to protect me. I'm telling you plainly: I don't want that kind of protecting. I'd rather you asked me and I said no, than have you decide for me what I can and can't afford to be seen doing.”"},
            {t:"p", x:"“You'd have said yes.”"},
            {t:"p", x:"“I would have.” No hesitation in it at all. “That was never the part you got wrong. You read me exactly right: I'd have said yes, out of habit, out of six years, out of not being the kind of man who says no to you over a season's supply. That's true. And you decided that made the yes not count, because I might not have understood what I was agreeing to.” He shook his head, slow, more tired than angry. “You don't get to decide that for me either. If my yes doesn't count because I might say it too easily, then no yes I ever give you will count, and that's not a kindness. That's just you keeping the ledger for both of us.”"},
            {t:"p", x:"“Your forge-house contract...”"},
            {t:"p", x:"“Will close or it won't, on its own merits, the way it always has.” He said it flatly, a fact rather than bravado. “What it won't do is close because I quietly let my supplier go the moment her name got expensive. I've done that once before, to someone who didn't deserve it, over a bad leg and a bad season that wasn't his fault either. I told myself it was just business at the time. It's taken me most of two years to admit it wasn't, and I'm not doing it again just because this time the reason sounds better.”"},
            {t:"p", x:"He didn't say who. He didn't say what happened to the man afterward, or whether the bad leg had ever healed, or whether the two of them had spoken again since. Kasane found she wanted to ask all of it at once, the specific hunger of a person who'd spent six years cataloguing this man's patterns without ever once suspecting there was a whole ledger entry she hadn't been shown. She understood, from the exact weight of the silence where those details would have gone, that she wasn't getting them today, and that asking would cost something neither of them could currently afford to spend. So she let it sit, the way she'd let the dry line in the mist sit on the mountain, a fact she'd have to come back to later with more time and less at stake."},
            {t:"p", x:"Her hands had gone tight at her sides without her quite deciding to let them, the specific stillness she used on herself when a burn was running hotter than planned and shouting at it would only waste the breath. She made herself unclench them before she spoke again."},
            {t:"p", x:"“Do you understand what this looks like,” she said instead, quieter now. “Two arrangements, same shipment, same week. Whoever's reading my file is going to see that and think I can't keep a straight account of my own resources, or worse, that I'm hiding something by having two.” She thought, unhelpfully, of Aya's note, folded now in a drawer at home: *no action required of him.*"},
            {t:"p", x:"“Let them think it.” He met her eyes fully for the first time since she'd arrived. “I'd rather be a discrepancy in your file than a clean line that says I abandoned you the moment it cost me something. You can be careful with your own name. You don't get to be careful with mine on my behalf. That's not protection. That's just deciding for me.”"},
            {t:"p", x:"It landed harder than she expected, not because it was cruel, it wasn't, but because some part of her recognized, immediately and unwillingly, that it was fair. It sat uncomfortably close to something Renji had said to her in a Kurokawa corridor, offering her a version of safety she hadn't asked for and hadn't trusted. She'd filed that one away as exactly the kind of thing a man with something to gain would say. It was harder to file this one away the same way, coming from someone who stood to gain nothing from it but the cost of a shipment he hadn't needed to cover."},
            {t:"p", x:"“An Akaishi scion told me something in that same spirit a week ago,” she said, half to herself. “I didn't believe him either.”"},
            {t:"p", x:"“I'm not asking you to believe me for his reasons.” Genzou didn't ask who, and she didn't offer more than that. Whatever calculation Renji was running, it plainly wasn't the one Genzou was running, and she doubted either man would thank her for being weighed against the other."},
            {t:"br"},
            {t:"p", x:"“For what it's worth,” the rival buyer said, ambling back over now that the shouting portion of the afternoon had apparently concluded, “I'd have taken either of your money happily. No hard feelings on my end. Man wants to overpay for loyalty, that's between him and his ledger.” He said this entirely without malice, the way he seemed to say everything, and Kasane found she believed him: he really didn't care who won, as long as someone paid for what was already sitting in the cart."},
            {t:"p", x:"“You'll want it noted I approached you first,” Kasane said. “Not the other way around.”"},
            {t:"p", x:"“I'll note whatever's true. Doesn't cost me anything either way.” He glanced between them both again, something almost like curiosity crossing his flat professional face for the first time all afternoon. “For what it's worth, you two are having a stranger argument than the money usually buys. Most people just want the better rate.” He didn't wait for a response to that, already turning back toward his crew, entirely uninterested in whatever the actual argument had been about now that it wasn't going to change what he got paid."},
            {t:"p", x:"“Draw up whatever paperwork makes it official,” Genzou told him. “Under my name, from today forward. Kasane's account with you closes clean, no balance owed either direction.”"},
            {t:"p", x:"“Suits me.” He was already walking back toward his crew before he'd finished the sentence, entirely done with the human part of the transaction now that the financial part was settled."},
            {t:"br"},
            {t:"p", x:"They stood together for a while after that, not quite talking, watching the crews finish loading a cart that would now, on paper, tell a story neither arrangement alone would have told. The mist had come down early over the tree line, the ordinary kind, nothing wrong about it at all, and for a moment it was almost possible to pretend this was just a bad afternoon between a supplier and her factor rather than one more thread for someone else to pull."},
            {t:"p", x:"“I keep thinking I should apologize,” Kasane said eventually. “For going around you. And some part of me still thinks I was right to try.”"},
            {t:"p", x:"“You probably were right, about the risk.” He said it easily, no argument in it. “You've just never once in your life been wrong about a risk and right about a person in the same breath, and you didn't leave room for that happening to you today.” He almost smiled, the first real one she'd seen from him since the roadside. “For a woman who reads smoke better than anyone I've ever bought from, you're not half as good at reading me as you think.”"},
            {t:"p", x:"“I used to be.”"},
            {t:"p", x:"“You used to only need to read the parts of me that showed up in a ledger.” He shrugged, an oddly gentle gesture for a man built mostly out of angles and prices. “There's more of me than that. There always was. You just never needed to know it before.”"},
            {t:"p", x:"“That doesn't seem like a fair trade. You know things about me now that would frighten most of the valley. I get one paragraph about a man with a bad leg.”"},
            {t:"p", x:"“Life rarely trades even.” He almost smiled again, briefer this time. “You'll get the rest of it eventually, if you're patient and don't try to extract it the way you extract everything else. Some things don't come out faster for being pried at. You'd know that better than most, given what's presumably happening to your own eyes.”"},
            {t:"p", x:"It was, she thought, the closest thing to a joke he'd made since this had all started, and the strangest part was that it worked: some of the tightness in her chest eased slightly, not because anything had actually improved, but because he'd found room for it anyway."},
            {t:"p", x:"Kasane didn't have a clean answer for that, and for once didn't reach for one. “Thank you,” she said instead, because it was true, whatever else was also true."},
            {t:"p", x:"“Don't thank me yet.” Genzou said it without heat, watching the cart rather than her. “Ask me again once we know what it actually cost.”"},
            {t:"p", x:"She didn't have an answer for that either. They stood together a while longer in the mist, next to a cart carrying a shipment that would soon belong, on paper, to two people at once."},
            {t:"p", x:"Genzou left first, back toward whatever remained of his own day's business, with a brief, ordinary nod that carried none of the weight of what had just happened between them. He didn't look back once on his way up the path, which she understood, by now, wasn't indifference. It was just how he closed a ledger. Kasane watched him go, then stood alone by the cart for a while longer, watching the crew finish the loading they'd abandoned partway through, sacks going back onto the cart in the same order they'd come off it, as though the argument that had interrupted them had left no mark on the actual, physical work of moving charcoal from one place to another."},
            {t:"p", x:"Only she seemed to be carrying anything away from it. She started walking, and let herself start doing the arithmetic on exactly how bad the overlap might look to someone who'd never met either of them and had every reason to assume the worst: a habit she couldn't put down even now, on a day when the numbers, for once, weren't really the part that mattered."}
          ]
        },
        {
          id: 8,
          movement: "Movement III — Ownership",
          title: "Chapter Eight",
          blocks: [
            {t:"p", x:"Moritaka came to her door this time, which told Kasane something before he'd said a single word: Kurokawa hadn't needed to summon her again. Kurokawa had simply decided the matter was important enough to walk up the mountain for."},
            {t:"p", x:"He stood in her own doorway the way he'd stood at the registry table, hands folded, nothing about his bearing suggesting he'd just climbed a genuine mountain path to get there. Aya was a half-step behind him, carrying the same lacquered case she always carried, though today she held it slightly differently: closer to her body, Kasane thought, the way a person holds something they don't entirely want to be the one delivering."},
            {t:"p", x:"“May we come in,” Moritaka said, which wasn't really a question, though he waited for her answer anyway, which was its own kind of manners."},
            {t:"p", x:"She let them in. There wasn't a version of this where she didn't."},
            {t:"br"},
            {t:"p", x:"He didn't sit. He stood near her cold hearth with his hands still folded, and Aya set the case down on Kasane's own table: the first time an official document had ever been read out in this particular room, and Kasane found herself absurdly aware of how ordinary the table looked for the purpose, scarred from years of ordinary meals rather than built for this."},
            {t:"p", x:"“Two arrangements,” Moritaka said, without preamble. “Same shipment, same window, filed a day apart, under two different names, for a resource tied to your case. I want to be plain with you about what that looks like from where I sit, because I don't think anyone else has been.” He said it without heat, exactly as his voice notes had promised her he would, and somehow that made it land harder rather than softer. “It looks like either poor judgment or active concealment. I don't believe it's the second. I've read the file closely enough to believe it's the first: an attempt to manage a resource problem quietly, without institutional visibility, that produced exactly the kind of institutional visibility you were trying to avoid.”"},
            {t:"p", x:"“I was protecting someone,” Kasane said. “Not hiding anything.”"},
            {t:"p", x:"“I believe you.” Nothing in his face suggested performance. “That's almost beside the point. A person who can generate this kind of discrepancy while genuinely trying to do the right thing is not a person whose independent judgment can be trusted to manage her own risk. That's not a character judgment. It's an operational one.”"},
            {t:"p", x:"“My cooperation record is clean. I've answered every question anyone's asked me, given everyone everything I have...”"},
            {t:"p", x:"“Your cooperation has never been in question.” He said this simply, and it was somehow worse than if he'd disputed it. “Your judgment about what to do with information you're not required to report is what generated this. Cooperation and autonomy are different things. I'm not here about the first.”"},
            {t:"p", x:"Kasane looked past him to Aya, who was very carefully not looking at anyone, arranging papers that didn't need arranging."},
            {t:"p", x:"“Read her the terms,” Moritaka said, without any harshness in it, to Aya."},
            {t:"br"},
            {t:"p", x:"Aya read them without inflection, the same voice she'd used for the sequence of the Rent months and a lifetime ago, though something in the set of her shoulders had changed since then: less adversarial, more like a person carrying something heavy and trying not to let the strain show in her hands."},
            {t:"p", x:"“Effective from today: any change to your economic arrangements, supply, credit, transport, sale, must be reported to this office in advance of being finalized, not after. Any travel beyond the Black Mountain Belt requires prior notice, filed with sufficient time for a response. Contacts outside your established relationships,” a small pause here, so small Kasane might have missed it if she hadn't spent two months learning to read Aya's pauses, “should be reported at the office's discretion, though this office will exercise reasonable judgment about what constitutes a contact worth reporting.”"},
            {t:"p", x:"“That last part isn't standard language,” Kasane said. She wasn't sure how she knew that. She simply did."},
            {t:"p", x:"“No,” Aya said, still not looking up from the page. “It isn't.”"},
            {t:"p", x:"Moritaka's expression didn't change, though something in the room did: a small, silent negotiation that had apparently already happened somewhere Kasane hadn't been present for, the shape of which she could only infer from the fact that Aya had won some tiny fraction of it and both of them knew exactly how tiny."},
            {t:"p", x:"“You understand what this means,” Kasane said, to both of them and neither of them. “I can't fix a problem quietly anymore. Everything has to go through an office before I'm allowed to solve it myself.”"},
            {t:"p", x:"“Yes,” Moritaka said. “That's the intended effect.”"},
            {t:"p", x:"“Even if I'm right. Even if the solution I'd choose is a good one.”"},
            {t:"p", x:"“Especially then.” He said it plainly, no edge in it. “A good decision made invisibly is exactly as dangerous, from where Shirogane sits, as a bad one: we have no way to tell them apart until after they've already happened. You are not being restricted because you make poor choices. You're being restricted because your good choices are currently indistinguishable from your bad ones to anyone who isn't you. That's not a flaw in you. It's a flaw in how much anyone outside your own head can currently see.”"},
            {t:"p", x:"It was, infuriatingly, the most honest thing anyone from an institution had said to her since the collection post, and she hated how little comfort that honesty actually provided."},
            {t:"p", x:"“And if I refuse the terms,” she said. “What happens then.”"},
            {t:"p", x:"“Nothing dramatic.” Moritaka said it the way he said everything, as a fact rather than a threat. “You remain F-rank, Stirred, unrestricted, exactly as you are today. Shirogane simply stops proposing these terms quietly, between two offices, and instead raises the discrepancy formally, in front of everyone with a standing interest in your case. I'd expect you'd find considerably less say in what came out of that room than you have in this one, though I understand it might not feel that way in this exact moment.”"},
            {t:"p", x:"“That's not a choice. That's just a worse version of the same threat, dressed up as an option.”"},
            {t:"p", x:"“It's an accurate description of your actual alternatives,” Moritaka said, unmoved. “I didn't say it was a good choice. I said it was a real one. Most of the choices available to you from here forward are going to look like that, and I'd rather you hear it plainly from me now than discover it gradually, in worse circumstances, from someone with less reason to be straightforward with you.”"},
            {t:"p", x:"“How long,” she asked."},
            {t:"p", x:"“Under review,” Moritaka said. “Which means as long as it takes for someone to be persuaded otherwise. I'd suggest that isn't accomplished by generating more discrepancies.” He inclined his head, the barest fraction, the closest thing to a courtesy he'd offered all day. “I don't enjoy this part of the work. I want to be clear that not enjoying it changes nothing about whether it's necessary.”"},
            {t:"p", x:"He left without waiting to be shown out. Aya lingered a moment longer, closing her case with more care than the action required."},
            {t:"p", x:"“For what it's worth,” Aya said, quiet, not quite meeting her eyes, “the discretion clause was the only thing I could get moved. It isn't much.”"},
            {t:"p", x:"“It's something,” Kasane said, and meant it, though she wasn't sure either of them fully believed it yet."},
            {t:"br"},
            {t:"p", x:"Suzu arrived three days later, unannounced, carrying nothing more official than a small cloth bag that turned out to contain dried persimmons, which she set on the table without ceremony the way a neighbor might rather than the way an institution's representative would."},
            {t:"p", x:"She was younger-looking than Kasane had expected for a shrine-keeper: mid-thirties, unhurried in a way that had nothing to do with laziness, the calm of someone who'd learned to let silence do work that words usually rushed to do badly."},
            {t:"p", x:"“I won't take much of your time,” Suzu said, settling onto the offered cushion with the easy patience of someone used to sitting through long, uncertain conversations. “I have an actual question, not a pastoral visit dressed as one, though I hope it can be a bit of both.”"},
            {t:"p", x:"“That's more honesty than I've gotten from most people who've sat in that spot.”"},
            {t:"p", x:"“I find honesty costs less in the long run, even when it costs more today.” Suzu folded her hands, unhurried. “The Boundary Rite has a Consecration function: a blessing given to those newly registered, tied to the Rite's larger cycle. I need to know something no one's been able to tell me yet: does that blessing apply to you as written, or does an anomalous Marking require something altered, a different rite, or perhaps none at all, if the ordinary form would misrepresent what's actually happened to you.” She said this plainly, a genuine procedural puzzle rather than a philosophical one. “I'm not asking to satisfy my own curiosity. My shrine needs to know what to actually do when the Rite comes, and no one above me has been willing to give me an answer.”"},
            {t:"p", x:"“I don't know what my eyes are,” Kasane said. “I don't see how I'm the person who'd know what blessing fits them.”"},
            {t:"p", x:"“You may not know what they are.” Suzu's voice stayed gentle, unbothered by the correction. “But you're the only person who's actually lived inside whatever this is since it happened, and that's its own kind of knowledge, even if it isn't the kind anyone's asked you for yet. When did the wrongness first feel less like an injury and more like,” she paused, choosing the word with visible care, “an argument. Two things disagreeing, rather than one thing broken.”"},
            {t:"p", x:"It was, Kasane thought, an oddly precise question for someone who'd led with dried persimmons and unhurried patience. “The mist,” she said, before she'd decided to answer honestly. “On the mountain. Everything since has felt like the argument continuing, not a wound healing.”"},
            {t:"p", x:"“An argument implies two sides still speaking,” Suzu said, half to herself, turning that over the way Kasane might have turned over a report from the road. “A wound is one thing happening to another thing. That's a meaningfully different shape, for what it's worth to whoever eventually has to decide what to call it in front of a congregation.”"},
            {t:"p", x:"“Does the shape actually change what you do at the Rite?”"},
            {t:"p", x:"“It changes what I'd be lying about if I did the ordinary version unaltered.” Suzu said this simply, without drama. “A blessing for a wound asks for healing. I don't think you want healing, exactly: I think you want the argument settled on terms you can live with, which isn't the same prayer at all, if it's a prayer that means anything rather than words said because the calendar requires them.”"},
            {t:"p", x:"Kasane hadn't expected to feel anything in particular about a stranger's guess at what she wanted, and was faintly unsettled to find the guess had landed closer than most of the institutional questions she'd fielded all week."},
            {t:"p", x:"Suzu nodded slowly, as if this confirmed something she'd already suspected rather than taught her something new. “That's useful. More useful than you probably think.” She didn't explain what she meant by it, and Kasane found, oddly, that she didn't resent the withholding the way she'd resented every other unexplained thing all week: there was something in the manner of it that felt like patience rather than control."},
            {t:"p", x:"“You're not going to tell me what you think it means,” Kasane said."},
            {t:"p", x:"“Not today. Partly because I'm not certain, and I'd rather be honestly uncertain than confidently wrong in front of someone who's already had enough confidently wrong people this month.” Suzu allowed herself the ghost of a smile. “And partly because I think you want a diagnosis, and what I have is closer to an interpretation, and I don't think handing you the wrong one would actually help either of us.”"},
            {t:"p", x:"“Those aren't the same thing.”"},
            {t:"p", x:"“No,” Suzu agreed, entirely unbothered by being caught at it, in a way that reminded Kasane, distantly and warmly, of someone else who'd said almost the same thing to her in the last two weeks. “They're not. I'll tell you honestly which one I have the moment I'm sure of it. I won't pretend to have the other kind just because it would be more comforting to hand you.”"},
            {t:"p", x:"She left not long after, persimmons already half-forgotten on the table, no closer to an answer for either of them but somehow lighter for having asked the question honestly instead of not asking it at all."},
            {t:"br"},
            {t:"p", x:"Kasane sat alone with the fading light and the smell of someone else's dried fruit and did the arithmetic one more time, though it came out differently than it had after Kurokawa, or after the retrieval site, or after any of the other tallies this movement had asked of her."},
            {t:"p", x:"It wasn't a count of people anymore. It was a single, general fact, plain enough that she was almost embarrassed it had taken her this long to see it stated so simply: every time she had tried to fix something quietly, on her own, to spare someone else the cost of her situation, the situation had found a way to make that kindness expensive instead. Genzou. Herself. Whatever this was going to cost Aya, unspoken, in an office Kasane had never seen. The rules she'd wanted this to acquire had arrived, exactly as she'd asked, and they had turned out to be rules about her, not rules she got to use."},
            {t:"p", x:"She had wanted a life she could manage from outside it. She understood now, sitting in a room that no longer entirely belonged to her, that there was no outside left to manage it from."},
            {t:"p", x:"The persimmons sat where Suzu had left them, forgotten now by both of them for different reasons. Kasane ate one anyway, eventually, because the room had gone dark enough that doing something ordinary with her hands felt like the only decision left that day that was entirely hers to make."}
          ]
        },
        {
          id: 9,
          movement: "Movement IV — The Rule That Doesn't Work",
          title: "Chapter Nine",
          blocks: [
            {t:"p", x:"The notice had taken four days to approve, which Kasane had expected, and had come back with no comment attached at all, which she hadn't. She'd braced for a note, a condition, some small reminder of exactly how much of her own movement now belonged to an office three days from home. Instead there had just been a single stamped line confirming the dates, as flat and unremarkable as any other piece of paper, and she'd found the ordinariness of it almost more unsettling than a warning would have been."},
            {t:"p", x:"The training ground sat in a cleared bowl of land below one of Kuromori's smaller garrisons, ringed with worn earth and the permanent smell of a place where things were broken on purpose, regularly, by people who'd gotten used to it. Scorch marks scarred one whole section of the perimeter wall, old enough to have gone grey rather than black, and a stack of shields near the entrance showed the dented, gouged wear of equipment that existed specifically to be ruined slowly instead of once. Nothing about the place performed danger for an audience. It simply looked like what it was: somewhere ordinary damage happened often enough that nobody bothered dressing it up or hiding it."},
            {t:"p", x:"Isato was already there when she arrived, along with two of his crew standing well back with the loose, professional readiness of people who'd done this exact job before and knew better than to look bored about it. One of them, a broad-shouldered woman with a bandaged forearm that predated today by some margin, gave Kasane a single assessing look, not unfriendly, just the look of someone deciding how much attention a new variable deserved, and then went back to checking a coil of rope with the same unhurried thoroughness she'd probably give any piece of equipment that might need to save someone's life later."},
            {t:"p", x:"“You're on time,” Isato said, which from him she'd already learned counted as a genuine compliment. “Good. We've got daylight to spend and I'd rather not waste it on pleasantries.”"},
            {t:"br"},
            {t:"p", x:"The first trial was almost insultingly simple, and took her most of an hour anyway."},
            {t:"p", x:"“Hand on the stone,” Isato said, nodding at a fist-sized rock set on a bare patch of dirt. “Same thing that happened to you by accident with the cup. Do it on purpose this time. Small. Controlled. I want to see you choose it, not have it happen to you.”"},
            {t:"p", x:"She'd expected the deliberate version to feel different from the involuntary one: safer, somehow, for being chosen. It didn't. The same double pressure arrived behind both eyes the moment she reached for the edge of it, the same half-second of her fingers disagreeing with the stone about which of them was more real, and she pulled back out of pure reflex before she'd actually decided to."},
            {t:"p", x:"“That's a flinch,” Isato said. “Not a failure. Go again.”"},
            {t:"p", x:"She went again. The second time she let the wrongness sit instead of retreating from it, and felt her fingers sink a fraction into the stone's surface: not far, not dangerously, just enough to know she'd actually done it rather than merely survived a sensation. She held it there for as long as she dared, which wasn't very long at all, and let it go before her nerve did."},
            {t:"p", x:"“Again,” Isato said. “Longer this time. Half a breath more.”"},
            {t:"p", x:"She went a third time, and a fourth, each attempt costing her a little less of the flinch and a little more of something she didn't have a name for yet: less confidence than the hard-won familiarity of a tool that had stopped surprising her. By the fifth attempt she could feel the stone's wrongness arrive and simply note it, the way she'd have noted smoke changing color mid-burn, information rather than alarm."},
            {t:"p", x:"“Better.” Isato crouched down, turned the stone over once with his bare hand, checking it the way he'd have checked any piece of equipment after a test. “No damage. Good instinct on the release.” He looked up at her, something in his face that wasn't quite a smile but occupied the same general territory. “Most people take three days to get that far. You took an hour.”"},
            {t:"p", x:"“Is that meant to be encouraging.”"},
            {t:"p", x:"“It's meant to be true. Whether it encourages you is your business.” He stood, dusting off his hands. “Bigger, next.”"},
            {t:"br"},
            {t:"p", x:"The bigger object was a length of firewood the width of her forearm, and it cost her more, not in visible damage, but in the same draining way a longer burn cost more than a short one, a fatigue that had nothing to do with her muscles and everything to do with some other part of her that didn't have a name yet. It wasn't heavier in any way her hands could report. It was heavier in a register her hands had no prior experience measuring, the way some Ura-adjacent things were simply “heavier to reality” than their size suggested, and Isato hadn't needed to explain that concept to her so much as let her discover it directly, the way he seemed to prefer teaching most things. Her nose ran once, briefly, and she caught the faint copper taste before she'd consciously registered what it meant."},
            {t:"p", x:"“Blood,” one of the crew said, flat, more report than alarm."},
            {t:"p", x:"“I see it.” Isato didn't move to help her, and neither did anyone else, the whole crew watching with the same unhurried attention they'd have given a fire that was still burning within acceptable parameters: present, ready, entirely unbothered. It occurred to Kasane, wiping her own face with more curiosity than alarm, that this was probably a deliberate policy rather than simple callousness: a crew that flinched every time a trainee bled would teach its trainees to flinch too, and flinching, evidently, was the one thing Isato considered an actual failure, which she understood, after a moment, was itself a kind of respect: an assumption that she could assess her own state without being fussed over. “Kasane. Report.”"},
            {t:"p", x:"“Tired. Not hurt.” She wiped her nose with the back of her hand, checked the smear, found it unremarkable. “I can go again.”"},
            {t:"p", x:"“You can. Doesn't mean you should yet.” He studied her for a beat longer than the moment strictly required. “Five minutes. Drink something. Then we try duration, and duration's the one that actually matters, so I want you rested for it.”"},
            {t:"br"},
            {t:"p", x:"Holding the overlap longer than an instant turned out to be a different problem entirely from reaching into it at all: less like gripping something and more like continuously arguing with it, the way she might have continuously corrected a burn's draft rather than simply lighting it once and walking away. Isato had her start with nothing more than her own open hand, no object at all, holding a small patch of empty air in that half-resolved state for as long as she could manage."},
            {t:"p", x:"“Count it out loud,” he told her. “I want to know exactly where it starts costing you, not where you guess it does.”"},
            {t:"p", x:"She counted. One, two, steady, manageable, the pressure behind her eyes present but tolerable, the way a held breath was tolerable right up until it wasn't. She managed perhaps two full seconds on her first attempt, which Isato pronounced adequate, and reached for four on her second, which he pronounced reckless before she'd even finished the attempt."},
            {t:"p", x:"“Pull back,” he said, sharp, the first real urgency she'd heard in his voice all day."},
            {t:"p", x:"She didn't pull back fast enough. The world went sideways for a half-second longer than she'd budgeted for, one ear going deaf, her vision doubling on the tree line behind him in a way that made the whole horizon look briefly, impossibly stitched together at a seam that shouldn't have existed. For one stretched, airless moment she felt the ground under her own feet disagree with itself, the same wrongness she'd felt on the mountain months ago but folded smaller, contained, survivable. Then it resolved, all at once, into a headache sitting directly behind both eyes like a fist, and the ordinary training ground reassembled itself around her exactly as it had been."},
            {t:"p", x:"She was on one knee before she'd decided to kneel. Someone's hand, the crew woman with the bandaged forearm, she realized dimly, had closed around her upper arm without being asked, not lifting her, just anchoring her against the possibility of going further down."},
            {t:"p", x:"“That's four seconds you weren't ready for,” Isato said, once she'd confirmed, twice, that she could actually stand. “Noted. We stop pushing duration today.”"},
            {t:"p", x:"“I could have held it.”"},
            {t:"p", x:"“You held it. Holding and controlling aren't the same verb, whatever they feel like from the inside.” He said this the way he said everything, flat and certain, though something in it this time carried an edge she hadn't heard from him before, less anger than a man recognizing a shape he'd seen go wrong once already, somewhere she hadn't been present for. “You wanted to double back and reset after the second second. I watched you decide not to, because you'd already told me you could go to four. That's the only actual mistake you made today, and it wasn't the Stitch that made it.”"},
            {t:"p", x:"Kasane turned that over, still light-headed, and found she didn't have a clean answer for it, because he wasn't wrong: she had felt the small, internal flinch to stop, and had overridden it specifically because she hadn't wanted to look like she was retreating from her own stated number."},
            {t:"p", x:"“Understood,” she said, which wasn't quite agreement, and he seemed to know it wasn't, and let it go anyway."},
            {t:"p", x:"The crew woman with the bandaged forearm brought her water without being asked, crouching down to her level rather than making her reach up for it. “First real one always feels like that,” she said, kindly enough. “Worse before it gets better. Then one day it just doesn't, and you stop remembering to be surprised by it.” She said it like a fact rather than reassurance, which made it easier, somehow, to actually believe."},
            {t:"br"},
            {t:"p", x:"They ended the day sitting on the training ground's low earth wall, the crew already packing away what little equipment the day had actually required, the light going long and gold the way it had over Kurokawa on a very different afternoon weeks ago."},
            {t:"p", x:"“You're better at this than most people I've started from nothing,” Isato said, not looking at her, watching his own crew instead with the habitual vigilance of a man who never fully stopped supervising anything. “Better instincts than most. Worse habit of checking those instincts twice before trusting them.”"},
            {t:"p", x:"“You say that like it's a flaw you've catalogued before.”"},
            {t:"p", x:"“I have.” He didn't elaborate, and something in the flatness of the two words told her not to ask further today, the same way she'd learned not to push Genzou past a certain point. “Doesn't make the observation less true for you specifically just because I've made it about other people before.”"},
            {t:"p", x:"“That's not usually called a worse habit.”"},
            {t:"p", x:"“Not usually, no.” He allowed himself something almost like a smile. “Doesn't mean it isn't going to cost you eventually, in a line of work where the checking sometimes takes longer than you've got. I'd rather train it out of you now, somewhere it costs you a headache, than have you find the hard version of that lesson somewhere it costs you more.”"},
            {t:"p", x:"He nodded toward the ridge beyond the training ground, where a thin seam of disturbed ground marked what she now recognized, from a week of vocabulary she hadn't had before this, as an old, minor Ura-adjacent instability: the kind Kuromori's teams checked and cleared as a matter of routine."},
            {t:"p", x:"“Next session, we'll work there. My team's cleared it twice this season. Same general shape as what you handled today, just enough scale to be worth your time.” He said it the way he'd said everything else, matter-of-fact, already thinking about tomorrow's roster rather than today's headache. “Should be a straightforward step up. You've earned that much, at least.”"},
            {t:"p", x:"Kasane looked at the ridge, at the ordinary, unremarkable seam of disturbed ground sitting exactly where he'd pointed, and felt nothing in particular about it beyond the mild, competent readiness of someone looking at the next reasonable thing on a list. It looked, as far as she could tell from here, exactly like everything else she'd already handled today: the same kind of quiet, unglamorous wrongness she'd learned to recognize on her own mountain, translated onto ground she'd never personally walked."},
            {t:"p", x:"“Your team's cleared it,” she said. “Not me.”"},
            {t:"p", x:"“Same thing, for these purposes.” Isato said it easily, already standing, already thinking past this conversation toward whatever came after it. “It's the same category of instability, assessed by people who know what they're looking at. You don't need to have personally walked every inch of ground in Yamashiro to trust a clearance done properly.”"},
            {t:"p", x:"It sounded reasonable. It sounded, in fact, exactly like the kind of thing a competent person would say about a well-run operation, and Kasane, gathering her things for the walk back, found she had no actual argument against it at all. She filed the exchange away as ordinary shop talk between two people who trusted each other's competence, and thought no more about it on the walk home."}
          ]
        },
        {
          id: 10,
          movement: "Movement IV — The Rule That Doesn't Work",
          title: "Chapter Ten",
          blocks: [
            {t:"p", x:"The walk up took longer than the training ground had, a full morning through terrain that reminded her, more than once, of her own mountain: the same cold, thin air, the same scrub clinging low to rock that had never had enough soil to properly root in. She found herself watching the ground the whole way, out of habit more than suspicion, the way she'd have watched a road for washouts before a season of hauling carts over it."},
            {t:"p", x:"The ridge itself looked exactly like she'd expected it to look, which was itself the first thing that should have bothered her. A thin seam of disturbed ground, grey and dry at its center the way the mist had been dry on her own mountain, ringed by ordinary scrub that hadn't grown back quite right in a wide, unremarkable circle. Isato's crew had staked the perimeter with the same worn markers they'd used at the training ground, planted at careful, even intervals by people who had clearly done this exact job dozens of times before. Nothing about the site announced itself as different from anything she'd already handled."},
            {t:"p", x:"“My team cleared this twice this season,” Isato said, crouching at the seam's edge the way he crouched at everything, checking it with his hands before trusting it with his voice. “No hostile presence, no structural instability, nothing that's moved or changed since the last pass. You're looking at ground three people have already walked and confirmed safe.”"},
            {t:"p", x:"Kasane crouched beside him and found, without quite deciding to look for it, that she wanted to run her own hand along the seam's edge before doing anything more ambitious with it. It wasn't fear exactly. It was the same habit that had kept her checking a burn's draft twice even when the first check had already told her everything she needed to know, a small, automatic insistence on confirming a thing herself rather than trusting someone else's confirmation of it."},
            {t:"p", x:"“Give me a minute,” she said. “I want to look at it properly first.”"},
            {t:"p", x:"“Look at what, exactly.” Isato didn't say it unkindly, but there was an edge in it she recognized from the duration trial, the specific impatience of a man who'd already decided what the correct next action was and was waiting for her to catch up to it. “It's the same category of instability you handled twice at the training ground. Same signature, bigger scale. You're not scouting new terrain here. You're repeating a test you've already passed.”"},
            {t:"p", x:"“It's not the same terrain, though. It's terrain your team scouted for their reasons. I haven't scouted it for mine.”"},
            {t:"p", x:"“Your reasons and my team's reasons aren't as different as you're making them sound.” He stood, brushing dirt from his knees, already moving past the conversation the way he moved past most conversations once he considered them settled. “You've got good instincts, Kasane. I told you that three days ago. Instincts you keep second-guessing past the point where the second-guessing does you any good. This is exactly that pattern again. Commit. Trust what you already know how to do.”"},
            {t:"p", x:"She heard the shape of his argument and understood, even as she was hearing it, that it wasn't quite wrong. It simply wasn't right about her specifically, the same gap he'd named himself without recognizing it as a gap. She thought, briefly, of asking him plainly whether his crew had actually checked what she needed checked, rather than assuming her question and his team's clearance were answers to the same thing. She didn't ask it. Some part of her, tired of being the one who slowed every process down with another question, wanted this one to simply be easy for once."},
            {t:"p", x:"She stood at the edge of the seam a moment longer, feeling the small, familiar itch to check it herself, and then, because he was watching, because three days of genuine competence had made his confidence feel like something worth trusting instead of something worth questioning, she let the itch go."},
            {t:"p", x:"She reached in."},
            {t:"br"},
            {t:"p", x:"For half a heartbeat it felt exactly like the stone, the same double pressure behind both eyes, the same brief, manageable wrongness of her hand meeting a surface that couldn't decide what it actually was. Then it felt like nothing she'd experienced at all."},
            {t:"p", x:"Something was already there. Not solid the way the stone had been solid, not hostile the way a living thing might have been hostile, just present, occupying the exact space her hand was trying to occupy, in a way the seam itself seemed to register as an error rather than an event. It was nothing like the earlier flinch of contradiction, the small argument between two disagreeing surfaces she'd learned to sit through calmly. This was a wall arriving where there should have been give, a refusal with no negotiation built into it at all."},
            {t:"p", x:"The wrongness didn't resolve. It refused, violently, all at once, the way a rope pulled taut past its limit refuses to stretch any further and simply gives instead."},
            {t:"p", x:"She didn't remember deciding to fall. She remembered the ground arriving at her shoulder faster than it should have, her whole arm lit with a pain that had nothing to do with muscle or bone in any ordinary sense, and a sound in her own ears that took a full second to resolve into her own voice."},
            {t:"p", x:"“Kasane.” Isato was already at her side, hands moving fast and sure over her arm without actually touching the parts that were clearly the problem, the same practiced assessment she'd watched him give the training ground's equipment. “Kasane. Look at me. Not the arm. Me.”"},
            {t:"p", x:"She looked at him. Something in her vision doubled briefly and then settled, the horizon behind him resolving from two overlapping lines into one."},
            {t:"p", x:"“Report,” he said. “What do you feel.”"},
            {t:"p", x:"“Arm.” Her voice came out thinner than she wanted it to. “Something threw it back. Hard. It wasn't there and then it was, and it didn't want me in the same space it was in.”"},
            {t:"p", x:"“Broken or wrenched.”"},
            {t:"p", x:"“I don't know yet.” She tried to move her fingers and found they answered, slowly, painfully, but they answered. “Not broken, I think. It moves.”"},
            {t:"p", x:"“Good enough for now.” He was already calling something to his crew, short and specific, a name and a request for a splint and water, none of it wasted on reassurance she hadn't asked for."},
            {t:"p", x:"Two of them arrived within moments, moving with the same unhurried, well-drilled competence she'd noticed on her first day at the training ground, one crouching to check her pupils while the other laid out a splint kit she hadn't even seen anyone carry up the ridge with them. Nobody spoke more than the situation required. Nobody looked frightened either, which she understood, distantly, through the fading haze of the pain, was probably the most reassuring thing any of them could have done for her right now."},
            {t:"p", x:"To her, quieter, Isato said, “Don't try that arm again today. Don't try to explain it to yourself either, not yet. Shock makes bad theories.”"},
            {t:"p", x:"“I want to know what it was.”"},
            {t:"p", x:"“You will, eventually, maybe. Not from guessing at it with your arm still swelling.” He nodded once at the crew member working the splint, a small, wordless instruction she couldn't decode. “Right now I need you conscious and calm more than I need you curious. The curiosity can wait for tomorrow.”"},
            {t:"br"},
            {t:"p", x:"They sat together against the perimeter marker while the crew worked, Isato's hands steady on the splint in a way that told her this wasn't the first arm he'd ever set in the field. He worked without commentary for a while, the same silence he used when he was actually thinking rather than simply not talking."},
            {t:"p", x:"“That shouldn't have happened,” he said eventually, not looking up from the splint. “Not the way it did.”"},
            {t:"p", x:"“Your team cleared it.”"},
            {t:"p", x:"“My team cleared it for what my team checks for. Whether something's going to kill one of my people the next time they walk past it.” He tied off the last of the wrap, testing it once with two fingers before letting go. “Nobody on my crew has ever needed to ask what's sitting on the other side of a seam that isn't actively dangerous to a person standing on this one. That's not a question my training ever taught anyone to ask, because it's never been my problem to solve.”"},
            {t:"p", x:"“It's mine.”"},
            {t:"p", x:"“I know that now. I didn't know it clearly enough this morning, and that's the part I'm sitting with.” He glanced toward the seam, still and ordinary again, giving nothing away about what had just happened at its edge. “I've spent twenty years teaching people to trust a clearance once it's been given. Every one of them was asking a question my crew actually knew how to answer. You weren't. I didn't notice the difference until it was already too late to matter.”"},
            {t:"p", x:"“Apparently.” He said it plainly, without defensiveness, which she was coming to recognize as the closest thing to an apology he was likely to offer anyone. “You wanted to check it yourself first. I told you not to bother. I was wrong about that, specifically, today, in a way I wasn't wrong about the duration trial. I want to be precise about which mistake this actually was, because I don't think it does either of us any good to pretend it was the same one.”"},
            {t:"p", x:"“What mistake was it, then, if not the same one.”"},
            {t:"p", x:"“The other trial, you second-guessed a decision you'd already made correctly. Cost you a headache for nothing.” He finally looked at her directly. “This one, you had a correct instinct and I talked you out of using it. That's on me, not on your habit of checking things twice. I'm not going to tell you to stop checking things twice again. Not after this.”"},
            {t:"p", x:"It wasn't warmth, exactly. It didn't need to be. It was, she understood, a working professional revising one specific line item in an assessment he'd otherwise still stand behind, and something in the plainness of it landed harder than a real apology might have."},
            {t:"p", x:"“Does this change what happens next,” she asked. “The trials. What Kuromori decides about me.”"},
            {t:"p", x:"“Some.” He considered the question honestly before answering it, which she'd learned by now to read as a genuine courtesy rather than hesitation. “It goes in the file as evidence you're bounded in ways nobody fully understood yet, not as evidence you can't be trusted with the work. Those look similar on paper to people who don't read carefully. They aren't the same finding, and I'll write it that way.” He paused. “Whether anyone above me chooses to read it carefully is a different question, and not one I can answer for you today.”"},
            {t:"br"},
            {t:"p", x:"They let her rest before the walk back, her arm bound tight and aching in a way that promised to be worse tomorrow than it was today. Isato's crew packed up around her with the same unhurried competence they brought to everything, nobody treating the injury as more dramatic than it was, nobody treating it as less than it was either."},
            {t:"p", x:"Kasane sat with her back against the marker and looked out at the seam one more time, ordinary again now that whatever had rejected her had settled back into whatever quiet, occupied stillness it existed in when nobody was reaching into it. It gave her nothing else. No hum of danger, no visible mark of what had just happened at its edge, nothing a stranger walking past would ever think to fear. It would sit here, unremarkable and unresolved, long after she'd stopped thinking about it daily, the way most of the actually dangerous things in her life seemed to."},
            {t:"p", x:"She had spent two movements now testing the only two private strategies she had. Careful, contained cooperation had cost Genzou something and cost her the last of her own autonomy. Deliberate, disciplined mastery had cost her an arm and taught her that competence alone couldn't tell her what she didn't yet know to ask about."},
            {t:"p", x:"Neither one had made her safer, not on its own. Both had simply proven, in their own separate and expensive ways, exactly how much she still didn't understand about the actual shape of the thing living inside her life now."},
